D[0][3]=`<h3>۱) ضمایر شخصی و صرف فعل در زمان حال</h3><p>فعل در آلمانی با فاعل تغییر می‌کند: ریشهٔ فعل + شناسه (‑e, ‑st, ‑t, ‑en, ‑t, ‑en).</p><table><tr><th></th><th>sein</th><th>haben</th><th>heißen</th><th>kommen</th><th>wohnen</th></tr><tr><td>ich</td><td>bin</td><td>habe</td><td>heiße</td><td>komme</td><td>wohne</td></tr><tr><td>du</td><td>bist</td><td>hast</td><td>heißt</td><td>kommst</td><td>wohnst</td></tr><tr><td>er/sie/es</td><td>ist</td><td>hat</td><td>heißt</td><td>kommt</td><td>wohnt</td></tr><tr><td>wir</td><td>sind</td><td>haben</td><td>heißen</td><td>kommen</td><td>wohnen</td></tr><tr><td>ihr</td><td>seid</td><td>habt</td><td>heißt</td><td>kommt</td><td>wohnt</td></tr><tr><td>sie/Sie</td><td>sind</td><td>haben</td><td>heißen</td><td>kommen</td><td>wohnen</td></tr></table><p><b>نکته:</b> du = تو (صمیمی)، ihr = شما (جمع، صمیمی)، Sie با S بزرگ = شما (رسمی، مفرد و جمع). sie (کوچک) = او (زن) یا آن‌ها. فعل‌های sein و haben بی‌قاعده‌اند و باید حفظ شوند.</p><h3>۲) سؤال‌ها</h3><p><b>سؤال با کلمهٔ پرسشی (W-Frage):</b> کلمهٔ پرسشی در جایگاه اول، فعل در جایگاه دوم.</p><div class=e>Wie heißt du? · Woher kommst du? · Wo wohnst du? · Wie alt bist du? · Was bist du von Beruf? · Wer ist das?</div><p><b>سؤال بله/نه:</b> فعل در جایگاه اول.</p><div class=e>Wohnst du in Berlin? – Ja, ich wohne in Berlin. / Nein, ich wohne in Köln.</div><h3>۳) آرتیکل (حالت Nominativ)</h3><table><tr><th></th><th>der (مذکر)</th><th>die (مؤنث)</th><th>das (خنثی)</th><th>die (جمع)</th></tr><tr><td>معرفه</td><td>der Mann</td><td>die Frau</td><td>das Kind</td><td>die Kinder</td></tr><tr><td>نکره</td><td>ein Mann</td><td>eine Frau</td><td>ein Kind</td><td>—</td></tr><tr><td>منفی</td><td>kein Mann</td><td>keine Frau</td><td>kein Kind</td><td>keine Kinder</td></tr></table><p>جنسیت هر اسم را همراه آرتیکلش حفظ کن (مثلاً <b>die Lampe</b>، نه فقط Lampe). برای اسم‌ها از kein استفاده می‌شود و برای فعل و صفت از nicht.</p><h3>۴) Possessivartikel (ضمایر ملکی)</h3><table><tr><th>ich</th><th>du</th><th>er/es</th><th>sie</th><th>wir</th><th>ihr</th><th>sie/Sie</th></tr><tr><td>mein</td><td>dein</td><td>sein</td><td>ihr</td><td>unser</td><td>euer</td><td>ihr/Ihr</td></tr></table><p>مثل ein صرف می‌شوند: مذکر و خنثی بدون پایانه (<b>mein</b> Vater، <b>mein</b> Kind)، مؤنث و جمع با ‑e (<b>meine</b> Mutter، <b>meine</b> Eltern).</p><h3>۵) لغات مهم</h3><p><b>اعداد:</b> 0 null · 1 eins · 2 zwei · 3 drei · 4 vier · 5 fünf · 6 sechs · 7 sieben · 8 acht · 9 neun · 10 zehn · 11 elf · 12 zwölf · 13 dreizehn · 20 zwanzig · 21 einundzwanzig · 30 dreißig · 100 hundert</p><p><b>ساعت:</b> 3:00 drei Uhr · 3:15 Viertel nach drei · 3:30 halb vier · 3:45 Viertel vor vier</p><p><b>خانواده:</b> die Eltern · der Vater · die Mutter · der Bruder · die Schwester · die Großeltern · der Freund/die Freundin</p><p><b>شغل و ملیت:</b> der Student/die Studentin · der Lehrer/die Lehrerin · der Arzt/die Ärztin · der Trainer · der Iraner/die Iranerin · der Deutsche/die Deutsche. جمله: Ich komme aus <b>dem</b> Iran. · Ich bin Iraner.</p><h3>۶) نمونه متن معرفی</h3><div class=e>Hallo! Ich heiße Mehdi und ich bin 22 Jahre alt. Ich komme aus dem Iran und wohne in Teheran. Meine Familie ist groß: Ich habe zwei Brüder und eine Schwester. Ich bin Schwimmtrainer von Beruf.</div><p><b>تمرین مکالمه:</b> همین متن را با اطلاعات خودت بلند بخوان (۳ بار) و بعد با من در چت تمرین کن.</p>`;

D[1][3]=`<h3>۱) افعال جداشدنی (trennbar)</h3><p>پیشوند در جملهٔ اصلی جدا می‌شود و به آخر جمله می‌رود. پیشوندهای رایج: auf-, an-, ab-, ein-, aus-, mit-, vor-, zu-, zurück-.</p><div class=e>aufstehen → Ich stehe um 7 Uhr <b>auf</b>.<br>einkaufen → Wir kaufen im Supermarkt <b>ein</b>.<br>anrufen → Er ruft seine Mutter <b>an</b>.<br>abfahren → Der Zug fährt um 8 Uhr <b>ab</b>.</div><p>با فعل مُدال، فعل کامل (مصدر) در آخر می‌آید: Ich muss früh <b>aufstehen</b>.</p><h3>۲) افعال جدانشدنی (untrennbar)</h3><p>پیشوندهای be-, ver-, er-, ent-, ge-, zer-, miss- هیچ‌وقت جدا نمی‌شوند: besuchen (Er besucht mich), verstehen (Ich verstehe das), bekommen, erklären.</p><h3>۳) افعال انعکاسی (reflexiv)</h3><table><tr><th></th><th>sich waschen</th><th>sich freuen</th></tr><tr><td>ich</td><td>wasche mich</td><td>freue mich</td></tr><tr><td>du</td><td>wäschst dich</td><td>freust dich</td></tr><tr><td>er/sie/es</td><td>wäscht sich</td><td>freut sich</td></tr><tr><td>wir</td><td>waschen uns</td><td>freuen uns</td></tr><tr><td>ihr</td><td>wascht euch</td><td>freut euch</td></tr><tr><td>sie/Sie</td><td>waschen sich</td><td>freuen sich</td></tr></table><h3>۴) جایگاه فعل در جملهٔ اصلی</h3><p>فعل صرف‌شده همیشه در جایگاه <b>دوم</b> است. اگر چیز دیگری (مثلاً زمان) اول جمله بیاید، فاعل بعد از فعل می‌آید (Inversion).</p><div class=e>Ich gehe heute ins Kino.<br><b>Heute gehe</b> ich ins Kino.<br><b>Morgen stehe</b> ich früh auf.</div><h3>۵) افعال مُدال</h3><table><tr><th></th><th>können</th><th>müssen</th><th>wollen</th><th>dürfen</th><th>sollen</th><th>mögen</th></tr><tr><td>ich</td><td>kann</td><td>muss</td><td>will</td><td>darf</td><td>soll</td><td>mag</td></tr><tr><td>du</td><td>kannst</td><td>musst</td><td>willst</td><td>darfst</td><td>sollst</td><td>magst</td></tr><tr><td>er/sie/es</td><td>kann</td><td>muss</td><td>will</td><td>darf</td><td>soll</td><td>mag</td></tr><tr><td>wir/sie/Sie</td><td>können</td><td>müssen</td><td>wollen</td><td>dürfen</td><td>sollen</td><td>mögen</td></tr><tr><td>ihr</td><td>könnt</td><td>müsst</td><td>wollt</td><td>dürft</td><td>sollt</td><td>mögt</td></tr></table><p>معنی‌ها: können = توانستن · müssen = باید (اجبار) · wollen = خواستن · dürfen = اجازه داشتن · sollen = باید (توصیه/دستور دیگران) · mögen = دوست داشتن. فعل دوم به‌صورت مصدر در پایان جمله می‌رود: Ich <b>kann</b> gut schwimmen.</p><h3>۶) لغات</h3><p><b>قید تکرار:</b> immer (همیشه) · oft · manchmal · selten · nie (هرگز). <b>روزانه:</b> aufstehen · frühstücken · zur Arbeit fahren · lernen · kochen · schlafen. <b>خانه:</b> putzen · abwaschen · Wäsche waschen · aufräumen. <b>ساعت:</b> 7:15 Viertel nach sieben · 7:45 Viertel vor acht.</p>`;

D[2][3]=`<h3>۱) Akkusativ و Dativ</h3><p>Akkusativ = مفعول مستقیم (wen/was؟) · Dativ = مفعول غیرمستقیم (wem؟). در Akkusativ فقط مذکر تغییر می‌کند.</p><table><tr><th></th><th>der (m)</th><th>die (f)</th><th>das (n)</th><th>die (pl)</th></tr><tr><td>Nominativ</td><td>der</td><td>die</td><td>das</td><td>die</td></tr><tr><td>Akkusativ</td><td><b>den</b></td><td>die</td><td>das</td><td>die</td></tr><tr><td>Dativ</td><td><b>dem</b></td><td><b>der</b></td><td><b>dem</b></td><td><b>den</b>+n</td></tr><tr><td>ein-: Nom / Akk / Dat</td><td>ein / <b>einen</b> / <b>einem</b></td><td>eine / eine / <b>einer</b></td><td>ein / ein / <b>einem</b></td><td>— / — / —</td></tr></table><div class=e>Ich sehe <b>den</b> Mann. (Akk)<br>Ich helfe <b>dem</b> Mann. (Dat)<br>Ich gebe <b>den Kindern</b> ein Buch. (Dat pl + n)</div><h3>۲) Wechselpräpositionen (حروف اضافهٔ دوحالته)</h3><p><b>an, auf, hinter, in, neben, über, unter, vor, zwischen</b></p><p>قانون طلایی: <b>Wo؟</b> (مکان ثابت) ← <b>Dativ</b> · <b>Wohin؟</b> (حرکت به‌سوی مقصد) ← <b>Akkusativ</b></p><div class=e>Das Buch liegt <b>auf dem</b> Tisch. (Wo?)<br>Ich lege das Buch <b>auf den</b> Tisch. (Wohin?)<br>Er geht <b>in die</b> Küche. (Wohin?) · Er ist <b>in der</b> Küche. (Wo?)</div><table><tr><th>Wo؟ (Dativ) – حالت</th><th>Wohin؟ (Akkusativ) – حرکت</th></tr><tr><td>stehen (ایستاده بودن)</td><td>stellen (گذاشتن، عمودی)</td></tr><tr><td>liegen (خوابیده بودن)</td><td>legen (گذاشتن، افقی)</td></tr><tr><td>sitzen (نشسته بودن)</td><td>(sich) setzen (نشاندن/نشستن)</td></tr><tr><td>hängen (آویزان بودن)</td><td>hängen (آویزان کردن)</td></tr></table><p><b>ادغام‌ها:</b> in dem = <b>im</b> · an dem = <b>am</b> · in das = <b>ins</b> · an das = <b>ans</b> · auf das = <b>aufs</b> · zu dem = <b>zum</b> · zu der = <b>zur</b> · von dem = <b>vom</b> · bei dem = <b>beim</b></p><h3>۳) حروف اضافه‌ای که همیشه Dativ می‌گیرند</h3><p><b>aus, bei, mit, nach, von, zu</b> (+ seit, gegenüber)</p><div class=e>Ich gehe <b>zum</b> Arzt. · Ich gehe <b>zur</b> Schule.<br>Ich bin <b>zu</b> Hause. (در خانه) · Ich fahre <b>nach</b> Hause. (به خانه)<br>Ich fahre <b>nach</b> Berlin. (شهر و کشور بدون آرتیکل) · Ich komme <b>aus dem</b> Iran.<br>Die Post ist <b>gegenüber der</b> Bank.</div><h3>۴) Es gibt + Akkusativ</h3><p>برای گفتن «وجود دارد». بعد از آن همیشه Akkusativ می‌آید و برای مفرد و جمع شکل ثابت است.</p><div class=e>Es gibt <b>einen</b> Park. · Es gibt <b>eine</b> Bank. · Es gibt <b>ein</b> Café. · Es gibt viele Geschäfte.<br>Es gibt hier <b>keinen</b> Supermarkt. · Gibt es hier eine Apotheke?</div><h3>۵) لغات</h3><p><b>مبل:</b> der Tisch · der Stuhl · der Schrank · der Sessel · das Sofa · das Bett · das Regal · die Lampe · die Kommode</p><p><b>اتاق‌ها:</b> das Wohnzimmer · das Schlafzimmer · die Küche · das Bad · der Flur · der Balkon · die Wand · das Fenster</p><p><b>شهر:</b> der Bahnhof · die Post · die Bank · die Apotheke · der Supermarkt · die Haltestelle · die Ampel · die Kreuzung</p><p><b>مسیر:</b> geradeaus · links · rechts · an der Ampel · bis zur Kreuzung · die erste/zweite Straße · gegenüber · neben · in der Nähe</p><h3>۶) نمونه گفتگوی مسیر</h3><div class=e>– Entschuldigung, wie komme ich zum Bahnhof?<br>– Gehen Sie geradeaus bis zur Ampel. Dann gehen Sie links. Der Bahnhof ist rechts, neben der Post.<br>– Danke schön!</div><p>گفتن آدرس با Sie از Imperativ استفاده می‌کند: Gehen Sie ..., Fahren Sie ...</p>`;

['o','Die Lampe hängt über dem Tisch','لامپ بالای میز آویزان است','über + Dativ (Wo؟): dem Tisch.'],['o','Ich stelle die Lampe auf den Tisch','لامپ را روی میز می‌گذارم','stellen + Akkusativ (Wohin؟): auf den Tisch.'],['o','Das Sofa steht im Wohnzimmer','مبل در اتاق نشیمن است','stehen + Dativ: in dem = im.'],['o','Es gibt einen Balkon und zwei Zimmer','یک بالکن و دو اتاق وجود دارد','Es gibt + Akkusativ: einen Balkon؛ Zimmer در جمع تغییر نمی‌کند.'],['o','Die Apotheke ist neben der Bank','داروخانه کنار بانک است','neben + Dativ؛ die Bank → der Bank.'],['o','Gehen Sie geradeaus und dann links','مستقیم بروید و بعد چپ','Imperativ با Sie: فعل اول جمله می‌آید (Gehen Sie ...).'],['o','Wie komme ich zum Bahnhof','چطور به ایستگاه قطار برسم؟','zu + dem = zum؛ Wie komme ich ... برای پرسیدن مسیر است.'],['o','Meine Wohnung hat ein Wohnzimmer und eine Küche','آپارتمان من یک اتاق نشیمن و یک آشپزخانه دارد','haben + Akkusativ: ein Wohnzimmer (خنثی)، eine Küche (مؤنث).'],['o','Der Schrank steht neben dem Bett','کمد کنار تخت است','neben + Dativ: dem Bett.'],['o','Ich hänge das Bild an die Wand','عکس را به دیوار آویزان می‌کنم','hängen (حرکت) + Akkusativ: an die Wand.'],['o','Die Post ist gegenüber vom Supermarkt','پست روبه‌روی سوپرمارکت است','gegenüber von + Dativ: von dem = vom.'],['o','Wir gehen heute Abend ins Kino','امشب به سینما می‌رویم','Wohin؟ → in das = ins.']);

D[0][4]=[{t:'Selbstvorstellung (معرفی خود)',n:40,p:'دربارهٔ خودت بنویس: اسم، سن، کشور و شهر، خانواده، شغل و یک سرگرمی. حداقل ۴۰ کلمه.',ph:'Ich heiße ... · Ich bin ... Jahre alt.<br>Ich komme aus ... und wohne in ...<br>Ich habe ... Brüder / Schwestern.<br>Von Beruf bin ich ... · Mein Hobby ist ...<br>In meiner Freizeit ... ich gern ...',m:'Hallo! Ich heiße Mehdi und ich bin 22 Jahre alt. Ich komme aus dem Iran und wohne in Teheran. Meine Familie ist groß: Ich habe zwei Brüder und eine Schwester. Von Beruf bin ich Schwimmtrainer. In meiner Freizeit spiele ich gern Basketball.',c:['هر جمله فعل در جایگاه دوم دارد','فعل با فاعل جور است (ich bin / du bist / er ist)','همهٔ اسم‌ها با حرف بزرگ نوشته شده‌اند','mein / meine با جنس اسم جور است','هر جمله با نقطه تمام می‌شود']},{t:'Persönliche E-Mail (ایمیل دوستانه)',n:60,p:'برای یک دوست آلمانی ایمیل بنویس و خودت را معرفی کن. از سلام شروع کن و با خداحافظی تمام کن. حداقل ۶۰ کلمه.',ph:'Liebe Anna, / Lieber Tom,<br>vielen Dank für deine E-Mail!<br>Ich möchte mich kurz vorstellen: ...<br>Wie geht es dir? · Und du?<br>Schreib mir bald! · Liebe Grüße / Viele Grüße, Mehdi',m:'Liebe Anna,<br>vielen Dank für deine E-Mail! Ich möchte mich kurz vorstellen: Ich heiße Mehdi und bin 22 Jahre alt. Ich komme aus dem Iran und wohne in Teheran. Meine Familie ist groß: Ich habe zwei Brüder und eine Schwester. Ich bin Schwimmtrainer von Beruf. In meiner Freizeit spiele ich gern Basketball. Und du? Wie geht es dir? Schreib mir bald!<br>Liebe Grüße<br>Mehdi',c:['ایمیل با Liebe/Lieber + اسم شروع شده و بعد از آن کاما آمده','چند جمله معرفی با ich نوشته‌ام','یک سؤال از دوستم پرسیده‌ام (Wie geht es dir?)','پایان ایمیل Liebe Grüße + اسم من است','du/dein (صمیمی) را به‌جای Sie به کار برده‌ام']}];
D[1][4]=[{t:'Mein typischer Tagesablauf (یک روز معمولی)',n:60,p:'دربارهٔ یک روز معمولی خودت بنویس (صبح تا شب) و حداقل یک فعل جداشدنی، یک فعل انعکاسی و یک فعل مُدال بیاور. حداقل ۶۰ کلمه.',ph:'Ich stehe um ... Uhr auf. · Ich dusche mich / Ich wasche mich ...<br>Zuerst ..., dann ..., danach ..., am Abend ...<br>Ich muss / kann / will ... (+ Infinitiv am Ende)<br>immer · oft · manchmal · selten · nie<br>Am Wochenende schlafe ich lange.',m:'Mein Tag beginnt um sechs Uhr. Ich stehe auf, dusche mich und frühstücke. Um sieben Uhr fahre ich zur Arbeit. Ich arbeite als Trainer und muss viele Kinder unterrichten. Mittags esse ich oft Reis mit Hähnchen. Nach der Arbeit gehe ich manchmal ins Fitnessstudio. Am Abend lerne ich Deutsch und sehe fern. Um elf Uhr gehe ich ins Bett. Am Wochenende schlafe ich lange.',c:['فعل در جایگاه دوم است (حتی وقتی قید زمان اول جمله آمده)','پیشوند فعل جداشدنی آخر جمله آمده (stehe ... auf)','بعد از مُدال، فعل اصلی مصدر و آخر جمله است','ضمیر انعکاسی با فاعل جور است (ich ... mich)','حداقل ۲ قید تکرار (oft, manchmal, ...) به کار برده‌ام']},{t:'Meine Gewohnheiten (عادت‌ها)',n:40,p:'۵ جمله دربارهٔ عادت‌هایت با قیدهای تکرار (immer تا nie) و ۳ جمله با فعل مُدال بنویس.',ph:'Ich trinke immer ... · Ich esse oft ...<br>Manchmal gehe ich ... · Ich sehe selten fern.<br>Ich rauche nie.<br>Ich muss ... · Ich kann gut ... · Ich will ... besuchen.',m:'Ich trinke immer Tee am Morgen. Ich esse oft Fisch. Manchmal gehe ich ins Kino. Ich sehe selten fern. Ich rauche nie. Ich muss früh aufstehen. Ich kann gut schwimmen. Am Wochenende will ich Freunde besuchen.',c:['در جمله‌های ۵گانه از immer/oft/manchmal/selten/nie استفاده کرده‌ام','۳ جمله با مُدال نوشته‌ام و مصدر آخر جمله است','صرف مُدال با فاعل جور است (ich kann / er kann / ihr könnt)']}];
D[2][4]=[{t:'Meine Wohnung beschreiben (توصیف خانه)',n:60,p:'خانه‌ات را توصیف کن: تعداد اتاق‌ها، مبل و جای قرار گرفتن هر کدام (با Dativ) و محله (با Es gibt). حداقل ۶۰ کلمه.',ph:'Meine Wohnung hat ... Zimmer.<br>Im Wohnzimmer steht ein Sofa. · Neben dem Sofa steht ...<br>Das Bild hängt an der Wand. · Die Lampe hängt über dem Tisch.<br>Es gibt einen Balkon. · In der Nähe gibt es ...',m:'Meine Wohnung ist nicht groß, aber gemütlich. Sie hat ein Wohnzimmer, ein Schlafzimmer, eine Küche und ein Bad. Im Wohnzimmer steht ein Sofa, und neben dem Sofa steht eine Lampe. Das Bild hängt an der Wand. Im Schlafzimmer gibt es ein Bett und einen Schrank. Es gibt auch einen kleinen Balkon. In der Nähe gibt es einen Supermarkt und eine Bushaltestelle.',c:['برای مکان ثابت (Wo؟) از Dativ استفاده کرده‌ام (im, am, auf dem)','بعد از Es gibt مذکر با einen آمده است','جنس اسم‌ها (der/die/das) را درست نوشته‌ام','حداقل ۳ حرف اضافهٔ مکانی (neben, über, in, an) به کار برده‌ام']},{t:'Wohnungsanzeige (آگهی اجاره خانه)',n:50,p:'یک آگهی اجارهٔ آپارتمان بنویس: متراژ، اتاق‌ها، اجاره، محله، زمان تحویل و راه تماس. حداقل ۵۰ کلمه.',ph:'Zu vermieten: ... · 2-Zimmer-Wohnung, 55 m²<br>Die Wohnung hat ... · Es gibt einen Balkon / einen Keller.<br>Die Miete beträgt ... Euro (warm / kalt).<br>Die Wohnung liegt in der Nähe von ... · Frei ab ...<br>Kontakt: Tel. ...',m:'Zu vermieten: Schöne 2-Zimmer-Wohnung, 55 m², im 3. Stock. Die Wohnung hat ein Wohnzimmer, ein Schlafzimmer, eine Küche, ein Bad und einen Balkon. Die Miete beträgt 500 Euro warm. Die Wohnung liegt in der Nähe vom Bahnhof. Es gibt einen Supermarkt und eine Apotheke in der Nähe. Frei ab 1. Januar. Kontakt: 0123 456789.',c:['آگهی با Zu vermieten شروع شده','تعداد اتاق‌ها، اجاره و متراژ نوشته شده','یک جمله با Es gibt + Akkusativ نوشته‌ام','محله و زمان تحویل ذکر شده','راه تماس در پایان آمده']}];
D[3][3]=`<h3>۱) منفی کردن: kein و nicht</h3><p><b>kein</b> برای اسم‌هایی که ein یا بدون آرتیکل هستند (مثل ein صرف می‌شود). <b>nicht</b> برای فعل، صفت و اسم‌هایی که آرتیکل معرفه دارند.</p><table><tr><th></th><th>m</th><th>f</th><th>n</th><th>pl</th></tr><tr><td>Nominativ</td><td>kein</td><td>keine</td><td>kein</td><td>keine</td></tr><tr><td>Akkusativ</td><td><b>keinen</b></td><td>keine</td><td>kein</td><td>keine</td></tr></table><div class=e>Hast du einen Hund? – Nein, ich habe <b>keinen</b> Hund.<br>Ich esse <b>kein</b> Fleisch. · Wir haben <b>keine</b> Zeit.<br>Ich arbeite heute <b>nicht</b>. (فعل → nicht آخر جمله)<br>Das Essen ist <b>nicht</b> gut. (قبل از صفت)<br>Ich esse <b>nicht</b> gern Fisch. (قبل از gern)</div><p><b>Doch:</b> پاسخ مثبت به سؤال منفی. – Hast du keinen Hunger? – <b>Doch</b>, ich habe Hunger!</p><h3>۲) حالت امری (Imperativ)</h3><table><tr><th>فعل</th><th>du</th><th>ihr</th><th>Sie</th></tr><tr><td>kommen</td><td>Komm!</td><td>Kommt!</td><td>Kommen Sie!</td></tr><tr><td>machen</td><td>Mach!</td><td>Macht!</td><td>Machen Sie!</td></tr><tr><td>warten</td><td>Warte!</td><td>Wartet!</td><td>Warten Sie!</td></tr><tr><td>lesen</td><td><b>Lies!</b></td><td>Lest!</td><td>Lesen Sie!</td></tr><tr><td>essen</td><td><b>Iss!</b></td><td>Esst!</td><td>Essen Sie!</td></tr><tr><td>nehmen</td><td><b>Nimm!</b></td><td>Nehmt!</td><td>Nehmen Sie!</td></tr><tr><td>geben</td><td><b>Gib!</b></td><td>Gebt!</td><td>Geben Sie!</td></tr><tr><td>fahren</td><td>Fahr!</td><td>Fahrt!</td><td>Fahren Sie!</td></tr><tr><td>sein</td><td><b>Sei!</b></td><td><b>Seid!</b></td><td><b>Seien Sie!</b></td></tr></table><p>du: ریشه فعل (بدون ضمیر و بدون st). افعال e→i/ie این تغییر را نگه می‌دارند، اما افعال a→ä اوملاوت نمی‌گیرند (Fahr!). با فعل جداشدنی پیشوند آخر می‌رود: <b>Mach</b> die Tür <b>zu</b>! · <b>Steh</b> auf!</p><h3>۳) مقدار و تعداد</h3><div class=e>ein Kilo Äpfel · zwei Kilo Äpfel (واحد وزن جمع نمی‌شود)<br>ein Liter Milch · 100 Gramm Käse · ein Pfund Zucker<br>eine Flasche Wasser · eine Packung Nudeln · eine Dose Tomaten<br>ein Glas Honig · eine Tasse Tee · ein Stück Kuchen · ein Becher Joghurt</div><p>بعد از واحد مقدار، اسم بدون von و بدون آرتیکل می‌آید. <b>viel/wenig</b> برای اسم ناشمارنده (viel Wasser)، <b>viele/wenige</b> برای جمع (viele Äpfel). قیمت: Was kostet ...? – Das macht 5,50 Euro (»fünf Euro fünfzig«).</p><h3>۴) افعال با Akkusativ و Dativ</h3><table><tr><th>فقط Akkusativ</th><th>فقط Dativ</th><th>Dativ + Akkusativ</th></tr><tr><td>kaufen, essen, trinken, brauchen, nehmen, bestellen</td><td>helfen, schmecken, gefallen, gehören, danken</td><td>geben, schenken, zeigen, bringen</td></tr></table><div class=e>Ich kaufe <b>das</b> Brot. (Akk)<br>Das Essen schmeckt <b>mir</b>. (Dat) · Ich helfe <b>der</b> Frau. (Dat)<br>Ich gebe <b>dem Kind</b> <b>einen</b> Apfel. (شخص Dat جلوتر از چیز Akk)<br>Ich gebe <b>es ihm</b>. (با ضمیر: Akk قبل از Dat)</div><table><tr><th></th><th>ich</th><th>du</th><th>er</th><th>sie</th><th>es</th><th>wir</th><th>ihr</th><th>sie/Sie</th></tr><tr><td>Akk</td><td>mich</td><td>dich</td><td>ihn</td><td>sie</td><td>es</td><td>uns</td><td>euch</td><td>sie/Sie</td></tr><tr><td>Dat</td><td>mir</td><td>dir</td><td>ihm</td><td>ihr</td><td>ihm</td><td>uns</td><td>euch</td><td>ihnen/Ihnen</td></tr></table><h3>۵) لغات</h3><p><b>غذا:</b> das Brot · die Butter · der Käse · die Milch · das Ei (die Eier) · der Reis · das Fleisch · das Hähnchen · der Fisch · das Gemüse · das Obst · der Apfel · die Banane · die Tomate · die Kartoffel · der Zucker · das Salz</p><p><b>نوشیدنی:</b> das Wasser · der Saft · der Tee · der Kaffee · die Cola</p><p><b>وعده‌ها:</b> das Frühstück · das Mittagessen · das Abendessen · <b>مغازه:</b> die Bäckerei · die Metzgerei · der Supermarkt · der Markt</p><p><b>رستوران:</b> die Speisekarte · bestellen · die Rechnung · Zahlen bitte! · Ich möchte ... · Was empfehlen Sie? · Guten Appetit!</p><h3>۶) گفتگوی نمونه</h3><div class=e>– Guten Tag, ich möchte bitte ein Kilo Äpfel und eine Flasche Wasser.<br>– Sonst noch etwas?<br>– Nein, danke. Was macht das?<br>– Das macht 4,50 Euro.</div><div class=e>– Was möchten Sie trinken? – Einen Tee, bitte.<br>– Und zu essen? – Ich nehme die Suppe, aber ohne Fleisch.</div>`;

D[3][4]=[{t:'Einkaufsliste (لیست خرید)',n:30,p:'یک لیست خرید با حداقل ۱۰ قلم و مقدار هر کدام بنویس، بعد دو جمله بنویس که هر چیز را از کجا می‌خری. حداقل ۳۰ کلمه.',ph:'1 Kilo Äpfel · 2 Liter Milch · 1 Packung Nudeln<br>500 g Käse · 6 Eier · 1 Flasche Wasser · 2 Dosen Tomaten<br>Ich brauche ... · Ich kaufe ... in der Bäckerei / im Supermarkt.<br>Ich brauche keinen Zucker.',m:'Einkaufsliste: 1 Kilo Äpfel, 2 Liter Milch, 1 Packung Nudeln, 500 g Käse, 6 Eier, 1 Brot, 1 Flasche Wasser, 2 Dosen Tomaten, 1 Kilo Kartoffeln, 200 g Butter. Ich kaufe das Brot in der Bäckerei. Das Obst und das Gemüse kaufe ich im Supermarkt. Ich brauche keinen Zucker.',c:['هر قلم مقدار دارد و بدون von نوشته شده (ein Kilo Äpfel)','واحد وزن بعد از عدد جمع نشده (zwei Kilo)','یک جمله با kein/keine/keinen نوشته‌ام','برای جای خرید از in der / im استفاده کرده‌ام (Dativ)']},{t:'Einladung zum Essen (دعوت‌نامه شام)',n:60,p:'برای یک دوست دعوت‌نامهٔ شام بنویس: زمان، مکان، غذایی که می‌پزی، چیزی که باید بیاورد (با Imperativ) و خواهش برای پاسخ. حداقل ۶۰ کلمه.',ph:'Liebe Anna, ich möchte dich zum Abendessen einladen.<br>Wann? Am Samstag um 19 Uhr. · Wo? Bei mir zu Hause.<br>Ich koche ... · Magst du ...? · Du isst doch ...?<br>Bring bitte ... mit! · Komm pünktlich!<br>Kannst du kommen? · Schreib mir bitte bald. · Liebe Grüße',m:'Liebe Anna,<br>am Samstag habe ich Geburtstag und möchte dich zum Abendessen einladen. Wir essen um 19 Uhr bei mir zu Hause. Ich koche Reis mit Hähnchen und Salat. Du isst doch Fleisch? Bring bitte keinen Kuchen mit, ich habe schon einen! Kannst du kommen? Schreib mir bitte bald.<br>Liebe Grüße<br>Mehdi',c:['زمان و مکان مشخص است (am Samstag, um 19 Uhr, bei mir)','یک Imperativ با du درست نوشته‌ام (Bring ... mit! – پیشوند آخر جمله)','فعل با Akkusativ درست است (Ich koche den Reis / einen Salat)','از nicht یا kein درست استفاده کرده‌ام','انتهای ایمیل خداحافظی و اسمم نوشته شده']}];
D[4][3]=`<h3>۱) ساخت Perfekt</h3><p>گذشتهٔ محاوره‌ای: <b>haben یا sein (صرف‌شده، جایگاه دوم)</b> + <b>Partizip II (آخر جمله)</b>.</p><div class=e>Ich <b>habe</b> Pizza <b>gegessen</b>.<br>Gestern <b>habe</b> ich Pizza <b>gegessen</b>. (قید اول → فعل کمکی همچنان دوم)<br>Ich <b>bin</b> nach Berlin <b>gefahren</b>.<br>Ich habe nicht gut <b>geschlafen</b>. (nicht قبل از Partizip II)</div><table><tr><th>با sein</th><th>با haben</th></tr><tr><td>حرکت از مکانی به مکانی: gehen, fahren, kommen, fliegen, laufen, reisen, wandern<br>تغییر وضعیت: aufstehen, einschlafen, werden<br>استثناها: <b>sein, bleiben, passieren</b></td><td>بقیهٔ افعال (مفعول‌دارها و بیشتر افعال): machen, essen, trinken, lernen, schlafen, arbeiten, sehen, kaufen, haben</td></tr></table><h3>۲) Partizip II</h3><p><b>منظم:</b> ge + ریشه + t → machen → <b>gemacht</b>, lernen → gelernt, spielen → gespielt, kaufen → gekauft, wohnen → gewohnt. ریشه به t/d ختم می‌شود → et: arbeiten → gearbeitet.</p><p><b>بی‌قاعده (باید حفظ شود):</b> ge + ریشه (ممکن است تغییر کند) + en</p><table><tr><th>مصدر</th><th>Partizip II</th><th>مصدر</th><th>Partizip II</th></tr><tr><td>gehen</td><td>ist gegangen</td><td>essen</td><td>gegessen</td></tr><tr><td>fahren</td><td>ist gefahren</td><td>trinken</td><td>getrunken</td></tr><tr><td>kommen</td><td>ist gekommen</td><td>sehen</td><td>gesehen</td></tr><tr><td>fliegen</td><td>ist geflogen</td><td>lesen</td><td>gelesen</td></tr><tr><td>laufen</td><td>ist gelaufen</td><td>schreiben</td><td>geschrieben</td></tr><tr><td>bleiben</td><td>ist geblieben</td><td>schlafen</td><td>geschlafen</td></tr><tr><td>sein</td><td>ist gewesen</td><td>nehmen</td><td>genommen</td></tr><tr><td>finden</td><td>gefunden</td><td>sprechen</td><td>gesprochen</td></tr><tr><td>geben</td><td>gegeben</td><td>treffen</td><td>getroffen</td></tr><tr><td>helfen</td><td>geholfen</td><td>bringen</td><td>gebracht</td></tr></table><p><b>جداشدنی:</b> پیشوند + ge + ریشه → aufstehen → <b>aufgestanden</b> · einkaufen → eingekauft · anrufen → angerufen · mitbringen → mitgebracht.</p><p><b>جدانشدنی (بدون ge):</b> besuchen → besucht · verstehen → verstanden · bestellen → bestellt · bekommen → bekommen · erklären → erklärt. افعال با پایان -ieren هم بدون ge‌اند: telefonieren → telefoniert.</p><h3>۳) Präteritum از sein و haben</h3><table><tr><th></th><th>sein</th><th>haben</th></tr><tr><td>ich</td><td>war</td><td>hatte</td></tr><tr><td>du</td><td>warst</td><td>hattest</td></tr><tr><td>er/sie/es</td><td>war</td><td>hatte</td></tr><tr><td>wir</td><td>waren</td><td>hatten</td></tr><tr><td>ihr</td><td>wart</td><td>hattet</td></tr><tr><td>sie/Sie</td><td>waren</td><td>hatten</td></tr></table><p>در مکالمه، برای sein و haben معمولاً Präteritum به کار می‌رود (Ich war in Berlin. Ich hatte Hunger.) و برای بقیهٔ افعال Perfekt.</p><h3>۴) قیدهای زمان گذشته</h3><p>gestern · vorgestern · gestern Abend · heute Morgen · letzte Woche · letztes Wochenende · letzten Monat · letztes Jahr · am Montag · im Sommer · <b>vor</b> zwei Tagen (vor + Dativ = پیش) · ماه‌ها و فصل‌ها با im: im Juli.</p><h3>۵) لغات</h3><p><b>سفر:</b> der Urlaub · die Reise · das Hotel · der Strand · das Meer · die Berge · der Flug · das Flugzeug · der Zug · die U-Bahn · das Schiff · buchen · reisen · besichtigen</p><p><b>آخر هفته:</b> besuchen · treffen · grillen · wandern · schwimmen · fernsehen · einkaufen · ausruhen</p><p><b>تجربه:</b> erleben · passieren · toll · wunderbar · schrecklich · langweilig · spannend</p><p><b>سؤالات:</b> Was hast du am Wochenende gemacht? · Wohin bist du gefahren? · Wie war der Urlaub?</p><h3>۶) متن نمونه</h3><div class=e>Letztes Wochenende war ich in Isfahan. Ich bin mit dem Zug gefahren und habe dort Freunde getroffen. Wir haben die Altstadt besucht, viele Fotos gemacht und im Restaurant gegessen. Das Wetter war schön. Am Sonntag bin ich nach Hause gekommen. Ich war müde, aber sehr glücklich.</div>`;

buchte'],'منظم: ge + buch + t = gebucht.'],['m','Am Wochenende ___ wir gewandert.',['sind','haben','waren'],'wandern = حرکت → sind gewandert.'],
['o','Ich habe gestern einen Film gesehen','دیروز یک فیلم دیدم','Perfekt: habe ... gesehen؛ فعل کمکی جایگاه دوم.'],['o','Wir sind letztes Jahr nach Italien gefahren','سال گذشته به ایتالیا سفر کردیم','fahren (حرکت) → sind ... gefahren.'],['o','Am Wochenende habe ich Freunde getroffen','آخر هفته دوستان را دیدم','treffen → getroffen؛ قید زمان اول جمله است، پس habe جایگاه دوم.'],['o','Er ist früh aufgestanden','او زود بیدار شد','aufstehen → ist aufgestanden (تغییر وضعیت → sein).'],['o','Der Urlaub war wunderbar','تعطیلات فوق‌العاده بود','war = Präteritum از sein.'],['o','Ich hatte letzte Woche eine Erkältung','هفتهٔ گذشته سرما خورده بودم','hatte = Präteritum از haben؛ letzte Woche قید زمان.'],['o','Wir haben im Meer gebadet','در دریا آب‌تنی کردیم','baden → gebadet (منظم، ریشه به d ختم می‌شود → et).'],['o','Was hast du am Wochenende gemacht','آخر هفته چه کار کردی؟','W-Frage: Was + hast (جایگاه دوم) + du ... gemacht (آخر).'],['o','Sie hat ihre Oma besucht','او مادربزرگش را ملاقات کرد','besuchen → besucht (بدون ge).'],['o','Wir haben ein Hotel am Strand gebucht','یک هتل کنار ساحل رزرو کردیم','buchen → gebucht؛ am Strand (Dativ).'],['o','Gestern bin ich zu Fuß nach Hause gegangen','دیروز پیاده به خانه رفتم','Gestern جایگاه اول → bin جایگاه دوم، بعد ich؛ gegangen آخر.'],['o','Ich habe nicht gut geschlafen','خوب نخوابیدم','nicht قبل از Partizip II می‌آید: nicht gut geschlafen.']);
D[4][4]=[{t:'Postkarte aus dem Urlaub (کارت پستال)',n:40,p:'یک کارت پستال کوتاه از مسافرت بنویس: کجا هستی، چند روز است، هوا چطور است و دیروز چه کار کردی (با Perfekt). حداقل ۴۰ کلمه.',ph:'Liebe Anna, / Lieber Tom,<br>Viele Grüße aus Antalya!<br>Wir sind seit drei Tagen hier. · Das Wetter ist super.<br>Gestern sind wir ... gefahren / gegangen. · Wir haben ... besucht.<br>Das Essen schmeckt sehr gut. · Bis bald! · Dein Mehdi',m:'Liebe Anna,<br>viele Grüße aus Antalya! Wir sind seit drei Tagen hier. Das Wetter ist super und das Hotel ist direkt am Strand. Gestern sind wir im Meer geschwommen und haben die Altstadt besucht. Das Essen schmeckt sehr gut. Bis bald!<br>Dein Mehdi',c:['مکان و مدت اقامت نوشته شده (seit drei Tagen)','حداقل ۲ جمله با Perfekt نوشته‌ام (habe/ist + Partizip II آخر جمله)','افعال حرکتی (gehen, fahren, schwimmen) با sein نوشته شده‌اند','شروع با Liebe/Lieber و پایان با خداحافظی و اسم']},{t:'E-Mail über den Urlaub (ایمیل دربارهٔ سفر)',n:70,p:'برای یک دوست دربارهٔ آخرین سفرت ایمیل بنویس: کجا رفتی، با چه وسیله‌ای، چه کاری کردی و چطور بود. حداقل ۵ Partizip II (حداقل ۲ تا با sein) و war/hatte. حداقل ۷۰ کلمه.',ph:'Letzten Sommer war ich ... in ...<br>Ich bin mit dem Zug / Bus / Flugzeug gefahren / geflogen.<br>Wir haben ein Hotel gebucht. · Wir haben ... besichtigt / gegessen / gesehen.<br>Das Wetter war ... · Ich hatte ... · Die Reise war toll!<br>Und du? Wo warst du im Urlaub?',m:'Liebe Anna,<br>wie geht es dir? Letzten Sommer war ich eine Woche in Schiras. Ich bin mit dem Bus gefahren, das hat acht Stunden gedauert. Wir haben ein kleines Hotel in der Altstadt gebucht. Am ersten Tag haben wir den Garten Eram besucht und viele Fotos gemacht. Abends haben wir im Restaurant gegessen und Tee getrunken. Das Wetter war schön, aber es war sehr heiß. Ich hatte leider auch ein bisschen Kopfschmerzen. Insgesamt war die Reise toll! Und du? Wo warst du im Urlaub?<br>Viele Grüße<br>Mehdi',c:['Perfekt: فعل کمکی جایگاه دوم و Partizip II آخر جمله است','Partizip II بی‌قاعده را از جدول درست نوشته‌ام (gegessen, getrunken, ...)','حداقل ۲ فعل با sein و بقیه با haben درست انتخاب شده‌اند','war و hatte را درست به کار برده‌ام','قید زمان (Letzten Sommer, Am ersten Tag, Abends) به کار برده‌ام و فعل بعد از آن دوم است']}];
D[5][3]=`<h3>۱) افعال مُدال در گذشته (Präteritum)</h3><p>برای گفتن «مجبور بودم، نتوانستم» و ... از Präteritum استفاده می‌شود. اوملاوت حذف می‌شود و پسوندها: <b>-te, -test, -te, -ten, -tet, -ten</b>. فعل اصلی مصدر و آخر جمله است.</p><table><tr><th></th><th>können</th><th>müssen</th><th>wollen</th><th>dürfen</th><th>sollen</th></tr><tr><td>ich / er</td><td>konnte</td><td>musste</td><td>wollte</td><td>durfte</td><td>sollte</td></tr><tr><td>du</td><td>konntest</td><td>musstest</td><td>wolltest</td><td>durftest</td><td>solltest</td></tr><tr><td>wir / sie / Sie</td><td>konnten</td><td>mussten</td><td>wollten</td><td>durften</td><td>sollten</td></tr><tr><td>ihr</td><td>konntet</td><td>musstet</td><td>wolltet</td><td>durftet</td><td>solltet</td></tr></table><div class=e>Ich <b>konnte</b> gestern nicht <b>kommen</b>.<br>Er <b>musste</b> zum Arzt <b>gehen</b>.<br>Wir <b>durften</b> nicht ins Krankenhaus <b>gehen</b>.</div><h3>۲) حروف اضافه‌ای که Dativ می‌گیرند</h3><p><b>aus, bei, mit, nach, seit, von, zu</b> (+ gegenüber, ab)</p><div class=e>Ich gehe <b>zum</b> Arzt. (zu + dem) · Ich war <b>beim</b> Arzt. (bei + dem)<br>Ich komme <b>vom</b> Arzt. (von + dem) · Er kommt <b>aus dem</b> Krankenhaus.<br>Ich fahre <b>mit dem</b> Bus zur Apotheke. (zu + der = zur)</div><h3>۳) حروف اضافه‌ای زمان: seit, vor, nach, bis, ab</h3><table><tr><th>حرف</th><th>معنی</th><th>مثال</th><th>سؤال</th></tr><tr><td><b>seit</b> + Dat</td><td>از مدتی پیش تا الان (ادامه دارد)</td><td>Ich habe <b>seit</b> drei Tagen Fieber.</td><td>Seit wann? / Wie lange?</td></tr><tr><td><b>vor</b> + Dat</td><td>پیش (کار تمام‌شده)</td><td>Ich war <b>vor</b> einer Woche beim Arzt.</td><td>Wann?</td></tr><tr><td><b>nach</b> + Dat</td><td>بعد از</td><td><b>Nach</b> dem Essen nehme ich eine Tablette.</td><td>Wann?</td></tr><tr><td><b>bis</b></td><td>تا (معمولاً بدون آرتیکل)</td><td>Ich bleibe <b>bis</b> Freitag im Bett.</td><td>Bis wann?</td></tr><tr><td><b>ab</b> + Dat</td><td>از (شروع در آینده)</td><td><b>Ab</b> Montag bin ich wieder gesund.</td><td>Ab wann?</td></tr></table><p>قالب: <b>von ... bis ...</b> (از دوشنبه تا جمعه: von Montag bis Freitag) · ساعت um · روز am · ماه/فصل im.</p><h3>۴) افعال انعکاسی در موضوع سلامت</h3><p>sich fühlen · sich erkälten · sich ausruhen · sich verletzen · sich entspannen · sich wohlfühlen</p><div class=e>Ich fühle <b>mich</b> nicht gut. · Du musst <b>dich</b> ausruhen.<br>Er hat <b>sich</b> erkältet. · Wir fühlen <b>uns</b> müde.<br>وقتی عضو بدن مفعول است → Dativ: Ich wasche <b>mir</b> die Hände. · Ich putze <b>mir</b> die Zähne.</div><h3>۵) لغات</h3><p><b>بدن:</b> der Kopf · der Hals · der Rücken · der Bauch · der Arm · die Hand · der Finger · das Bein · der Fuß · das Knie · das Auge · das Ohr · die Nase · der Mund · der Zahn · das Herz</p><p><b>بیماری:</b> die Erkältung · das Fieber · der Husten · der Schnupfen · die Kopfschmerzen · die Halsschmerzen · die Bauchschmerzen · die Grippe</p><p><b>دکتر:</b> die Praxis · das Rezept · die Tablette · das Medikament · die Apotheke · krankschreiben</p><p><b>قرار:</b> einen Termin vereinbaren / absagen / verschieben · Das passt mir. · Wann haben Sie Zeit? · Es tut mir leid.</p><p><b>درد و توصیه:</b> Mir tut der Kopf weh. · Ich habe Kopfschmerzen. · Mein Rücken tut weh. · Sie sollten viel Wasser trinken. · Bleib im Bett! · Ruh dich aus!</p><h3>۶) گفتگوی نمونه</h3><div class=e>– Praxis Dr. Weber, guten Tag.<br>– Guten Tag, ich möchte einen Termin vereinbaren. Ich habe seit drei Tagen Fieber.<br>– Können Sie morgen um 10 Uhr kommen?<br>– Ja, das passt mir. Danke!<br>– Bitte bringen Sie Ihre Versicherungskarte mit.</div>`;
setE(5,['seit + Dativ = از زمانی که تا الان ادامه دارد: seit Montag.','Präteritum مُدال: ich konnte (بدون اوملاوت)؛ kann حال و könnte شرطی است.','ساختار ثابت: Mir tut der Kopf weh؛ mir = Dativ.']);

['f','Ich ___ gestern nicht arbeiten.','konnte','können','Präteritum از können: ich konnte (بدون اوملاوت).'],['f','Er ___ zum Arzt gehen.','musste','müssen','müssen → musste (ü حذف می‌شود).'],['f','Wir ___ nicht ins Kino gehen.','durften','dürfen','wir + dürfen در Präteritum: durften.'],['f','Du ___ mehr Wasser trinken.','solltest','sollen','du + sollen: solltest.'],['f','Ich ___ eigentlich Sport machen.','wollte','wollen','ich + wollen: wollte.'],['f','Ich habe ___ drei Tagen Fieber.','seit','','seit + Dativ برای کاری که تا الان ادامه دارد: seit drei Tagen.'],['f','Er war ___ einer Woche beim Arzt.','vor','','vor + Dativ = پیش (در گذشته): vor einer Woche.'],['f','___ dem Essen nehme ich die Tablette.','Nach','','nach + Dativ = بعد از: nach dem Essen.'],['f','Die Praxis ist ___ Freitag geöffnet.','bis','','bis = تا (بدون آرتیکل): bis Freitag.'],['f','___ Montag bin ich wieder gesund.','Ab','','ab = از (شروع در آینده): ab Montag.'],['f','Ich gehe ___ Arzt.','zum','zu + dem','zu + dem = zum (Dativ).'],['f','Ich komme gerade ___ Arzt.','vom','von + dem','von + dem = vom: Ich komme vom Arzt.'],['f','Ich fühle ___ nicht gut.','mich','','sich fühlen: ich fühle mich.'],['f','Du musst ___ ausruhen.','dich','','sich ausruhen: du ... dich.'],['f','Mir tut der ___ weh.','Kopf','','Mir tut der Kopf weh: ساختار ثابت برای درد سر.'],
['m','Ich ___ gestern zum Arzt gehen.',['musste','muss','müsste'],'گذشته: müssen → musste.'],['m','Wir ___ gestern lange warten.',['mussten','müssen','müssten'],'گذشته و wir: mussten.'],['m','Als Kind ___ ich nicht schwimmen.',['konnte','kann','könnten'],'گذشته و ich: konnte؛ könnten شرطی/جمع است.'],['m','Er ___ viel Obst essen.',['sollte','sollt','sollten'],'er + sollen در Präteritum = sollte.'],['m','Ich habe ___ gestern Fieber.',['seit','vor','nach'],'seit gestern = از دیروز تا الان (ادامه دارد).'],['m','Ich war ___ drei Tagen im Krankenhaus.',['vor','seit','ab'],'vor drei Tagen = سه روز پیش (کار تمام‌شده).'],['m','___ der Arbeit gehe ich zum Arzt.',['Nach','Bis','Seit'],'nach der Arbeit = بعد از کار.'],['m','Ich bleibe ___ Sonntag im Bett.',['bis','ab','vor'],'bis Sonntag = تا یکشنبه.'],['m','Die Praxis ist ___ 8 Uhr geöffnet.',['ab','bis','seit'],'ab 8 Uhr = از ساعت ۸ به بعد.'],['m','Seit ___ hast du Husten?',['wann','wie','wo'],'Seit wann = از چه زمانی؛ Wie lange = چه مدت.'],['m','Ich fahre mit ___ Bus zum Arzt.',['dem','den','der'],'mit + Dativ؛ Bus مذکر → dem.'],['m','Ich war ___ Arzt.',['beim','zum','vom'],'bei + dem = beim؛ «نزد دکتر بودن» (مکان ثابت).'],['m','Er kommt ___ dem Krankenhaus.',['aus','zu','nach'],'aus + Dativ = از (از درون): aus dem Krankenhaus.'],['m','Ich fühle mich ___.',['nicht gut','nicht gutes','kein gut'],'بعد از sich fühlen قید می‌آید؛ نفی با nicht: nicht gut.'],['m','Er hat ___ erkältet.',['sich','ihn','ihm'],'sich erkälten انعکاسی است؛ برای er → sich.'],['m','Ich wasche ___ die Hände.',['mir','mich','dir'],'وقتی عضو بدن مفعول است، ضمیر Dativ می‌آید: mir.'],['m','Du hast Fieber. – ___',['Bleib im Bett!','Geh joggen!','Fahr in Urlaub!'],'برای تب استراحت: Bleib im Bett! (Imperativ du)'],['m','Sie ___ mehr schlafen. (توصیه)',['sollten','wollten','durften'],'sollten + Sie = توصیه: Sie sollten mehr schlafen.'],['m','Mein ___ tut weh.',['Rücken','Rücke','Rückens'],'Mein Rücken tut weh: Rücken مذکر و فاعل است.'],['m','Wie sagt man «وقت از دکتر گرفتن»?',['einen Termin vereinbaren','einen Termin vergessen','einen Termin essen'],'einen Termin vereinbaren = قرار ملاقات تعیین کردن.'],
['o','Ich musste gestern zum Arzt gehen','دیروز مجبور شدم پیش دکتر بروم','Präteritum مُدال: musste جایگاه دوم، gehen مصدر آخر.'],['o','Er konnte nicht arbeiten','او نتوانست کار کند','konnte + nicht + مصدر آخر.'],['o','Ich habe seit drei Tagen Husten','سه روز است سرفه دارم','seit + Dativ: seit drei Tagen؛ فعل haben حال (ادامه دارد).'],['o','Mein Rücken tut seit gestern weh','کمرم از دیروز درد می‌کند','seit gestern؛ Rücken فاعل است و weh در آخر.'],['o','Ich möchte einen Termin vereinbaren','می‌خواهم وقت بگیرم','möchte جایگاه دوم؛ vereinbaren مصدر آخر.'],['o','Können Sie am Montag um zehn Uhr kommen','می‌توانید دوشنبه ساعت ده بیایید؟','سؤال بله/نه: مُدال اول؛ kommen مصدر آخر.'],['o','Sie sollten viel Wasser trinken','شما باید (توصیه) آب زیاد بنوشید','sollten برای توصیه؛ trinken مصدر آخر.'],['o','Nach dem Essen nehme ich eine Tablette','بعد از غذا یک قرص می‌خورم','nach + Dativ؛ Inversion: nehme جایگاه دوم.'],['o','Ich fühle mich heute nicht gut','امروز حالم خوب نیست','sich fühlen: fühle mich؛ nicht قبل از gut.'],['o','Ich war vor einer Woche beim Arzt','یک هفته پیش نزد دکتر بودم','vor + Dativ (einer Woche)؛ beim = bei dem.'],['o','Bleib bitte im Bett und ruh dich aus','لطفاً در تخت بمان و استراحت کن','Imperativ du: Bleib؛ ausruhen جداشدنی: ruh ... aus.'],['o','Ab Montag bin ich wieder gesund','از دوشنبه دوباره سالم هستم','ab = از (آینده)؛ Inversion: bin جایگاه دوم.']);
D[5][4]=[{t:'Terminabsage (پیام لغو قرار)',n:40,p:'برای دکتر یا یک دوست پیام بنویس و قرارت را لغو کن: دلیل (بیماری با seit)، تقاضای قرار جدید و عذرخواهی. حداقل ۴۰ کلمه.',ph:'Sehr geehrte Frau Dr. Müller, / Liebe Anna,<br>leider muss ich meinen Termin am ... absagen.<br>Ich habe seit gestern Fieber. · Ich muss im Bett bleiben.<br>Kann ich einen neuen Termin ab ... bekommen?<br>Es tut mir leid. · Vielen Dank für Ihr Verständnis.<br>Mit freundlichen Grüßen / Liebe Grüße',m:'Sehr geehrte Frau Dr. Müller,<br>leider muss ich meinen Termin am Mittwoch um 10 Uhr absagen. Ich habe seit gestern Fieber und muss im Bett bleiben. Es tut mir sehr leid. Kann ich einen neuen Termin ab nächster Woche bekommen? Ich kann ab Montag jederzeit kommen. Vielen Dank für Ihr Verständnis.<br>Mit freundlichen Grüßen<br>Mehdi',c:['با احترام (Sehr geehrte ... / Sie) شروع شده و با Mit freundlichen Grüßen تمام شده','زمان قرار و دلیل لغو مشخص است','seit + Dativ را درست به کار برده‌ام (seit gestern, seit drei Tagen)','مُدال + مصدر آخر جمله (muss ... bleiben)','عذرخواهی و درخواست قرار جدید دارد']},{t:'Arzttermin vereinbaren (ایمیل به مطب)',n:50,p:'به یک مطب ایمیل بنویس و وقت بگیر: مشکل و مدت آن، روزها و ساعت‌هایی که می‌توانی بیایی (با ab / bis / nach) و درخواست تأیید. حداقل ۵۰ کلمه.',ph:'Sehr geehrte Damen und Herren,<br>ich möchte einen Termin vereinbaren.<br>Ich habe seit einer Woche Rückenschmerzen.<br>Ich kann am Dienstag nach 14 Uhr kommen. · Bis Freitag habe ich vormittags keine Zeit.<br>Bitte bestätigen Sie den Termin. · Vielen Dank!',m:'Sehr geehrte Damen und Herren,<br>ich möchte einen Termin bei Dr. Weber vereinbaren. Ich habe seit einer Woche Rückenschmerzen und kann nachts schlecht schlafen. Ich kann am Dienstag oder Donnerstag nach 14 Uhr kommen. Bis Freitag habe ich vormittags keine Zeit, denn ich muss arbeiten. Bitte bestätigen Sie den Termin. Vielen Dank!<br>Mit freundlichen Grüßen<br>Mehdi',c:['بیماری و مدت آن ذکر شده (seit einer Woche)','روزها و ساعت‌ها با am / um / nach / ab / bis گفته شده‌اند','از Sie و Ihre (رسمی) استفاده کرده‌ام، نه du','درخواست تأیید و تشکر دارد']}];

D[6][3]=`<h3>۰) برنامهٔ پیشنهادی این روز (حدود ۵ ساعت)</h3><p>۱ ساعت مرور گرامر از همین درسنامه · ۱ ساعت افعال بی‌قاعده و Partizip II · ۱ ساعت لغات (فلش‌کارت) · ۴۵ دقیقه خواندن و شنیدن (سؤال‌های اپ با دکمهٔ 🔊) · ۴۵ دقیقه صحبت · ۳۰ دقیقه تمرین این روز + نوشتن متن.</p><h3>۱) چکیدهٔ گرامر روزهای ۱ تا ۶</h3><table><tr><th>روز</th><th>قانون اصلی</th></tr><tr><td>1</td><td>فعل + شناسه (-e -st -t -en -t -en)؛ sein/haben بی‌قاعده؛ W-Frage: کلمه پرسشی + فعل؛ mein/meine</td></tr><tr><td>2</td><td>فعل جایگاه دوم؛ جداشدنی: stehe ... auf؛ مُدال + مصدر آخر؛ انعکاسی: ich wasche mich</td></tr><tr><td>3</td><td>Wo؟ → Dativ (dem/der/dem)؛ Wohin؟ → Akkusativ (den/die/das)؛ Es gibt + Akkusativ</td></tr><tr><td>4</td><td>kein (اسم) / nicht (فعل، صفت)؛ Imperativ: Komm! Lies! Iss! Kommen Sie!؛ helfen/schmecken + Dativ</td></tr><tr><td>5</td><td>Perfekt = haben/sein + Partizip II (آخر)؛ حرکت → sein؛ war / hatte</td></tr><tr><td>6</td><td>konnte, musste, wollte, durfte, sollte؛ seit (ادامه)، vor (پیش)، nach، bis، ab؛ zum/beim/vom</td></tr></table><h3>۲) افعال بی‌قاعدهٔ ضروری</h3><table><tr><th>مصدر</th><th>er/sie (حال)</th><th>Präteritum</th><th>Perfekt</th></tr><tr><td>sein</td><td>ist</td><td>war</td><td>ist gewesen</td></tr><tr><td>haben</td><td>hat</td><td>hatte</td><td>hat gehabt</td></tr><tr><td>gehen</td><td>geht</td><td>ging</td><td>ist gegangen</td></tr><tr><td>kommen</td><td>kommt</td><td>kam</td><td>ist gekommen</td></tr><tr><td>fahren</td><td>fährt</td><td>fuhr</td><td>ist gefahren</td></tr><tr><td>fliegen</td><td>fliegt</td><td>flog</td><td>ist geflogen</td></tr><tr><td>laufen</td><td>läuft</td><td>lief</td><td>ist gelaufen</td></tr><tr><td>bleiben</td><td>bleibt</td><td>blieb</td><td>ist geblieben</td></tr><tr><td>werden</td><td>wird</td><td>wurde</td><td>ist geworden</td></tr><tr><td>essen</td><td>isst</td><td>aß</td><td>hat gegessen</td></tr><tr><td>trinken</td><td>trinkt</td><td>trank</td><td>hat getrunken</td></tr><tr><td>sehen</td><td>sieht</td><td>sah</td><td>hat gesehen</td></tr><tr><td>lesen</td><td>liest</td><td>las</td><td>hat gelesen</td></tr><tr><td>schreiben</td><td>schreibt</td><td>schrieb</td><td>hat geschrieben</td></tr><tr><td>schlafen</td><td>schläft</td><td>schlief</td><td>hat geschlafen</td></tr><tr><td>nehmen</td><td>nimmt</td><td>nahm</td><td>hat genommen</td></tr><tr><td>geben</td><td>gibt</td><td>gab</td><td>hat gegeben</td></tr><tr><td>sprechen</td><td>spricht</td><td>sprach</td><td>hat gesprochen</td></tr><tr><td>treffen</td><td>trifft</td><td>traf</td><td>hat getroffen</td></tr><tr><td>helfen</td><td>hilft</td><td>half</td><td>hat geholfen</td></tr><tr><td>finden</td><td>findet</td><td>fand</td><td>hat gefunden</td></tr><tr><td>bringen</td><td>bringt</td><td>brachte</td><td>hat gebracht</td></tr><tr><td>wissen</td><td>weiß</td><td>wusste</td><td>hat gewusst</td></tr><tr><td>stehen</td><td>steht</td><td>stand</td><td>hat gestanden</td></tr><tr><td>liegen</td><td>liegt</td><td>lag</td><td>hat gelegen</td></tr><tr><td>sitzen</td><td>sitzt</td><td>saß</td><td>hat gesessen</td></tr></table><p>روش حفظ: هر روز ۵ فعل را بلند بخوان، جدول را پنهان کن و از حافظه بنویس.</p><h3>۳) خواندن (Lesen)</h3><div class=e>Anna wohnt in Berlin. Sie steht um 6 Uhr auf und fährt mit der U-Bahn zur Arbeit. Nach der Arbeit kauft sie im Supermarkt ein. Am Wochenende besucht sie ihre Eltern. Letzten Sonntag ist sie mit ihnen ins Kino gegangen.</div><p>متن را چند بار بخوان و به پرسش‌های زیر جواب بده: Wo wohnt Anna? Wie fährt sie zur Arbeit? Was macht sie nach der Arbeit? Was hat sie letzten Sonntag gemacht?</p><h3>۴) شنیدن (Hören)</h3><p>در تمرین‌های این روز دکمهٔ <b>🔊 گوش بده</b> متن آلمانی را پخش می‌کند (متن نمایش داده نمی‌شود). حداقل ۲ بار گوش بده و بعد جواب بده. اگر صدا پخش نشد، تنظیمات صدای مرورگر را چک کن.</p><h3>۵) صحبت (Sprechen)</h3><p>۲ دقیقه با ضبط صدای گوشی صحبت کن و بعد گوش بده: Selbstvorstellung → Familie → Alltag → Wohnung → Freizeit → letztes Wochenende → gesundheitliches Problem. چک‌لیست: فعل جایگاه دوم؛ Perfekt درست؛ آرتیکل و حالت درست؛ بدون مکث طولانی. می‌توانی همین‌طور در چت با من مکالمه تمرین کنی.</p><h3>۶) لغات فلش‌کارت (۳۶ کلمه)</h3><p dir=ltr>der Beruf = شغل · die Familie = خانواده · die Wohnung = آپارتمان · der Schrank = کمد · die Küche = آشپزخانه · die Haltestelle = ایستگاه · geradeaus = مستقیم · einkaufen = خرید کردن · das Brot = نان · die Rechnung = صورت‌حساب · die Flasche = بطری · gesund = سالم · krank = بیمار · das Fieber = تب · die Tablette = قرص · der Termin = قرار/وقت · absagen = لغو کردن · der Urlaub = تعطیلات · die Reise = سفر · besuchen = ملاقات کردن · treffen = دیدن (قرار) · schlafen = خوابیدن · aufstehen = بیدار شدن · sich ausruhen = استراحت کردن · immer = همیشه · selten = به‌ندرت · gestern = دیروز · seit = از ... تا الان · bis = تا · ab = از (آینده) · vor = پیش · nach = بعد از · müssen = مجبور بودن · dürfen = اجازه داشتن · der Rücken = کمر · die Erkältung = سرماخوردگی</p>`;

D[6][4]=[{t:'Schreibaufgabe: Text über mein Leben (متن دربارهٔ زندگی شخصی)',n:100,p:'یک متن ۱۰۰ تا ۱۲۰ کلمه‌ای دربارهٔ زندگی شخصی‌ات بنویس. باید همهٔ این‌ها در آن باشد: معرفی، خانواده، خانه (با Dativ مکانی)، کار روزانه (با فعل جداشدنی)، آخر هفتهٔ گذشته (با Perfekt) و یک مشکل یا بیماری (با seit یا مُدال Präteritum).',ph:'Ich heiße ... und komme aus ... · Meine Familie ist ...<br>Meine Wohnung hat ... · Im Wohnzimmer steht ...<br>Jeden Morgen stehe ich um ... Uhr auf. · Nach der Arbeit ...<br>Letztes Wochenende bin ich ... gefahren und habe ... getroffen.<br>Ich hatte seit ... · Ich musste / konnte nicht ...',m:'Hallo! Ich heiße Mehdi, ich bin 22 Jahre alt und komme aus dem Iran. Ich wohne in Teheran in einer kleinen Wohnung. Sie hat ein Wohnzimmer, ein Schlafzimmer und eine Küche. Meine Familie ist groß: Ich habe zwei Brüder und eine Schwester. Ich bin Schwimmtrainer von Beruf. Jeden Morgen stehe ich um sechs Uhr auf und fahre zur Arbeit. Nach der Arbeit gehe ich oft ins Fitnessstudio. Letztes Wochenende bin ich nach Isfahan gefahren und habe dort Freunde getroffen. Wir haben viel gegessen und die Altstadt besucht. Das Wetter war sehr schön. Am Montag hatte ich Kopfschmerzen und musste im Bett bleiben. Ich lerne seit drei Monaten Deutsch.',c:['بین ۱۰۰ تا ۱۲۰ کلمه نوشته‌ام','همهٔ موضوعات (معرفی، خانواده، خانه، روزانه، آخر هفته، مشکل) پوشش داده شده‌اند','فعل در هر جمله در جایگاه دوم است','Perfekt را با فعل کمکی درست (haben/sein) نوشته‌ام','Dativ مکانی (im, auf dem, neben dem) به کار رفته است','جنس اسم‌ها و حروف بزرگ اسم‌ها را چک کرده‌ام']}];
D[7][3]=`<h3>۱) جایگاه فعل: جملهٔ اصلی در برابر جملهٔ وابسته</h3><table><tr><th>نوع جمله</th><th>فعل صرف‌شده</th><th>مثال</th></tr><tr><td>Hauptsatz</td><td>جایگاه دوم</td><td>Ich <b>bleibe</b> zu Hause.</td></tr><tr><td>Nebensatz (weil, dass, wenn, ob)</td><td><b>آخر جمله</b></td><td>..., weil ich krank <b>bin</b>.</td></tr><tr><td>اگر Nebensatz اول بیاید</td><td>فعل جملهٔ اصلی بلافاصله بعد از ویرگول</td><td>Weil ich krank bin, <b>bleibe</b> ich zu Hause.</td></tr></table><p>در Nebensatz همیشه کاما قبل از آن می‌آید. فعل صرف‌شده آخرین کلمه است:</p><div class=e>جداشدنی: weil ich früh <b>aufstehe</b> (پیشوند چسبیده می‌شود)<br>Perfekt: weil ich Pizza gegessen <b>habe</b> (فعل کمکی بعد از Partizip II)<br>مُدال: weil ich arbeiten <b>muss</b> (مُدال آخر)</div><h3>۲) weil · dass · wenn · ob</h3><div class=e><b>weil</b> (چون) → Ich lerne Deutsch, weil ich in Deutschland arbeiten möchte.<br><b>dass</b> (که) → Ich glaube, dass er heute kommt. · Ich finde, dass Deutsch schön ist.<br><b>wenn</b> (وقتی/اگر) → Wenn ich Zeit habe, gehe ich ins Kino.<br><b>ob</b> (آیا) → Ich weiß nicht, ob er kommt.</div><p><b>dass</b> (حرف ربط، با ss) کاملاً از <b>das</b> (آرتیکل/ضمیر) جداست. بعد از فعل‌های نظر و احساس dass می‌آید: glauben, denken, meinen, finden, hoffen, wissen, sich freuen.</p><h3>۳) denn · deshalb · aber · sondern · oder · und</h3><table><tr><th>کلمه</th><th>اثر بر جایگاه فعل</th><th>مثال</th></tr><tr><td>und, aber, oder, sondern, <b>denn</b></td><td>جایگاه صفر: ترتیب جمله عوض نمی‌شود</td><td>Ich bleibe zu Hause, <b>denn</b> ich bin krank.</td></tr><tr><td><b>deshalb</b> (برای همین)</td><td>خودش جایگاه اول، پس فعل بلافاصله بعد از آن</td><td>Ich bin krank, <b>deshalb bleibe</b> ich zu Hause.</td></tr><tr><td><b>weil</b> (چون)</td><td>فعل آخر جمله</td><td>Ich bleibe zu Hause, <b>weil</b> ich krank <b>bin</b>.</td></tr></table><div class=e><b>sondern</b> فقط بعد از منفی: Ich fahre <b>nicht</b> mit dem Bus, <b>sondern</b> mit dem Zug.<br><b>aber</b> = ولی: Ich möchte kommen, <b>aber</b> ich habe keine Zeit.<br><b>oder</b> = یا: Kommst du heute <b>oder</b> morgen?</div><h3>۴) مصدر با zu (Infinitiv mit zu)</h3><p>بعد از بعضی افعال و عبارت‌ها، مصدر با <b>zu</b> می‌آید (کاما قبل از آن) و zu مستقیماً قبل از مصدر است.</p><div class=e>Ich habe keine Lust, heute <b>zu</b> arbeiten.<br>Es ist wichtig, jeden Tag Deutsch <b>zu</b> lernen.<br>Ich hoffe, dich bald <b>zu</b> sehen.<br>جداشدنی: zu بین پیشوند و فعل → <b>auf</b>zustehen, <b>an</b>zurufen, <b>ein</b>zukaufen, <b>zu</b>zumachen<br><b>um ... zu</b> (برای اینکه): Ich lerne Deutsch, <b>um</b> in Deutschland <b>zu</b> arbeiten.</div><p><b>بعد از مُدال‌ها بدون zu:</b> Ich will früh aufstehen. (نه «zu aufstehen») · فعل‌ها و عبارت‌هایی که zu می‌گیرند: anfangen, aufhören, versuchen, vergessen, hoffen, planen, Lust/Zeit haben, Es ist wichtig/schwer/schön/leicht.</p><h3>۵) لغات</h3><p><b>نظر و احساس:</b> glauben · denken · meinen · finden · sich freuen · sich ärgern · Angst haben · glücklich · traurig · wütend · nervös · stolz</p><p><b>نظر دادن:</b> Meiner Meinung nach ... (به نظر من) · Ich finde, dass ... · Das stimmt. · Da stimme ich zu. · Das sehe ich anders.</p><p><b>دلیل و نتیجه:</b> der Grund · weil · denn · deshalb · darum</p><p><b>آرزو و برنامه:</b> der Wunsch · der Plan · die Zukunft · hoffen · planen · träumen · später · eines Tages · Ich habe vor, ... zu ...</p><h3>۶) نمونه متن</h3><div class=e>Ich lerne Deutsch, weil ich in Deutschland arbeiten möchte. Ich finde, dass die Grammatik schwer ist, aber ich übe jeden Tag. Es ist wichtig, regelmäßig zu lernen. Wenn ich Zeit habe, höre ich deutsche Musik.</div>`;

ر آخر جمله می‌آید: ... zu sehen.'],['m','Er hat vergessen, die Tür ___.',['zuzumachen','zu zumachen','zumachen zu'],'جداشدنی: zu بین پیشوند و ریشه: zu + zu + machen = zuzumachen.'],['m','Ich freue mich, ___ ich dich sehe.',['dass','ob','um'],'بعد از sich freuen برای «که»: dass؛ فعل sehe آخر.'],['m','Ich weiß nicht, ___ er kommt.',['ob','dass','wenn'],'ob = آیا (برای پرسش غیرمستقیم بله/نه).'],['m','Meiner Meinung ___ ist das richtig.',['nach','vor','seit'],'Meiner Meinung nach = به نظر من.'],['m','Weil ich Hunger habe, ___ ich ein Brot.',['esse','ich esse','essen'],'Nebensatz اول → فعل جملهٔ اصلی بلافاصله بعد از ویرگول: esse ich.'],
['o','Ich lerne Deutsch weil ich in Deutschland arbeiten möchte','آلمانی یاد می‌گیرم چون می‌خواهم در آلمان کار کنم','weil → فعل صرف‌شده (möchte) آخر؛ arbeiten قبل از آن.'],['o','Wenn ich Zeit habe gehe ich ins Kino','وقتی وقت داشته باشم به سینما می‌روم','Nebensatz اول: habe آخر آن، سپس فعل اصلی gehe بلافاصله.'],['o','Ich bleibe zu Hause denn ich bin krank','در خانه می‌مانم چون بیمارم','denn جایگاه صفر است: بعد از آن ترتیب معمولی (ich bin).'],['o','Ich bin krank deshalb bleibe ich im Bett','بیمارم، برای همین در تخت می‌مانم','deshalb جایگاه اول → فعل bleibe دوم، بعد فاعل.'],['o','Ich habe keine Lust heute zu arbeiten','حوصلهٔ کار کردن امروز را ندارم','مصدر با zu آخر جمله: heute zu arbeiten.'],['o','Es ist wichtig jeden Tag Deutsch zu lernen','مهم است هر روز آلمانی یاد بگیریم','Es ist wichtig + مصدر با zu: ... zu lernen.'],['o','Er sagt dass er morgen kommt','او می‌گوید که فردا می‌آید','dass → فعل kommt آخر جمله.'],['o','Ich fahre nicht mit dem Bus sondern mit dem Zug','با اتوبوس نمی‌روم، بلکه با قطار','sondern بعد از جملهٔ منفی.'],['o','Ich möchte kommen aber ich habe keine Zeit','می‌خواهم بیایم ولی وقت ندارم','aber جایگاه صفر؛ جمله بعدی ترتیب معمولی دارد.'],['o','Ich hoffe dich bald zu sehen','امیدوارم زود ببینمت','hoffen + مصدر با zu: ... zu sehen آخر جمله.'],['o','Meiner Meinung nach ist Deutsch nicht leicht','به نظر من آلمانی آسان نیست','عبارت اول جمله → فعل ist دوم؛ nicht قبل از صفت.'],['o','Weil ich müde bin gehe ich früh ins Bett','چون خسته هستم زود می‌خوابم','Nebensatz اول (bin آخر)، سپس gehe بلافاصله.']);
D[7][4]=[{t:'Fremdsprachen lernen (یادگیری زبان‌های خارجی)',n:80,p:'دربارهٔ یادگیری زبان خارجی بنویس: چرا آلمانی یاد می‌گیری (weil)، نظرت چیست (dass / Meiner Meinung nach)، چه چیزی سخت یا آسان است (Es ist ... zu ...) و چطور تمرین می‌کنی (wenn). حداقل ۸۰ کلمه.',ph:'Ich lerne Deutsch, weil ... · Ich finde, dass ...<br>Meiner Meinung nach ist ... · Es ist schwer / wichtig / leicht, ... zu ...<br>Wenn ich Zeit habe, ... · Deshalb übe ich ...<br>Ich habe vor, ... zu ... · ..., aber / denn / sondern ...',m:'Ich lerne Deutsch, weil ich in Deutschland arbeiten möchte. Meiner Meinung nach ist Deutsch nicht leicht, aber es macht mir Spaß. Ich finde, dass die Grammatik am schwersten ist. Deshalb übe ich jeden Tag mit Übungen und Videos. Es ist wichtig, regelmäßig zu lernen. Wenn ich Zeit habe, höre ich auch deutsche Musik. Ich habe vor, im nächsten Jahr eine Prüfung zu machen. Fremdsprachen sind nützlich, denn man kann neue Leute kennenlernen und besser reisen.',c:['حداقل ۲ جمله با weil یا dass نوشته‌ام و فعل در آخر Nebensatz است','یک جمله با wenn نوشته‌ام و فعل جملهٔ اصلی بعد از ویرگول آمده','یک مصدر با zu درست به کار برده‌ام (Es ist wichtig, ... zu ...)','denn / deshalb / aber را با جایگاه درست فعل به کار برده‌ام','کاما قبل از هر Nebensatz و مصدر با zu گذاشته‌ام']},{t:'Meine Zukunftspläne (برنامه‌های آینده)',n:50,p:'دربارهٔ آرزوها و برنامه‌های آینده‌ات بنویس: چه می‌خواهی، چه امیدی داری (hoffen, dass)، چه شرطی لازم است (wenn) و چه می‌خواهی بکنی (planen, ... zu ...). حداقل ۵۰ کلمه.',ph:'Nächstes Jahr möchte ich ... · Ich hoffe, dass ...<br>Wenn ich ..., dann ... · Ich plane, ... zu ...<br>Zuerst muss ich ..., denn ... · Mein Traum ist es, ... zu ...<br>später · eines Tages · in der Zukunft',m:'Nächstes Jahr möchte ich eine Ausbildung in Deutschland beginnen. Ich hoffe, dass ich eine gute Stelle finde. Zuerst muss ich noch besser Deutsch lernen, denn ohne Sprache ist es schwer, Arbeit zu bekommen. Wenn ich die Prüfung bestehe, ziehe ich nach Berlin. Ich plane, dort neue Freunde zu finden. Mein Traum ist es, später ein eigenes Geschäft zu haben.',c:['یک جمله با hoffen + dass نوشته‌ام و فعل آخر آن است','یک جمله با wenn دارد و فعل جملهٔ اصلی بلافاصله بعد از ویرگول است','مصدر با zu درست به کار رفته (plane, ... zu ...)','یک denn یا deshalb با جایگاه درست فعل دارم']}];
D[7][3]=`<h3>۱) جملهٔ وابسته (Nebensatz): فعل آخر جمله</h3><p>بعد از حرف ربط وابسته‌ساز (<b>weil, dass, wenn, ob</b>) فعل صرف‌شده به <b>آخر جمله</b> می‌رود و قبل آن کاما می‌آید.</p><div class=e>Hauptsatz: Ich <b>bleibe</b> zu Hause. (فعل جایگاه دوم)<br>Nebensatz: ..., weil ich krank <b>bin</b>. (فعل آخر)<br>جداشدنی: ..., weil ich früh <b>aufstehe</b>. (فعل و پیشوند کنار هم)<br>مُدال: ..., weil ich arbeiten <b>muss</b>. (مُدال آخر از همه)<br>Perfekt: ..., weil ich schlecht geschlafen <b>habe</b>. (فعل کمکی آخر)</div><p>اگر Nebensatz اول جمله بیاید، کل آن جایگاه اول است و فعل جملهٔ اصلی بلافاصله بعد از کاما می‌آید:</p><div class=e><b>Wenn</b> es regnet, <b>bleibe</b> ich zu Hause.<br><b>Wenn</b> ich Zeit habe, <b>rufe</b> ich dich <b>an</b>.</div><h3>۲) weil – denn – deshalb</h3><table><tr><th>کلمه</th><th>نقش</th><th>جایگاه فعل</th><th>مثال</th></tr><tr><td><b>weil</b> (چون)</td><td>Nebensatz</td><td>آخر</td><td>Ich bleibe zu Hause, weil ich krank <b>bin</b>.</td></tr><tr><td><b>denn</b> (چون)</td><td>حرف ربط مستقل (جایگاه صفر)</td><td>دوم (عادی)</td><td>Ich bleibe zu Hause, denn ich <b>bin</b> krank.</td></tr><tr><td><b>deshalb / deswegen</b> (به همین دلیل)</td><td>قید (جایگاه ۱)</td><td>بلافاصله بعد از آن</td><td>Ich bin krank, deshalb <b>bleibe</b> ich zu Hause.</td></tr></table><h3>۳) dass · wenn · ob</h3><p><b>dass</b> (که): بعد از فعل‌های فکر و گفتن و احساس: glauben, denken, meinen, wissen, hoffen, sagen, sich freuen. (با دو s! das = آرتیکل/ضمیر.)</p><div class=e>Ich glaube, dass er recht hat.<br>Ich freue mich, dass du kommst.</div><p><b>wenn</b> = اگر / هروقت که. <b>ob</b> = آیا (سؤال بله/نه غیرمستقیم): Ich weiß nicht, <b>ob</b> er kommt. برای W-Frage هم همین قانون: Ich weiß nicht, <b>wann</b> er kommt.</p><h3>۴) حروف ربط مستقل (Position 0)</h3><p><b>und, oder, aber, denn, sondern</b> – فعل بعد از آن‌ها جایگاه دوم است.</p><div class=e>Ich möchte kommen, <b>aber</b> ich habe keine Zeit. (اما)<br>Ich komme nicht aus Teheran, <b>sondern</b> aus Schiras. (بلکه – بعد از نفی)<br>Trinkst du Tee <b>oder</b> Kaffee?</div><h3>۵) Infinitiv mit zu</h3><p>مصدر با <b>zu</b> بعد از: Lust/Zeit haben · anfangen · aufhören · versuchen · vergessen · hoffen · Es ist wichtig/schön/schwer. بعد از مُدال zu نمی‌آید.</p><div class=e>Ich habe keine Lust, ins Kino <b>zu</b> gehen.<br>Es ist wichtig, jeden Tag Deutsch <b>zu</b> lernen.<br>جداشدنی: Ich versuche, früh <b>aufzustehen</b>. · Ich habe vergessen, dich <b>anzurufen</b>.<br>مُدال: Ich <b>muss</b> arbeiten. (بدون zu)<br><b>um ... zu</b> (برای اینکه): Ich lerne Deutsch, um in Deutschland zu arbeiten.</div><h3>۶) جایگاه فعل – خلاصه</h3><table><tr><th>نوع</th><th>جایگاه فعل</th></tr><tr><td>جملهٔ اصلی</td><td>دوم</td></tr><tr><td>سؤال بله/نه</td><td>اول</td></tr><tr><td>بعد از und/oder/aber/denn/sondern</td><td>دوم (عادی)</td></tr><tr><td>بعد از deshalb</td><td>بلافاصله بعد از آن</td></tr><tr><td>Nebensatz (weil, dass, wenn, ob)</td><td><b>آخر</b></td></tr></table><h3>۷) لغات</h3><p><b>احساس:</b> sich freuen · sich ärgern · glücklich · traurig · wütend · nervös · stolz · überrascht · enttäuscht</p><p><b>نظر:</b> Ich denke / glaube / finde, dass ... · meiner Meinung nach · Ich bin dafür / dagegen. · Ich stimme zu. · Das stimmt nicht. · einverstanden</p><p><b>دلیل و نتیجه:</b> der Grund · weil · denn · deshalb · deswegen · darum</p><p><b>آرزو و برنامه:</b> der Wunsch · der Plan · planen · hoffen · träumen von · in Zukunft · später · nächstes Jahr · die Ausbildung · sich bewerben</p>`;

['m','Welcher Satz ist richtig?',['Ich bleibe zu Hause, weil ich krank bin.','Ich bleibe zu Hause, weil ich bin krank.','Ich bleibe zu Hause, weil bin ich krank.'],'بعد از weil فعل صرف‌شده آخر جمله می‌رود.'],['m','Ich glaube, ___ er recht hat.',['dass','das','weil'],'dass (حرف ربط) با دو s؛ das = آرتیکل/ضمیر.'],['m','Ich gehe nicht aus, ___ ich müde bin.',['weil','deshalb','sondern'],'weil دلیل را می‌آورد و فعل آخر می‌شود.'],['m','Ich bin müde, ___ gehe ich ins Bett.',['deshalb','weil','dass'],'deshalb + فعل (gehe) + فاعل.'],['m','Es regnet. ___ bleibe ich zu Hause.',['Deshalb','Weil','Denn'],'جملهٔ مستقل جدید با Deshalb شروع می‌شود و فعل دوم است.'],['m','Ich bleibe zu Hause, ___ ich bin krank.',['denn','weil','dass'],'ترتیب عادی (ich bin) نشانهٔ denn است؛ weil و dass فعل را آخر می‌برند.'],['m','Wenn ich Zeit habe, ___ ich dich an.',['rufe','ich rufe','anrufe'],'Nebensatz اول جمله جایگاه ۱ را گرفته → فعل بلافاصله بعد از کاما: rufe ich ... an.'],['m','Er sagt, dass er morgen ___.',['kommt','kommt er','er kommt'],'در Nebensatz فعل آخر: dass er morgen kommt.'],['m','Ich arbeite viel, ___ Geld zu verdienen.',['um','für','zu'],'um ... zu = هدف: um Geld zu verdienen.'],['m','Ich habe keine Lust, früh ___.',['aufzustehen','zu aufstehen','aufstehen zu'],'جداشدنی: auf + zu + stehen = aufzustehen.'],['m','Ich muss heute ___.',['arbeiten','zu arbeiten','arbeiten zu'],'بعد از مُدال zu نمی‌آید: Ich muss arbeiten.'],['m','Ich wohne nicht in Berlin, ___ in München.',['sondern','aber','denn'],'sondern بعد از نفی برای تصحیح (nicht ... sondern).'],['m','Ich möchte kommen, ___ ich habe keine Zeit.',['aber','sondern','weil'],'aber = اما (تضاد)؛ ترتیب عادی بعد از آن.'],['m','Ich weiß nicht, ___ sie heute Zeit hat.',['ob','dass','wenn'],'ob = آیا؛ پرسش غیرمستقیم بله/نه.'],['m','Ich weiß nicht, ___ er kommt. (کِی)',['wann','ob','dass'],'W-Frage غیرمستقیم: wann + فعل آخر.'],['m','Ich bin müde, weil ich schlecht ___ habe.',['geschlafen','schlafen','geschlaft'],'در Nebensatz با Perfekt: Partizip II + habe در آخر.'],['m','Ich freue mich, ___ du kommst.',['dass','ob','um'],'sich freuen + dass: Ich freue mich, dass ...'],['m','Ich möchte später Arzt werden. Das ist mein ___.',['Wunsch','Wünsch','Wunschs'],'der Wunsch = آرزو.'],['m','Wie sagt man «به نظر من»?',['meiner Meinung nach','meine Meinung nach','mein Meinung nach'],'nach + Dativ: meiner Meinung nach (Meinung مؤنث).'],['m','Ich ___ mich auf die Ferien.',['freue','freust','freuen'],'sich freuen auf: ich freue mich.'],
['o','Ich bleibe zu Hause, weil ich krank bin','چون مریضم در خانه می‌مانم','weil → فعل آخر: ich krank bin.'],['o','Ich denke dass Deutsch nicht leicht ist','فکر می‌کنم آلمانی آسان نیست','dass → فعل ist آخر.'],['o','Wenn ich Zeit habe gehe ich ins Kino','وقتی وقت داشته باشم به سینما می‌روم','Wenn-Satz اول جمله → فعل جملهٔ اصلی بلافاصله بعد از آن: gehe ich ...'],['o','Ich bin müde deshalb gehe ich ins Bett','خسته‌ام، برای همین به رختخواب می‌روم','deshalb جایگاه ۱ → gehe جایگاه دوم.'],['o','Ich lerne Deutsch um in Deutschland zu arbeiten','آلمانی یاد می‌گیرم تا در آلمان کار کنم','um ... zu + مصدر در آخر.'],['o','Ich habe keine Lust heute zu kochen','امروز حوصلهٔ آشپزی ندارم','Lust haben + zu + مصدر.'],['o','Ich versuche jeden Tag früh aufzustehen','سعی می‌کنم هر روز زود بیدار شوم','aufzustehen: zu بین auf و stehen.'],['o','Ich möchte kommen aber ich habe keine Zeit','می‌خواهم بیایم اما وقت ندارم','aber حرف ربط مستقل: بعد از آن ترتیب عادی ich habe.'],['o','Ich komme nicht aus Teheran sondern aus Schiras','اهل تهران نیستم بلکه اهل شیراز هستم','nicht ..., sondern ... برای تصحیح.'],['o','Ich weiß nicht ob er heute Zeit hat','نمی‌دانم امروز وقت دارد یا نه','ob → فعل hat آخر.'],['o','Ich freue mich dass du kommst','خوشحالم که می‌آیی','sich freuen + dass؛ kommst آخر.'],['o','Meiner Meinung nach ist Sport sehr wichtig','به نظر من ورزش خیلی مهم است','nach + Dativ؛ بعد از عبارت اول فعل ist دوم است.']);
D[7][4]=[{t:'Fremdsprachen lernen (یادگیری زبان خارجی)',n:70,p:'یک متن دربارهٔ یادگیری زبان‌های خارجی بنویس: چرا آلمانی یاد می‌گیری (weil)، نظرت (dass)، چه چیزی مهم است (Es ist wichtig ... zu)، چطور تمرین می‌کنی (wenn) و هدفت (um ... zu). حداقل ۷۰ کلمه.',ph:'Ich lerne Deutsch, weil ich ... möchte.<br>Ich glaube / denke, dass ...<br>Es ist wichtig, jeden Tag ... zu lernen.<br>Wenn ich Zeit habe, ... ich ...<br>..., denn ... · ..., deshalb ... · ..., aber ...<br>Meiner Meinung nach ... · ..., um ... zu ...',m:'Ich lerne Deutsch, weil ich in Deutschland arbeiten möchte. Ich glaube, dass Deutsch nicht leicht ist, aber ich übe jeden Tag. Es ist wichtig, jeden Tag Wörter zu lernen. Wenn ich Zeit habe, sehe ich deutsche Videos. Ich habe auch eine Lern-App, denn ich möchte schnell besser werden. Meiner Meinung nach muss man Sprachen im Alltag benutzen. Deshalb spreche ich oft mit Freunden auf Deutsch. Später möchte ich eine Ausbildung machen, um einen guten Beruf zu bekommen.',c:['فعل بعد از weil و dass و wenn آخر جمله است','بعد از deshalb فعل بلافاصله می‌آید','یک بار Infinitiv mit zu و یک بار um ... zu به کار برده‌ام','قبل از هر Nebensatz کاما گذاشته‌ام','dass را با دو s نوشته‌ام']},{t:'Meine Zukunftspläne (برنامه‌های آینده)',n:60,p:'دربارهٔ آرزوها و برنامه‌های آینده‌ات بنویس. حداقل ۱ جمله با dass، ۱ جمله با wenn، ۱ جمله با ob و ۱ جمله با Infinitiv mit zu. حداقل ۶۰ کلمه.',ph:'In Zukunft möchte ich ... · Mein Wunsch ist es, ... zu ...<br>Ich plane, nächstes Jahr ... zu machen.<br>Ich hoffe, dass ... · Wenn ich ... , dann ...<br>Ich weiß noch nicht, ob ... · Ich freue mich auf ...',m:'In Zukunft möchte ich in Deutschland eine Ausbildung im Bereich Marketing machen. Mein Wunsch ist es, mit Computern und Design zu arbeiten, weil ich das sehr gern mag. Ich plane, nächstes Jahr eine Prüfung zu machen. Wenn ich die Prüfung bestanden habe, bewerbe ich mich bei einer Firma. Ich hoffe, dass ich bald eine passende Stelle finde. Ich weiß noch nicht, ob ich in Berlin oder in München wohnen werde. Aber ich freue mich schon auf die Zukunft.',c:['حداقل یک جمله با dass و یکی با ob دارم','حداقل یک جمله با wenn که در آن فعل جملهٔ اصلی بعد از کاما می‌آید','Infinitiv mit zu را درست ساخته‌ام (با فعل جداشدنی: aufzustehen)','بعد از مُدال zu نگذاشته‌ام']}];
D[8][3]=`<h3>۱) قانون کلی صفت</h3><p>صفت <b>قبل از اسم</b> پایانه می‌گیرد (ein neues Auto). صفت <b>بعد از sein/werden</b> پایانه ندارد (Das Auto ist neu). پایانه به ۳ چیز بستگی دارد: نوع آرتیکل، جنس اسم و حالت (Nom/Akk/Dat).</p><h3>۲) با آرتیکل معرفه (der/die/das)</h3><table><tr><th></th><th>m</th><th>f</th><th>n</th><th>pl</th></tr><tr><td>Nom</td><td>der neu<b>e</b> Mann</td><td>die neu<b>e</b> Frau</td><td>das neu<b>e</b> Kind</td><td>die neu<b>en</b> Kinder</td></tr><tr><td>Akk</td><td>den neu<b>en</b> Mann</td><td>die neu<b>e</b> Frau</td><td>das neu<b>e</b> Kind</td><td>die neu<b>en</b> Kinder</td></tr><tr><td>Dat</td><td>dem neu<b>en</b> Mann</td><td>der neu<b>en</b> Frau</td><td>dem neu<b>en</b> Kind</td><td>den neu<b>en</b> Kindern</td></tr></table><p><b>حفظ آسان:</b> در Nominativ مفرد و در Akkusativ مؤنث/خنثی → <b>‑e</b>؛ همه‌جای دیگر → <b>‑en</b>.</p><h3>۳) با آرتیکل نکره (ein / kein / mein)</h3><table><tr><th></th><th>m</th><th>f</th><th>n</th><th>pl</th></tr><tr><td>Nom</td><td>ein neu<b>er</b> Mann</td><td>eine neu<b>e</b> Frau</td><td>ein neu<b>es</b> Kind</td><td>keine neu<b>en</b> Kinder</td></tr><tr><td>Akk</td><td>einen neu<b>en</b> Mann</td><td>eine neu<b>e</b> Frau</td><td>ein neu<b>es</b> Kind</td><td>keine neu<b>en</b> Kinder</td></tr><tr><td>Dat</td><td>einem neu<b>en</b> Mann</td><td>einer neu<b>en</b> Frau</td><td>einem neu<b>en</b> Kind</td><td>keinen neu<b>en</b> Kindern</td></tr></table><p>نکته: وقتی ein پایانه ندارد (ein Mann، ein Kind)، صفت پایانهٔ آرتیکل را می‌گیرد: <b>-er</b> (m) و <b>-es</b> (n).</p><h3>۴) بدون آرتیکل</h3><table><tr><th></th><th>m</th><th>f</th><th>n</th><th>pl</th></tr><tr><td>Nom</td><td>gut<b>er</b> Kaffee</td><td>gut<b>e</b> Suppe</td><td>gut<b>es</b> Brot</td><td>gut<b>e</b> Kinder</td></tr><tr><td>Akk</td><td>gut<b>en</b> Kaffee</td><td>gut<b>e</b> Suppe</td><td>gut<b>es</b> Brot</td><td>gut<b>e</b> Kinder</td></tr><tr><td>Dat</td><td>gut<b>em</b> Kaffee</td><td>gut<b>er</b> Suppe</td><td>gut<b>em</b> Brot</td><td>gut<b>en</b> Kindern</td></tr></table><p>بدون آرتیکل، خود صفت پایانهٔ آرتیکل را می‌گیرد (مثل der/die/das/dem...) مگر در Dativ مؤنث (‑er) و جمع (‑en).</p><h3>۵) مقایسه</h3><table><tr><th>مثبت</th><th>Komparativ (-er)</th><th>Superlativ (am -sten)</th></tr><tr><td>klein</td><td>kleiner</td><td>am kleinsten</td></tr><tr><td>schnell</td><td>schneller</td><td>am schnellsten</td></tr><tr><td>teuer</td><td>teurer</td><td>am teuersten</td></tr><tr><td>alt</td><td>älter</td><td>am ältesten</td></tr><tr><td>jung</td><td>jünger</td><td>am jüngsten</td></tr><tr><td>groß</td><td>größer</td><td>am größten</td></tr><tr><td>warm</td><td>wärmer</td><td>am wärmsten</td></tr><tr><td>kalt</td><td>kälter</td><td>am kältesten</td></tr><tr><td>lang</td><td>länger</td><td>am längsten</td></tr><tr><td>hoch</td><td>höher</td><td>am höchsten</td></tr><tr><td>nah</td><td>näher</td><td>am nächsten</td></tr><tr><td><b>gut</b></td><td><b>besser</b></td><td><b>am besten</b></td></tr><tr><td><b>viel</b></td><td><b>mehr</b></td><td><b>am meisten</b></td></tr><tr><td><b>gern</b></td><td><b>lieber</b></td><td><b>am liebsten</b></td></tr></table><div class=e>Berlin ist größer <b>als</b> Köln. (تفاوت → als)<br>Er ist so alt <b>wie</b> ich. (برابری → so ... wie)<br>Er ist nicht so groß <b>wie</b> sein Bruder.<br>Ich trinke <b>lieber</b> Tee als Kaffee.<br>Wer läuft <b>am schnellsten</b>?</div><p>قبل از اسم، Komparativ و Superlativ هم پایانه می‌گیرند: ein größeres Haus · die größte Stadt · der höchste Berg · mein bester Freund.</p><h3>۶) لغات</h3><p><b>شخصیت:</b> freundlich · nett · sympathisch · lustig · ruhig · ehrlich · fleißig · faul · höflich · geduldig · schüchtern · mutig · klug</p><p><b>ظاهر:</b> groß · klein · schlank · jung · alt · hübsch · blond · dunkel · lockig · kurze / lange Haare · braune Augen</p><p><b>لباس:</b> das Hemd · die Hose · das Kleid · die Jacke · der Pullover · die Schuhe · der Mantel · modern · bequem · elegant</p><p><b>شهر و طبیعت:</b> die Hauptstadt · das Dorf · der Berg · der See · der Fluss · der Wald · das Meer · laut · ruhig · sauber · schmutzig · teuer · billig</p><p><b>مزایا و معایب:</b> der Vorteil · der Nachteil · Einerseits ..., andererseits ... · Ein Vorteil ist, dass ...</p>`;
setE(8,['Auto خنثی + ein در Nominativ → ‑es: ein neues Auto.','مقایسه با تفاوت: groß → größer (اوملاوت) + als.','برابری با so ... wie بیان می‌شود؛ als فقط برای تفاوت است.']);
