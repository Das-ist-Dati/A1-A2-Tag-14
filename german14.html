D.map((d,i)=>`<button class="day ${S.done[i]?"d":""}" onclick="openDay(${i})"><span class=n>${S.done[i]?"★":fa(i+1)}</span><span><b>روز ${fa(i+1)} – ${d[0]}</b><small dir=ltr style="text-align:right">${d[1]}</small></span></button>`).join("")+
`<button class=rv onclick="review()" ${S.wrong.length?"":"disabled"}>🔁 مرور اشتباهات (${fa(S.wrong.length)})</button>`}
function start(i,items){L={day:i,items:items||D[i][2].map((_,j)=>[i,j]),k:0,h:Math.max(8,Math.ceil((items||D[i][2]).length/4))};show()}
function review(){if(!S.wrong.length)return;start(-1,S.wrong.map(s=>s.split(":").map(Number)))}
const Q=()=>D[L.items[L.k][0]][2][L.items[L.k][1]];
function show(){const q=Q();L.c=0;L.sel=null;L.ans=[];
if(q[0]=="m")L.opts=sh(q[2]);else if(q[0]=="o")L.w=sh(q[1].split(" "));L.t="";draw()}
function openDay(i){if(!D[i][3])return start(i);app.innerHTML=`<div class=top><button class=x onclick="home()">✕</button><b>روز ${fa(i+1)} – ${D[i][0]}</b></div><div class=nt>${D[i][3]}</div>${D[i][4]?`<button class=rv onclick=wr(${i})>✍️ نوشتار (Schreiben) – ${fa(D[i][4].length)} تمرین</button>`:''}<button class=main onclick="start(${i})">شروع تمرین (${fa(D[i][2].length)} سؤال)</button>`;scrollTo(0,0)}
function sb(){const b=document.getElementById("mbtn");if(b)b.disabled=!L.t.trim()}
function draw(){const q=Q(),n=L.items.length;
let h=`<div class=top><button class=x onclick="home()">✕</button><div class=bar><i style="width:${L.k/n*100}%"></i></div><b>❤️ ${fa(L.h)}</b></div>`;
if(q[0]=="m"){h+=`<p class=cap>گزینهٔ درست را انتخاب کن</p>${q[4]?'<button class=rv onclick=spk()>🔊 گوش بده (Hören)</button>':''}<h2 dir=ltr>${q[1]}</h2>`+L.opts.map((o,i)=>`<button class="op ${L.sel==i?"s":""}" onclick="pick(${i})">${o}</button>`).join("")}
else if(q[0]=="f"){h+=`<p class=cap>جای خالی را تایپ کن${q[3]?" ("+q[3]+")":""}</p><h2 dir=ltr>${q[1]}</h2><input id=fi dir=ltr autocomplete=off value="${L.t}" ${L.c?"disabled":""} oninput="L.t=this.value;sb()" style="width:100%;box-sizing:border-box;font-size:20px;padding:10px;border:2px solid var(--bd);border-radius:12px;background:var(--cd);color:var(--tx)">`}else{h+=`<p class=cap>به آلمانی بچین: <b>${q[2]}</b></p><div class=ans>${L.ans.map(i=>`<button class=ch onclick="un(${i})">${L.w[i]}</button>`).join("")}</div><div class=pool>${L.w.map((w,i)=>L.ans.includes(i)?`<span class="ch ghost">${w}</span>`:`<button class=ch onclick="pk(${i})">${w}</button>`).join("")}</div>`}
const ok=q[0]=="m"?L.sel!=null:q[0]=="f"?!!L.t.trim():L.ans.length>0;
if(!L.c)h+=`<button id=mbtn class=main ${ok?"":"disabled"} onclick="chk()">بررسی</button>`;
else{const t=q[0]=="m"?(q[1].includes("___")?q[1].replace("___",q[2][0]):q[2][0]):q[0]=="f"?q[1].replace("___",q[2]):q[1];
h+=`<div class="fb ${L.good?"g":"r"}"><b>${L.good?"آفرین! ✓":"اشتباه بود ✗"}</b><div dir=ltr>${t} <button class=x onclick="speak('${t}')">🔊</button></div>${L.good?"":`<div>❌ پاسخ تو: <span dir=ltr>${L.yours}</span></div><div>💡 ${ex(q)}</div>`}<button class=main onclick="nx()">ادامه</button></div>`}
app.innerHTML=h}
function pick(i){if(L.c)return;L.sel=i;draw()}
function pk(i){if(L.c)return;L.ans.push(i);draw()}
function un(i){if(L.c)return;L.ans=L.ans.filter(x=>x!=i);draw()}
function chk(){const q=Q(),key=L.items[L.k].join(":");
L.good=q[0]=="m"?L.opts[L.sel]==q[2][0]:q[0]=="f"?L.t.trim().toLowerCase()==q[2].toLowerCase():L.ans.map(i=>L.w[i]).join(" ")==q[1];
L.c=1;L.yours=q[0]=="m"?L.opts[L.sel]:q[0]=="f"?L.t:L.ans.map(i=>L.w[i]).join(" ");
if(L.good){S.xp+=10;S.wrong=S.wrong.filter(x=>x!=key)}else{L.h--;if(!S.wrong.includes(key))S.wrong.push(key)}
save();draw()}
function nx(){L.k++;if(L.h<=0||L.k>=L.items.length)end();else show()}
function end(){const win=L.h>0;
if(win){const t=new Date().toDateString();if(S.last!=t){S.streak=S.last==new Date(Date.now()-864e5).toDateString()?S.streak+1:1;S.last=t}
if(L.day>=0)S.done[L.day]=1;S.xp+=20}save();
app.innerHTML=`<div class=c><div class=e>${win?"🎉":"💔"}</div><h1>${win?"درس تمام شد!":"قلب‌هات تموم شد"}</h1><p>${win?"+۲۰ XP پاداش | 🔥 "+fa(S.streak)+" روز پیاپی":"اشتباه‌ها در «مرور اشتباهات» ذخیره شدند. دوباره امتحان کن."}</p><button class=main onclick="home()">ادامه</button></div>`}
home();
</script></body></html>
