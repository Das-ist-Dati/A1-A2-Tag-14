['f','Das ist ein nett___ Mann.','er','','Mann مذکر + ein در Nominativ → ‑er.'],['f','Das ist eine schön___ Stadt.','e','','Stadt مؤنث + eine (Nom) → ‑e.'],['f','Das ist ein neu___ Auto.','es','','Auto خنثی + ein (Nom) → ‑es.'],['f','Ich kaufe einen neu___ Computer.','en','','Computer مذکر + einen (Akk) → ‑en.'],['f','Ich trinke ein kalt___ Wasser.','es','','Wasser خنثی + ein (Akk) → ‑es.'],['f','Der neu___ Lehrer ist nett.','e','','der + Nominativ مذکر → ‑e.'],['f','Ich sehe den neu___ Lehrer.','en','','den (Akkusativ مذکر) → ‑en.'],['f','Die klein___ Kinder spielen.','en','','جمع + die → ‑en.'],['f','Ich helfe der alt___ Frau.','en','','Dativ مؤنث با der → ‑en.'],['f','Er wohnt in einem klein___ Haus.','en','','Dativ با einem → ‑en.'],['f','Ich trinke gern heiß___ Tee.','en','','بدون آرتیکل، Akkusativ مذکر → ‑en.'],['f','Berlin ist größer ___ Köln.','als','','تفاوت → als.'],['f','Er ist so alt ___ ich.','wie','','برابری → so ... wie.'],['f','Mein Bruder ist ___ als ich. (alt)','älter','alt','alt → älter (a → ä).'],['f','Das ist der ___ Berg. (hoch)','höchste','hoch','hoch → höher → am höchsten؛ قبل از اسم: der höchste Berg.'],
['m','Das ist ein ___ Haus.',['großes','große','großer'],'Haus خنثی + ein → ‑es.'],['m','Ich habe eine ___ Idee.',['gute','guter','gutes'],'Idee مؤنث + eine → ‑e.'],['m','Er hat einen ___ Hund.',['kleinen','kleine','kleiner'],'Hund مذکر + einen (Akk) → ‑en.'],['m','Ich kaufe das ___ Kleid.',['rote','rotes','roten'],'das + Akkusativ خنثی → ‑e.'],['m','Wir wohnen in der ___ Stadt.',['großen','große','großer'],'Dativ مؤنث با der → ‑en.'],['m','Ich gebe dem ___ Kind einen Apfel.',['kleinen','kleine','kleinem'],'Dativ با dem → ‑en.'],['m','___ Kaffee schmeckt gut.',['Heißer','Heiße','Heißen'],'بدون آرتیکل، Nominativ مذکر → ‑er.'],['m','Ich liebe ___ Musik.',['moderne','moderner','modernes'],'Musik مؤنث، بدون آرتیکل، Akkusativ → ‑e.'],['m','Das Auto ist ___.',['neu','neues','neue'],'صفت بعد از sein پایانه نمی‌گیرد.'],['m','Mein Vater ist ___ als meine Mutter. (alt)',['älter','alter','älteste'],'alt → älter (a → ä) + als.'],['m','Das ist die ___ Stadt der Welt. (groß)',['größte','größer','am größten'],'قبل از اسم: die + ‑ste → die größte Stadt.'],['m','Wer läuft am ___? (schnell)',['schnellsten','schneller','schnellste'],'Superlativ بعد از فعل: am + ‑sten.'],['m','Dieses Auto ist ___ als das andere. (gut)',['besser','guter','bester'],'gut → besser (بی‌قاعده).'],['m','Ich trinke ___ Tee als Kaffee. (gern)',['lieber','gerner','mehr'],'gern → lieber → am liebsten.'],['m','Er ist nicht so groß ___ sein Bruder.',['wie','als','denn'],'نفی برابری: nicht so ... wie.'],['m','Welcher Satz ist richtig?',['Ich habe einen neuen Computer.','Ich habe ein neuen Computer.','Ich habe einen neue Computer.'],'Computer مذکر + einen (Akk) → ‑en.'],['m','Ein ___ Mensch hilft anderen. (freundlich)',['freundlicher','freundliche','freundliches'],'Mensch مذکر + ein (Nom) → ‑er.'],['m','«ruhig» bedeutet ___',['آرام','پرسروصدا','تنبل'],'ruhig = آرام؛ laut = پرسروصدا؛ faul = تنبل.'],['m','Das Gegenteil von Vorteil ist ___',['Nachteil','Beispiel','Grund'],'der Vorteil ≠ der Nachteil.'],['m','«billig» bedeutet ___',['ارزان','گران','کثیف'],'billig = ارزان؛ teuer = گران؛ schmutzig = کثیف.'],
['o','Das ist ein netter Mann','این مرد مهربانی است','Mann مذکر + ein (Nom) → netter.'],['o','Ich habe einen neuen Computer gekauft','یک کامپیوتر جدید خریده‌ام','Computer مذکر Akk + einen → neuen؛ Perfekt: gekauft آخر.'],['o','Die kleine Katze schläft auf dem Sofa','گربهٔ کوچک روی مبل می‌خوابد','die kleine (Nom مؤنث → ‑e)؛ auf dem Sofa (Dativ).'],['o','Er wohnt in einer großen Stadt','او در یک شهر بزرگ زندگی می‌کند','Dativ مؤنث با einer → großen.'],['o','Berlin ist größer als Hamburg','برلین بزرگ‌تر از هامبورگ است','Komparativ + als.'],['o','Mein Bruder ist so alt wie ich','برادرم هم‌سن من است','برابری: so ... wie.'],['o','Das ist der höchste Berg in Deutschland','این بلندترین کوه آلمان است','hoch → höchste (Superlativ قبل از اسم + der).'],['o','Ich trinke lieber Tee als Kaffee','چای را بیشتر از قهوه دوست دارم','gern → lieber + als.'],['o','Im Sommer ist es wärmer als im Winter','در تابستان گرم‌تر از زمستان است','warm → wärmer + als؛ im = in dem.'],['o','Sie trägt ein rotes Kleid und eine schwarze Jacke','او یک لباس قرمز و یک ژاکت مشکی پوشیده است','Kleid خنثی + ein → ‑es؛ Jacke مؤنث + eine → ‑e (Akkusativ).'],['o','Ein Vorteil ist dass die Stadt ruhig ist','یک مزیت این است که شهر آرام است','dass → فعل ist آخر.'],['o','Mein bester Freund ist sehr lustig','بهترین دوستم خیلی بامزه است','gut → besser → best-؛ mein + Nominativ مذکر → ‑er: mein bester Freund.']);
D[8][4]=[{t:'Eine Person beschreiben (توصیف یک شخص)',n:60,p:'یک شخص (دوست، همکار، اهل خانواده) را توصیف کن: سن، ظاهر، شخصیت، لباس و یک مقایسه با خودت. حداقل ۵ صفت قبل از اسم (با پایانهٔ درست) و یک Komparativ. حداقل ۶۰ کلمه.',ph:'Mein bester Freund heißt ... · Er/Sie ist ... Jahre alt.<br>Er hat kurze, dunkle Haare und braune Augen.<br>Er ist ein sehr netter / lustiger Mensch.<br>Er trägt oft eine blaue Jacke und eine bequeme Hose.<br>Er ist größer / älter als ich. · Er ist nicht so sportlich wie ich.',m:'Mein bester Freund heißt Ali. Er ist 24 Jahre alt und ein sehr netter Mensch. Er hat kurze, dunkle Haare und braune Augen. Er ist größer als ich, aber nicht so sportlich. Er ist immer freundlich und hilft gern anderen. Er trägt oft eine blaue Jacke und eine bequeme Hose. Sein größtes Hobby ist Fußball. Ich finde, dass er der lustigste Mensch in meinem Freundeskreis ist.',c:['پایانهٔ صفت‌ها با جنس اسم و حالت جور است (ein netter Mensch, eine blaue Jacke)','صفت‌های بعد از sein پایانه ندارند (Er ist nett)','حداقل یک جمله با als و یکی با so ... wie نوشته‌ام','یک Superlativ به کار برده‌ام (der lustigste, am liebsten)','املای Komparativ بی‌قاعده‌ها را چک کرده‌ام (größer, älter, besser)']},{t:'Zwei Städte vergleichen (مقایسهٔ دو شهر)',n:70,p:'دو شهر را با هم مقایسه کن: اندازه، هوا، هزینه، طبیعت، مزایا و معایب و نظر خودت. حداقل ۳ Komparativ، یک Superlativ و Vorteil/Nachteil. حداقل ۷۰ کلمه.',ph:'... ist größer / ruhiger / teurer als ...<br>In ... ist es im Sommer wärmer als in ...<br>... ist nicht so sauber wie ...<br>Ein Vorteil von ... ist ... · Ein Nachteil ist ...<br>Einerseits ..., andererseits ...<br>Meiner Meinung nach ist ... die bessere Stadt.',m:'Teheran ist viel größer als Berlin und hat mehr Einwohner. In Teheran ist es im Sommer wärmer als in Berlin. Berlin ist ruhiger und grüner, aber nicht so billig wie manche Leute denken. Teheran hat hohe Berge im Norden und die Natur ist wunderschön. In Berlin gibt es viele Parks und Seen. Ein Vorteil von Teheran ist das gute Essen. Ein Nachteil ist der starke Verkehr. Meiner Meinung nach ist Berlin die bessere Stadt zum Studieren, aber Teheran ist meine Heimat.',c:['حداقل ۳ Komparativ با als نوشته‌ام','یک بار nicht so ... wie به کار برده‌ام','Vorteil و Nachteil هر کدام یک بار آمده‌اند','نظر خودم را با Meiner Meinung nach گفته‌ام','اوملاوت Komparativ را چک کرده‌ام (größer, wärmer)']}];
D[8][3]=`<h3>۱) صفت قبل از اسم: پایانه‌ها</h3><p>بعد از فعل ربطی (sein, werden) صفت پایانه نمی‌گیرد: Das Auto ist <b>neu</b>. ولی قبل از اسم پایانه می‌گیرد و پایانه به آرتیکل و حالت بستگی دارد. قانون: اگر آرتیکل حالت را نشان ندهد، خود صفت نشان می‌دهد (پایانه‌های -er, -es, -em).</p><p><b>الف) بعد از آرتیکل معرفه (der/die/das)</b></p><table><tr><th></th><th>m</th><th>f</th><th>n</th><th>pl</th></tr><tr><td>Nom</td><td>der neu<b>e</b> Mann</td><td>die neu<b>e</b> Frau</td><td>das neu<b>e</b> Auto</td><td>die neu<b>en</b> Autos</td></tr><tr><td>Akk</td><td>den neu<b>en</b> Mann</td><td>die neu<b>e</b> Frau</td><td>das neu<b>e</b> Auto</td><td>die neu<b>en</b> Autos</td></tr><tr><td>Dat</td><td>dem neu<b>en</b> Mann</td><td>der neu<b>en</b> Frau</td><td>dem neu<b>en</b> Auto</td><td>den neu<b>en</b> Autos</td></tr></table><p><b>ب) بعد از آرتیکل نکره و ملکی (ein, kein, mein)</b></p><table><tr><th></th><th>m</th><th>f</th><th>n</th><th>pl</th></tr><tr><td>Nom</td><td>ein neu<b>er</b> Mann</td><td>eine neu<b>e</b> Frau</td><td>ein neu<b>es</b> Auto</td><td>keine neu<b>en</b> Autos</td></tr><tr><td>Akk</td><td>einen neu<b>en</b> Mann</td><td>eine neu<b>e</b> Frau</td><td>ein neu<b>es</b> Auto</td><td>keine neu<b>en</b> Autos</td></tr><tr><td>Dat</td><td>einem neu<b>en</b> Mann</td><td>einer neu<b>en</b> Frau</td><td>einem neu<b>en</b> Auto</td><td>keinen neu<b>en</b> Autos</td></tr></table><p><b>ج) بدون آرتیکل</b></p><table><tr><th></th><th>m</th><th>f</th><th>n</th><th>pl</th></tr><tr><td>Nom</td><td>gut<b>er</b> Kaffee</td><td>gut<b>e</b> Milch</td><td>gut<b>es</b> Wasser</td><td>gut<b>e</b> Freunde</td></tr><tr><td>Akk</td><td>gut<b>en</b> Kaffee</td><td>gut<b>e</b> Milch</td><td>gut<b>es</b> Wasser</td><td>gut<b>e</b> Freunde</td></tr><tr><td>Dat</td><td>gut<b>em</b> Kaffee</td><td>gut<b>er</b> Milch</td><td>gut<b>em</b> Wasser</td><td>gut<b>en</b> Freunden</td></tr></table><div class=e>Dativ همیشه ‑en است (بعد از آرتیکل‌ها): in einer klein<b>en</b> Wohnung · mit dem neu<b>en</b> Zug<br>بیشتر موارد می‌شود ‑en گذاشت: تنها Nom مفرد و Akk (f, n) ‑e/‑es/‑er دارند.</div><p>نکته: بعضی صفت‌ها تغییر می‌کنند: teuer → ein teur<b>es</b> Auto · dunkel → dunkl<b>e</b> Haare · hoch → ein hoh<b>er</b> Berg.</p><h3>۲) صفت تفضیلی و عالی</h3><table><tr><th>مثبت</th><th>Komparativ (-er)</th><th>Superlativ (am -sten)</th></tr><tr><td>schnell</td><td>schneller</td><td>am schnellsten</td></tr><tr><td>schön</td><td>schöner</td><td>am schönsten</td></tr><tr><td>alt</td><td>älter</td><td>am ältesten</td></tr><tr><td>jung</td><td>jünger</td><td>am jüngsten</td></tr><tr><td>groß</td><td>größer</td><td>am größten</td></tr><tr><td>lang</td><td>länger</td><td>am längsten</td></tr><tr><td>warm</td><td>wärmer</td><td>am wärmsten</td></tr><tr><td>heiß</td><td>heißer</td><td>am heißesten</td></tr><tr><td>teuer</td><td>teurer</td><td>am teuersten</td></tr><tr><td><b>gut</b></td><td><b>besser</b></td><td><b>am besten</b></td></tr><tr><td><b>viel</b></td><td><b>mehr</b></td><td><b>am meisten</b></td></tr><tr><td><b>gern</b></td><td><b>lieber</b></td><td><b>am liebsten</b></td></tr><tr><td><b>hoch</b></td><td><b>höher</b></td><td><b>am höchsten</b></td></tr><tr><td><b>nah</b></td><td><b>näher</b></td><td><b>am nächsten</b></td></tr></table><p>قبل از اسم: Superlativ با آرتیکل و پایانه‌های صفت: der schnell<b>ste</b> Zug · die schön<b>ste</b> Stadt · das größ<b>te</b> Haus. Komparativ هم قبل از اسم پایانه می‌گیرد: ein größ<b>eres</b> Haus.</p><h3>۳) مقایسه: als و wie</h3><table><tr><th>نابرابری</th><th>تساوی</th></tr><tr><td>Komparativ + <b>als</b><br>Berlin ist größer <b>als</b> Köln.</td><td>so + صفت + <b>wie</b> (یا genauso ... wie)<br>Er ist so groß <b>wie</b> sein Vater.</td></tr><tr><td colspan=2>نفی تساوی: Ich bin <b>nicht so</b> alt <b>wie</b> du. · Superlativ: Am schnellsten ist der Zug. · Das ist der höchste Berg.</td></tr></table><h3>۴) لغات</h3><p><b>شخصیت:</b> freundlich · nett · sympathisch · ehrlich · höflich · fleißig · faul · lustig · ernst · ruhig · mutig · schüchtern · intelligent · geduldig</p><p><b>ظاهر:</b> groß · klein · schlank · jung · alt · hübsch · blond · dunkel · die Haare (lang / kurz) · die Augen (blau / braun)</p><p><b>لباس:</b> die Hose · das Hemd · das T-Shirt · der Pullover · die Jacke · das Kleid · der Rock · die Schuhe · der Mantel · die Mütze · tragen (پوشیدن)</p><p><b>شهر و طبیعت:</b> die Stadt · das Dorf · der Berg · der Wald · der See · der Fluss · das Meer · laut · ruhig · sauber · grün · der Vorteil · der Nachteil · einerseits ... andererseits</p><h3>۵) نمونه‌ها</h3><div class=e>Mein Freund ist groß und schlank. Er hat kurze dunkle Haare und trägt eine blaue Jacke. Er ist freundlicher als ich.<br>Teheran ist größer als Köln. Berlin ist nicht so heiß wie Teheran im Sommer. Die schönste Jahreszeit ist der Frühling.</div>`;

['m','Das ist ein ___ Tisch.',['neuer','neue','neues'],'ein + Nominativ مذکر: ein neuer Tisch (‑er).'],['m','Das ist eine ___ Idee.',['gute','guter','gutes'],'eine + مؤنث + Nom: eine gute Idee.'],['m','Ich kaufe einen ___ Mantel.',['warmen','warmer','warmes'],'Akkusativ مذکر: einen warmen Mantel.'],['m','Das ist das ___ Auto von Anna.',['neue','neues','neuen'],'das + Nominativ خنثی: das neue Auto (‑e).'],['m','Die ___ Kinder spielen im Garten.',['kleinen','kleine','kleiner'],'die + جمع: ‑en: die kleinen Kinder.'],['m','Ich wohne in einem ___ Haus.',['alten','alter','altes'],'in einem + Dativ: ‑en: in einem alten Haus.'],['m','Er trinkt ___ Kaffee.',['starken','starker','starke'],'بدون آرتیکل + Akkusativ مذکر: starken Kaffee (‑en).'],['m','Mit dem ___ Zug fahre ich nach Hause.',['schnellen','schnelle','schneller'],'mit dem + Dativ: ‑en.'],['m','Der ___ Mann ist mein Onkel.',['nette','netter','netten'],'der + Nom مذکر: der nette Mann (بدون آرتیکل: netter Mann).'],['m','Wir haben ein ___ Problem.',['großes','große','großer'],'ein + خنثی: ein großes Problem (‑es).'],['m','Das Wetter ist heute ___ als gestern.',['schöner','schönste','am schönsten'],'مقایسه با als → Komparativ: schöner.'],['m','Sie ist die ___ Schülerin in der Klasse.',['beste','bessere','gute'],'Superlativ قبل از اسم: die beste (gut → besser → best-).'],['m','Der Zug ist ___ als der Bus.',['schneller','schnell','schnellste'],'Komparativ + als: schneller als.'],['m','Mein Auto ist nicht so ___ wie dein Auto.',['teuer','teurer','am teuersten'],'so ... wie → صفت ساده: so teuer wie.'],['m','Im Sommer ist es hier am ___.',['wärmsten','wärmer','warm'],'Superlativ: am wärmsten (warm → wärmer → am wärmsten).'],['m','Komparativ von jung: ___',['jünger','junger','jungere'],'jung → jünger (اوملاوت).'],['m','Superlativ von viel: ___',['am meisten','am vielsten','am mehrsten'],'viel → mehr → am meisten (بی‌قاعده).'],['m','Welcher Satz ist richtig?',['Mein Bruder ist größer als ich.','Mein Bruder ist größer wie ich.','Mein Bruder ist so größer als ich.'],'Komparativ با als؛ wie برای تساوی با so است.'],['m','Wie sagt man «موهای کوتاه»?',['kurze Haare','kurzen Haare','kurzer Haare'],'جمع بدون آرتیکل: kurze Haare (‑e).'],['m','Welches Wort passt zu «Charakter»?',['freundlich','Hose','Berg'],'freundlich صفت شخصیت است؛ Hose لباس و Berg طبیعت است.'],

D[8][4]=[{t:'Eine Person beschreiben (توصیف یک شخص)',n:60,p:'یک دوست یا عضو خانواده را توصیف کن: ظاهر (مو و چشم)، لباس، شخصیت و یک مقایسه با خودت (با als و wie). حداقل ۴ صفت با پایانهٔ درست قبل از اسم. حداقل ۶۰ کلمه.',ph:'Mein Freund heißt ... Er ist ... Jahre alt.<br>Er ist groß und schlank. · Er hat kurze dunkle Haare und braune Augen.<br>Er trägt eine blaue Jacke und eine schwarze Hose.<br>Er ist freundlich, lustig und ehrlich.<br>Er ist älter / fleißiger als ich. · Er ist so ... wie ...',m:'Mein bester Freund heißt Ali. Er ist 24 Jahre alt und wohnt in einer großen Stadt. Er ist groß und schlank und hat kurze dunkle Haare und braune Augen. Er trägt gern eine blaue Jacke und eine schwarze Hose. Ali ist sehr freundlich, lustig und ehrlich. Er ist älter als ich und viel fleißiger als ich. Das gefällt mir an ihm am besten: Er hat immer gute Ideen und hilft seinen Freunden.',c:['پایانه‌های صفت با آرتیکل و حالت جور هستند (eine blaue Jacke, einen blauen Pullover)','برای جمع بدون آرتیکل از ‑e استفاده کرده‌ام (kurze Haare)','یک Komparativ با als و یک جمله با so ... wie نوشته‌ام','کلمات شخصیتی را به‌صورت صفت بعد از ist بدون پایانه نوشته‌ام']},{t:'Zwei Städte vergleichen (مقایسهٔ دو شهر)',n:70,p:'دو شهر (مثلاً شهر تو و یک شهر آلمانی) را مقایسه کن: اندازه، هوا، ترافیک، طبیعت، و نظر خودت (با Superlativ). مزایا و معایب را هم بگو. حداقل ۷۰ کلمه.',ph:'... ist größer / kleiner / ruhiger als ...<br>In ... ist es im Sommer heißer / wärmer.<br>... ist nicht so laut wie ...<br>Der Vorteil ist, dass ... · Der Nachteil ist ...<br>Einerseits ..., andererseits ...<br>Am besten gefällt mir ... · Die schönste Jahreszeit ist ...',m:'Teheran und Berlin sind beide große Städte, aber sie sind sehr verschieden. Teheran ist viel größer als Berlin und hat mehr Einwohner. In Teheran ist es im Sommer heißer, und im Norden gibt es hohe Berge. Berlin ist grüner und ruhiger als Teheran. Dort gibt es viele alte Gebäude und schöne Parks. Die U-Bahn in Berlin ist schneller als der Bus. Der Vorteil von Teheran ist das Essen, der Nachteil ist der Verkehr. Meiner Meinung nach ist das Leben in Berlin entspannter, aber das Essen in Teheran schmeckt am besten.',c:['همهٔ Komparativها با als نوشته شده‌اند','حداقل یک Superlativ با am ... sten یا der/die/das ... ste','صفت‌های بی‌قاعده (gut → besser → am besten, viel → mehr) درست هستند','یک مزیت و یک عیب (Vorteil / Nachteil) نوشته‌ام','پایانه‌های صفت قبل از اسم را دوباره چک کردم']}];
D[9][3]=`<h3>۱) افعال با حرف اضافهٔ ثابت</h3><p>بعضی فعل‌ها همیشه با یک حرف اضافهٔ مشخص و یک حالت (Akk یا Dat) می‌آیند. حرف اضافه را همراه فعل و حالت حفظ کن (ترجمهٔ حرف اضافه معمولاً منطقی نیست).</p><table><tr><th>+ Akkusativ</th><th>مثال</th></tr><tr><td>warten <b>auf</b></td><td>Ich warte <b>auf den</b> Bus.</td></tr><tr><td>sich freuen <b>auf</b> (آینده)</td><td>Ich freue mich <b>auf</b> das Wochenende.</td></tr><tr><td>sich freuen <b>über</b> (حال/گذشته)</td><td>Ich freue mich <b>über</b> das Geschenk.</td></tr><tr><td>sich interessieren <b>für</b></td><td>Er interessiert sich <b>für</b> Musik.</td></tr><tr><td>sich ärgern <b>über</b></td><td>Ich ärgere mich <b>über</b> den Lärm.</td></tr><tr><td>sprechen <b>über</b> (دربارهٔ)</td><td>Wir sprechen <b>über</b> das Problem.</td></tr><tr><td>denken <b>an</b> · sich erinnern <b>an</b></td><td>Ich denke <b>an</b> meine Familie.</td></tr><tr><td>sich kümmern <b>um</b> · bitten <b>um</b> · sich bewerben <b>um</b></td><td>Ich kümmere mich <b>um</b> meine Oma.</td></tr><tr><td>hoffen <b>auf</b> · achten <b>auf</b> · aufpassen <b>auf</b></td><td>Ich hoffe <b>auf</b> gutes Wetter.</td></tr><tr><td>sich verlieben <b>in</b> · sich entscheiden <b>für</b></td><td>Er hat sich <b>in</b> sie verliebt.</td></tr></table><table><tr><th>+ Dativ</th><th>مثال</th></tr><tr><td>träumen <b>von</b></td><td>Sie träumt <b>von einer</b> Reise.</td></tr><tr><td>sprechen / telefonieren / sich treffen <b>mit</b></td><td>Ich telefoniere <b>mit meiner</b> Mutter.</td></tr><tr><td>Angst haben <b>vor</b></td><td>Er hat Angst <b>vor dem</b> Hund.</td></tr><tr><td>fragen <b>nach</b></td><td>Ich frage <b>nach dem</b> Weg.</td></tr><tr><td>teilnehmen <b>an</b></td><td>Wir nehmen <b>an einem</b> Kurs teil.</td></tr><tr><td>gehören <b>zu</b> · einladen <b>zu</b></td><td>Ich lade dich <b>zu</b> meinem Geburtstag ein.</td></tr><tr><td>sich beschäftigen / anfangen / aufhören <b>mit</b></td><td>Er beschäftigt sich <b>mit</b> Computern.</td></tr></table><h3>۲) کلمات پرسشی: wo(r) + حرف اضافه / حرف اضافه + wen/wem</h3><table><tr><th></th><th>برای چیز / موضوع</th><th>برای شخص</th></tr><tr><td>auf</td><td><b>Worauf</b> wartest du? – Auf den Bus.</td><td><b>Auf wen</b> wartest du? – Auf meinen Freund.</td></tr><tr><td>für</td><td><b>Wofür</b> interessierst du dich? – Für Musik.</td><td><b>Für wen</b> kaufst du das? – Für meine Mutter.</td></tr><tr><td>über</td><td><b>Worüber</b> ärgerst du dich?</td><td><b>Über wen</b> sprecht ihr?</td></tr><tr><td>an</td><td><b>Woran</b> denkst du?</td><td><b>An wen</b> denkst du?</td></tr><tr><td>von</td><td><b>Wovon</b> träumst du?</td><td><b>Von wem</b> träumst du? (Dativ!)</td></tr><tr><td>mit</td><td><b>Womit</b> beschäftigst du dich?</td><td><b>Mit wem</b> sprichst du? (Dativ!)</td></tr><tr><td>vor</td><td><b>Wovor</b> hast du Angst?</td><td><b>Vor wem</b> hast du Angst?</td></tr></table><p>قانون: اگر حرف اضافه با صدادار شروع شود می‌شود <b>wor-</b> (worauf, woran, worüber, worum) وگرنه <b>wo-</b> (wofür, wovon, womit, wovor).</p><h3>۳) Präpositionaladverbien: da(r) + حرف اضافه</h3><p>برای جایگزینی یک <b>چیز</b> (نه شخص) بعد از حرف اضافه: darauf, dafür, darüber, daran, davon, damit, davor, darum.</p><div class=e>Wartest du auf den Bus? – Ja, ich warte <b>darauf</b>.<br>Interessierst du dich für Politik? – Ja, ich interessiere mich <b>dafür</b>.<br>Ärgerst du dich über den Verkehr? – Ja, ich ärgere mich <b>darüber</b>.<br>برای شخص: Ich warte auf <b>ihn</b>. (نه darauf)<br>با dass/Infinitiv: Ich warte <b>darauf, dass</b> er anruft. · Ich freue mich <b>darauf, dich zu sehen</b>.</div><h3>۴) لغات</h3><p><b>علاقه و سرگرمی:</b> das Hobby · die Musik · der Sport · malen · fotografieren · wandern · tanzen · kochen · reisen · Gitarre spielen · Videospiele spielen</p><p><b>کار:</b> die Arbeit · der Job · die Stelle · der Chef / die Chefin · der Kollege · das Gehalt · die Bewerbung · der Lebenslauf · das Vorstellungsgespräch · arbeitslos</p><p><b>تحصیل:</b> die Ausbildung · das Studium · die Schule · die Universität · die Prüfung · der Kurs · bestehen · durchfallen · sich vorbereiten auf</p><p><b>رابطه:</b> die Freundschaft · die Beziehung · sich verlieben · heiraten · sich streiten · sich vertragen · vertrauen · der Nachbar</p>`;

['f','Ich warte ___ den Bus.','auf','','warten auf + Akkusativ.'],['f','Sie interessiert sich ___ Mode.','für','','sich interessieren für + Akkusativ.'],['f','Wir sprechen ___ das Wetter.','über','','sprechen über + Akkusativ (موضوع).'],['f','Er denkt oft ___ seine Familie.','an','','denken an + Akkusativ.'],['f','Ich ärgere mich ___ den Lärm.','über','','sich ärgern über + Akkusativ.'],['f','Sie träumt ___ einem Haus am Meer.','von','','träumen von + Dativ: von einem Haus.'],['f','Ich telefoniere ___ meiner Mutter.','mit','','telefonieren mit + Dativ.'],['f','Er hat Angst ___ dem Hund.','vor','','Angst haben vor + Dativ.'],['f','Ich frage ___ dem Weg.','nach','','fragen nach + Dativ: nach dem Weg.'],['f','Wir nehmen ___ einem Kurs teil.','an','','teilnehmen an + Dativ.'],['f','___ interessierst du dich? (چیز)','Wofür','','برای چیز: wo + für = wofür (für با صدادار شروع نمی‌شود).'],['f','___ freust du dich? – Auf den Urlaub.','Worauf','','auf با صدادار شروع می‌شود → wo + r + auf = worauf.'],['f','Wartest du auf den Bus? – Ja, ich warte ___.','darauf','','جایگزین چیز: da + r + auf = darauf.'],['f','___ wartest du? – Auf meinen Freund.','Auf wen','','برای شخص: حرف اضافه + wen (Akkusativ).'],['f','Ich freue mich ___, dich zu sehen.','darauf','','sich freuen darauf + Infinitiv mit zu.'],
['m','Ich warte ___ den Bus.',['auf','für','an'],'warten auf + Akkusativ.'],['m','Er interessiert sich ___ Fußball.',['für','auf','über'],'sich interessieren für.'],['m','Ich freue mich ___ die Ferien. (آینده)',['auf','über','an'],'sich freuen auf = ذوق آینده؛ über = دربارهٔ چیز حال/گذشته.'],['m','Ich freue mich ___ das Geschenk. (گرفتم)',['über','auf','für'],'sich freuen über = خوشحالی از چیزی که هست/شد.'],['m','Sie spricht ___ ihrem Chef.',['mit','über','von'],'sprechen mit + Dativ (با کسی)؛ sprechen über = دربارهٔ.'],['m','Wir sprechen ___ das Problem.',['über','mit','nach'],'sprechen über + Akkusativ (دربارهٔ موضوع).'],['m','Er träumt ___ einer Reise.',['von','an','auf'],'träumen von + Dativ.'],['m','Ich kümmere mich ___ meine Oma.',['um','für','auf'],'sich kümmern um + Akkusativ.'],['m','Ich bitte dich ___ Hilfe.',['um','für','nach'],'bitten um + Akkusativ.'],['m','___ hast du Angst?',['Wovor','Woran','Worauf'],'Angst haben vor → wovor؟'],['m','___ denkst du? – An meine Familie.',['Woran','Worauf','Wofür'],'denken an → woran؟'],['m','___ sprichst du? – Mit meinem Bruder.',['Mit wem','Womit','Mit wen'],'برای شخص: حرف اضافه + wem (Dativ).'],['m','Interessierst du dich für Politik? – Ja, ich interessiere mich ___.',['dafür','darauf','dazu'],'für → dafür.'],['m','Ärgerst du dich über den Verkehr? – Ja, ich ärgere mich ___.',['darüber','davon','damit'],'über → darüber.'],['m','Wartest du auf deine Freundin? – Ja, ich warte auf ___.',['sie','darauf','dafür'],'برای شخص ضمیر به کار می‌رود نه da-ترکیب: auf sie.'],['m','Ich warte ___, dass er anruft.',['darauf','dafür','davon'],'warten auf → darauf + dass.'],['m','Welcher Satz ist richtig?',['Ich freue mich auf das Wochenende.','Ich freue mich für das Wochenende.','Ich freue mich an das Wochenende.'],'sich freuen auf + Akkusativ.'],['m','Er hat sich in sie ___.',['verliebt','verlieben','verliebte'],'Perfekt: sich verlieben in → hat sich ... verliebt.'],['m','Ich bewerbe mich ___ eine Stelle als Verkäufer.',['um','auf','nach'],'sich bewerben um + Akkusativ.'],['m','Wie sagt man «مصاحبهٔ شغلی»?',['das Vorstellungsgespräch','der Lebenslauf','das Gehalt'],'das Vorstellungsgespräch = مصاحبهٔ شغلی؛ der Lebenslauf = رزومه؛ das Gehalt = حقوق.'],
['o','Ich warte auf den Bus','منتظر اتوبوس هستم','warten auf + Akkusativ: den Bus.'],['o','Er interessiert sich für Musik','او به موسیقی علاقه دارد','sich interessieren für؛ sich بعد از فاعل.'],['o','Wir freuen uns auf den Urlaub','برای تعطیلات ذوق داریم','sich freuen auf + Akkusativ؛ uns برای wir.'],['o','Worauf wartest du','منتظر چه هستی؟','wo + r + auf = worauf؛ فعل بعد از آن.'],['o','Sie träumt von einer Reise','او رؤیای سفر دارد','träumen von + Dativ: einer Reise.'],['o','Ich telefoniere oft mit meiner Mutter','اغلب با مادرم تلفنی صحبت می‌کنم','telefonieren mit + Dativ: meiner Mutter.'],['o','Mit wem sprichst du','با چه کسی صحبت می‌کنی؟','برای شخص: Mit wem + فعل + فاعل.'],['o','Ich ärgere mich über den Lärm','از سروصدا عصبانی‌ام','sich ärgern über + Akkusativ.'],['o','Ich freue mich darauf dich zu sehen','منتظرم ببینمت','darauf + Infinitiv mit zu.'],['o','Wir sprechen über das Thema','دربارهٔ موضوع صحبت می‌کنیم','sprechen über + Akkusativ.'],['o','Ich bewerbe mich um eine Stelle','برای یک شغل درخواست می‌دهم','sich bewerben um + Akkusativ.'],['o','Er hat Angst vor dem Test','او از آزمون می‌ترسد','Angst haben vor + Dativ: dem Test.']);
D[9][4]=[{t:'E-Mail über Interessen und Zukunftspläne (ایمیل)',n:70,p:'برای یک دوست ایمیل بنویس: به چه چیزی علاقه داری؟ از چه چیزی عصبانی می‌شی؟ برای چه چیزی ذوق داری؟ منتظر چه هستی؟ از چه رؤیا داری؟ حداقل ۵ فعل با حرف اضافهٔ ثابت، یک darauf یا darüber و یک سؤال با Worauf/Wofür. حداقل ۷۰ کلمه.',ph:'Liebe Anna, vielen Dank für deine Nachricht!<br>Ich interessiere mich besonders für ...<br>Ich träume davon, ... zu ... · Ich freue mich schon darauf.<br>Ich warte auf ... · Ich ärgere mich manchmal über ...<br>Und du? Worauf freust du dich? · Wofür interessierst du dich?<br>Schreib mir bald! · Liebe Grüße',m:'Liebe Anna,<br>vielen Dank für deine Nachricht! Du fragst, wofür ich mich interessiere. Ich interessiere mich besonders für Sport und Computer. Ich träume davon, in Deutschland zu arbeiten, und ich freue mich schon sehr darauf. Ich warte auf einen Platz in einem Sprachkurs, denn ich möchte meine Prüfung bestehen. Mein Bruder hat sich über meine Pläne gefreut. Ich ärgere mich nur manchmal über die schwere Grammatik. Und du? Worauf freust du dich im Sommer? Schreib mir bald!<br>Liebe Grüße<br>Mehdi',c:['هر فعل با حرف اضافهٔ درست و حالت درست نوشته شده (Akk / Dat)','برای چیز از darauf / darüber / dafür استفاده کرده‌ام و برای شخص از ضمیر','یک سؤال با Wor- / Wo- پرسیده‌ام','فعل انعکاسی‌ها (sich freuen, sich ärgern) ضمیر درست دارند','شروع و پایان ایمیل دوستانه است']},{t:'Meine Interessen (علایق من)',n:50,p:'۵ جمله بنویس و در هر کدام یک فعل با حرف اضافهٔ متفاوت بیاور (مثلاً sich interessieren für, träumen von, sich kümmern um, Angst haben vor, sich vorbereiten auf). حداقل ۵۰ کلمه.',ph:'Ich interessiere mich für ... · Ich spreche oft mit ... über ...<br>Am Wochenende kümmere ich mich um ...<br>Ich träume von ... · Ich warte auf ...<br>Ich habe Angst vor ..., aber ich bereite mich darauf vor.',m:'Ich interessiere mich für Sport und Marketing. Ich spreche oft mit Freunden über neue Ideen. Am Wochenende kümmere ich mich um meine Familie. Ich träume von einer Ausbildung in Deutschland. Ich warte auf Antworten von Firmen. Ich habe ein bisschen Angst vor der Prüfung, aber ich bereite mich gut darauf vor.',c:['۵ فعل متفاوت با حرف اضافه به کار برده‌ام','بعد از mit/von/vor/nach/an(teilnehmen) آرتیکل در Dativ است','بعد از auf/über/für/um/an(denken) آرتیکل در Akkusativ است']}];
D[10][3]=`<h3>۱) حروف اضافهٔ مکان و جهت (مرور)</h3><table><tr><th>Wo؟ (Dativ)</th><th>Wohin؟ (Akkusativ)</th></tr><tr><td>in der Stadt · im Hotel</td><td>in die Stadt · ins Hotel</td></tr><tr><td>am Strand · am Meer</td><td>an den Strand · ans Meer</td></tr><tr><td>auf dem Berg</td><td>auf den Berg</td></tr><tr><td>über der Brücke</td><td>über die Brücke</td></tr></table><p><b>کشور و شهر:</b> <b>nach</b> + شهر/کشور بدون آرتیکل (nach Berlin, nach Italien, nach Hause) · <b>in</b> + کشور با آرتیکل (in die Türkei / in der Türkei, in die Schweiz, in den Iran / im Iran) · <b>zu</b> + شخص و مکان (zu meinem Freund, zum Bahnhof) · <b>zu Fuß</b> = پیاده.</p><p><b>وسیله (mit + Dativ):</b> mit dem Zug · mit dem Bus · mit dem Auto · mit dem Flugzeug · mit dem Fahrrad · mit dem Schiff · mit der U-Bahn · mit der Straßenbahn</p><h3>۲) حروف اضافهٔ زمانی</h3><table><tr><th>حرف</th><th>کاربرد</th><th>مثال</th></tr><tr><td><b>um</b></td><td>ساعت</td><td>um 8 Uhr</td></tr><tr><td><b>am</b></td><td>روز، تاریخ، قسمت‌های روز</td><td>am Montag, am 5. Mai, am Abend</td></tr><tr><td><b>im</b></td><td>ماه، فصل</td><td>im Juli, im Sommer</td></tr><tr><td><b>in</b> + Dat</td><td>بعد از مدتی (آینده)</td><td>in zwei Wochen</td></tr><tr><td><b>vor</b> + Dat</td><td>پیش (گذشته)</td><td>vor zwei Wochen</td></tr><tr><td><b>seit</b> + Dat</td><td>از مدتی پیش تا الان</td><td>seit einem Jahr</td></tr><tr><td><b>für</b> + Akk</td><td>مدت (برنامه‌ریزی)</td><td>für zwei Wochen</td></tr><tr><td><b>von ... bis</b></td><td>از ... تا</td><td>von Montag bis Freitag</td></tr><tr><td><b>ab / bis / nach</b></td><td>از (آینده) / تا / بعد از</td><td>ab Montag, bis Freitag, nach dem Essen</td></tr></table><h3>۳) obwohl – trotzdem – wenn</h3><table><tr><th>کلمه</th><th>معنی</th><th>جایگاه فعل</th></tr><tr><td><b>obwohl</b></td><td>با اینکه (Nebensatz)</td><td>آخر جمله</td></tr><tr><td><b>trotzdem</b></td><td>با این حال (قید)</td><td>بلافاصله بعد از آن</td></tr><tr><td><b>deshalb / deswegen</b></td><td>به همین دلیل (قید)</td><td>بلافاصله بعد از آن</td></tr><tr><td><b>wenn</b></td><td>اگر / وقتی که (Nebensatz)</td><td>آخر جمله</td></tr></table><div class=e>Es regnet. <b>Trotzdem</b> gehen wir spazieren.<br><b>Obwohl</b> es regnet, gehen wir spazieren. = Wir gehen spazieren, <b>obwohl</b> es regnet.<br>Es regnet. <b>Deshalb</b> bleiben wir zu Hause.<br><b>Wenn</b> das Wetter schön ist, fahren wir ans Meer.</div><p><b>تضاد با انتظار:</b> obwohl / trotzdem · <b>دلیل و نتیجه:</b> weil / denn / deshalb.</p><h3>۴) پیشنهاد دادن</h3><div class=e>Wie wäre es mit einer Reise nach Italien?<br>Hast du Lust, ans Meer zu fahren?<br>Wollen wir am Wochenende wandern gehen?<br>Ich schlage vor, dass wir mit dem Zug fahren.<br>– Gute Idee! / Einverstanden! / Ich weiß nicht, ich habe leider keine Zeit.</div><h3>۵) لغات</h3><p><b>سفر:</b> der Urlaub · die Unterkunft · das Hotel · die Ferienwohnung · die Jugendherberge · der Campingplatz · buchen · reservieren · der Koffer · der Reisepass · die Fahrkarte · der Fahrplan · der Flughafen · das Gleis</p><p><b>حمل‌ونقل:</b> der Zug · der Bus · die U-Bahn · die Straßenbahn · die Haltestelle · abfahren · ankommen · umsteigen · die Verspätung · der Flug · dauern</p><p><b>محیط زیست:</b> die Umwelt · der Klimaschutz · der Klimawandel · die Luft · der Müll · Müll trennen · recyceln · Energie sparen · das Plastik · umweltfreundlich · umweltschädlich · die Abgase · erneuerbare Energie</p><p><b>طبیعت و هوا:</b> das Wetter · die Sonne · der Regen · der Schnee · der Wind · das Gewitter · heiß · kalt · warm · kühl · windig · regnen · schneien · die Temperatur · der Berg · der See · der Wald</p><h3>۶) گفتگوی نمونه</h3><div class=e>– Wie wäre es mit einem Wochenende am Meer?<br>– Gute Idee! Wie kommen wir dahin?<br>– Mit dem Zug. Das ist umweltfreundlicher als mit dem Auto.<br>– Einverstanden. Und wo schlafen wir?<br>– In einer kleinen Ferienwohnung. Obwohl sie nicht billig ist, ist sie direkt am Strand.</div>`;

D[10][4]=[{t:'Reise planen und E-Mail schreiben (برنامه‌ریزی سفر + ایمیل)',n:80,p:'یک سفر را برنامه‌ریزی کن و برای دوستت ایمیل بنویس: مقصد، زمان و مدت، وسیله، محل اقامت، برنامه‌ها و دعوت به همراهی. حداقل یک obwohl، یک wenn، یک trotzdem یا deshalb و یک پیشنهاد (Wie wäre es ...). حداقل ۸۰ کلمه.',ph:'Liebe Anna, ich plane im ... eine Reise nach ...<br>Wie wäre es mit ... Tagen in ...? · Wir fahren mit dem Zug / fliegen nach ...<br>Wir schlafen in einem Hotel / einer Jugendherberge.<br>Wenn das Wetter schön ist, ... · Obwohl es ... ist, ... · Deshalb ... · Trotzdem ...<br>Hast du Lust mitzukommen? · Schreib mir bald!',m:'Liebe Anna,<br>ich plane im August eine Reise nach Italien und möchte dich einladen. Wie wäre es mit zehn Tagen in Rom und am Meer? Wir fahren mit dem Zug, weil das umweltfreundlicher ist als das Auto. In Rom schlafen wir in einer kleinen Jugendherberge, denn Hotels sind teuer. Wenn das Wetter schön ist, gehen wir jeden Tag an den Strand. Obwohl es im August sehr heiß ist, möchte ich unbedingt die Altstadt besichtigen. Hast du Lust mitzukommen? Schreib mir bald!<br>Liebe Grüße<br>Mehdi',c:['از nach (کشور/شهر)، mit dem (وسیله) و in/an (Wo؟ یا Wohin؟) درست استفاده کرده‌ام','obwohl و wenn فعل را آخر جمله می‌برند، trotzdem/deshalb فعل را بلافاصله بعد از خود','یک پیشنهاد (Wie wäre es / Hast du Lust ... zu) دارم','زمان و مدت با im / für / in / von ... bis درست نوشته شده','ایمیل با Liebe + اسم شروع و با Liebe Grüße تمام شده']},{t:'Umweltprobleme (مشکلات محیط زیست)',n:60,p:'دربارهٔ یک مشکل محیط زیستی (هوا، زباله، پلاستیک، ترافیک) نوشته و بگو چه کاری می‌شود کرد. حداقل weil، obwohl، deshalb و یک جمله با sollte/muss. حداقل ۶۰ کلمه.',ph:'Es gibt viele Umweltprobleme: ... · Die Luft ist schlecht, weil ...<br>Viele Menschen ..., obwohl man ... kann.<br>Deshalb sollte jeder ... · Müll trennen · Energie sparen · recyceln<br>Ich fahre mit dem Bus, denn das ist besser für das Klima.<br>Meiner Meinung nach ist es wichtig, dass ...',m:'Es gibt viele Umweltprobleme: Die Luft in großen Städten ist schlecht, weil es zu viele Autos gibt. Viele Menschen werfen Plastik weg, obwohl man es recyceln kann. Deshalb sollte jeder Müll trennen und Energie sparen. Ich fahre oft mit dem Bus und nicht mit dem Auto, denn das ist besser für das Klima. Meiner Meinung nach ist es wichtig, dass wir alle etwas tun.',c:['weil und obwohl: فعل آخر جمله است','deshalb: فعل بلافاصله بعد از آن می‌آید','لغات محیط زیست (Müll, Plastik, Energie, Klima) به کار برده‌ام','بعد از مُدال/sollte مصدر آخر جمله است']}];
D[10][3]=`<h3>۱) مکان و جهت: مرور حروف اضافه</h3><p><b>Wechselpräpositionen</b> (an, auf, hinter, in, neben, über, unter, vor, zwischen): <b>Wo؟ → Dativ</b> · <b>Wohin؟ → Akkusativ</b>.</p><table><tr><th>Wo؟ (مکان)</th><th>Wohin؟ (جهت)</th><th>Woher؟ (مبدأ)</th></tr><tr><td>in Berlin / in Deutschland</td><td><b>nach</b> Berlin / <b>nach</b> Deutschland</td><td>aus Berlin / aus Deutschland</td></tr><tr><td>in <b>der</b> Schweiz / in <b>der</b> Türkei</td><td>in <b>die</b> Schweiz / in <b>die</b> Türkei</td><td>aus <b>der</b> Schweiz / aus <b>der</b> Türkei</td></tr><tr><td>im Iran (in dem)</td><td>in <b>den</b> Iran</td><td>aus <b>dem</b> Iran</td></tr><tr><td><b>am</b> Meer / <b>am</b> See</td><td><b>ans</b> Meer / <b>an den</b> See</td><td>vom Meer</td></tr><tr><td><b>in den</b> Bergen</td><td><b>in die</b> Berge</td><td>aus den Bergen</td></tr><tr><td><b>auf dem</b> Land / auf der Insel</td><td><b>aufs</b> Land / auf die Insel</td><td>vom Land</td></tr><tr><td>bei Oma / beim Arzt</td><td><b>zu</b> Oma / <b>zum</b> Arzt / <b>zur</b> Schule</td><td>von Oma / vom Arzt</td></tr></table><p>کشور و شهر بدون آرتیکل → <b>nach</b>. کشورهایی با آرتیکل (der Iran, die Schweiz, die Türkei, die USA) → <b>in + Akk</b>. شخص → <b>zu</b>.</p><h3>۲) حروف اضافهٔ زمان</h3><table><tr><th>حرف</th><th>کاربرد</th><th>مثال</th></tr><tr><td><b>um</b></td><td>ساعت</td><td>um 8 Uhr</td></tr><tr><td><b>am</b></td><td>روز، بخش روز</td><td>am Montag, am Abend</td></tr><tr><td><b>im</b></td><td>ماه، فصل</td><td>im Juli, im Sommer</td></tr><tr><td><b>in</b> + Dat</td><td>آینده (بعد از مدت)</td><td>in zwei Wochen</td></tr><tr><td><b>vor</b> + Dat</td><td>گذشته (پیش)</td><td>vor einem Jahr</td></tr><tr><td><b>seit</b> + Dat</td><td>از مدتی پیش تا الان</td><td>seit drei Monaten</td></tr><tr><td><b>von ... bis</b></td><td>از ... تا</td><td>von Montag bis Freitag</td></tr><tr><td><b>ab</b> + Dat</td><td>از (شروع در آینده)</td><td>ab nächster Woche</td></tr><tr><td><b>für</b> + Akk / ... <b>lang</b></td><td>مدت</td><td>für eine Woche · eine Woche lang</td></tr></table><h3>۳) obwohl · trotzdem · wenn · deshalb/deswegen</h3><table><tr><th>معنی</th><th>Nebensatz (فعل آخر)</th><th>قید (فعل بلافاصله بعد)</th></tr><tr><td>به خاطر (دلیل)</td><td><b>weil</b></td><td><b>deshalb / deswegen</b></td></tr><tr><td>با اینکه / با این حال (تضاد)</td><td><b>obwohl</b></td><td><b>trotzdem</b></td></tr></table><div class=e>Es regnet. <b>Deshalb</b> bleiben wir zu Hause. · Wir bleiben zu Hause, <b>weil</b> es regnet.<br><b>Obwohl</b> es regnet, gehen wir spazieren. (obwohl-Satz اول → gehen wir)<br>Es regnet. <b>Trotzdem</b> gehen wir spazieren.<br><b>Wenn</b> das Wetter schön ist, fahren wir ans Meer. (اگر / هروقت که)</div><h3>۴) پیشنهاد دادن</h3><div class=e>Wie wäre es mit einem Ausflug ans Meer?<br>Wir könnten mit dem Zug fahren.<br>Lass uns am Wochenende ins Grüne fahren!<br>Ich schlage vor, dass wir ein Hotel buchen.<br>Sollen wir ein Doppelzimmer nehmen? – Ja, gute Idee! / Nein, das ist zu teuer.</div><h3>۵) لغات</h3><p><b>حمل‌ونقل:</b> das Auto · der Bus · die Straßenbahn · die U-Bahn · die S-Bahn · der Zug · das Flugzeug · das Fahrrad · zu Fuß · die Fahrkarte · die Haltestelle · das Gleis · die Verspätung · umsteigen · abfahren · ankommen · einsteigen · aussteigen · der Fahrplan</p><p><b>سفر و اقامت:</b> das Hotel · die Jugendherberge · die Ferienwohnung · das Doppelzimmer · das Einzelzimmer · die Übernachtung · reservieren / buchen · der Koffer · packen · die Sehenswürdigkeit · besichtigen</p><p><b>محیط زیست:</b> die Umwelt · der Klimaschutz · der Müll · Müll trennen · recyceln · das Plastik · Energie / Wasser sparen · der Strom · die Luftverschmutzung · umweltfreundlich · nachhaltig</p><p><b>طبیعت و آب‌وهوا:</b> das Wetter · die Sonne · es regnet / schneit · der Wind · das Gewitter · bewölkt · sonnig · die Temperatur · Grad</p><h3>۶) گفتگوی نمونه</h3><div class=e>– Eine Fahrkarte nach Berlin, bitte.<br>– Einfach oder hin und zurück?<br>– Hin und zurück, bitte. Wann fährt der nächste Zug?<br>– Um 9:15 Uhr von Gleis 4. Sie müssen in Hannover umsteigen.</div>`;

D[10][4]=[{t:'Eine Reise planen (ایمیل برنامه‌ریزی سفر)',n:80,p:'برای یک دوست ایمیل بنویس و یک سفر را پیشنهاد بده: مقصد (با nach/in)، وسیلهٔ حمل‌ونقل، اقامت، زمان (با im/am/um)، یک جمله با obwohl و یک جمله با wenn و چند پیشنهاد (Wie wäre es mit ...?). حداقل ۸۰ کلمه.',ph:'Lieber Tom, ich möchte im Sommer mit dir nach ... fahren.<br>Wir könnten mit dem Zug / Bus / Flugzeug ...<br>Wir sollten ein Doppelzimmer in einem kleinen Hotel buchen.<br>Obwohl ..., ... · Wenn das Wetter schön ist, ...<br>Wie wäre es mit dem ersten Juli?<br>Schreib mir bitte, ob du Zeit hast!',m:'Lieber Tom,<br>ich möchte im Sommer mit dir nach Italien fahren. Wir könnten mit dem Zug nach Rom fahren, obwohl der Flug schneller ist, denn der Zug ist umweltfreundlicher. In Rom sollten wir ein Doppelzimmer in einem kleinen Hotel buchen. Wir bleiben fünf Tage und besichtigen die Altstadt. Wenn das Wetter schön ist, fahren wir ans Meer. Wie wäre es mit dem ersten Juli? Schreib mir bitte, ob du Zeit hast!<br>Viele Grüße<br>Mehdi',c:['Ziel mit nach / in + Akk, und Ort mit in + Dativ richtig gesetzt (مقصد و مکان درست)','زمان‌ها با im / am / um نوشته شده‌اند','یک obwohl-Satz و یک wenn-Satz دارم (فعل آخر)','حداقل یک پیشنهاد (Wie wäre es mit ...? / Wir könnten ...)','ایمیل با Lieber/Liebe شروع و با Grüße تمام شده']},{t:'Umweltschutz (حفاظت از محیط زیست)',n:50,p:'بنویس چه کاری برای محیط زیست می‌کنی و چه مشکلی می‌بینی. از obwohl، trotzdem یا deshalb استفاده کن. حداقل ۵۰ کلمه.',ph:'Ich finde, dass Umweltschutz wichtig ist.<br>Ich trenne den Müll und spare Wasser und Strom.<br>Obwohl ich ein Auto habe, ... · ..., deshalb ... · ..., trotzdem ...<br>Ich ärgere mich über den vielen Müll auf den Straßen.',m:'Ich finde, dass Umweltschutz sehr wichtig ist. Ich trenne den Müll und spare Wasser und Strom. Obwohl ich ein Auto habe, fahre ich oft mit dem Fahrrad. Plastik benutze ich nur selten. Ich ärgere mich über den vielen Müll auf den Straßen. Deshalb möchte ich andere Leute informieren.',c:['حداقل یک obwohl-Satz با فعل آخر','deshalb / trotzdem را در جایگاه ۱ نوشته‌ام و فعل بلافاصله بعد از آن است','حداقل ۳ لغت محیط زیستی به کار برده‌ام']}];
D[11][3]=`<h3>۱) Konjunktiv II – چه موقعی؟</h3><p>برای <b>درخواست مؤدبانه، پیشنهاد، توصیه، آرزو و شرط غیرواقعی</b>. ۲ راه ساختن: با <b>würde + مصدر</b> (برای اکثر افعال) یا شکل خاص (برای sein, haben و مُدال‌ها).</p><table><tr><th></th><th>würden</th><th>sein</th><th>haben</th><th>können</th><th>müssen</th><th>dürfen</th><th>sollen</th></tr><tr><td>ich</td><td>würde</td><td>wäre</td><td>hätte</td><td>könnte</td><td>müsste</td><td>dürfte</td><td>sollte</td></tr><tr><td>du</td><td>würdest</td><td>wärst</td><td>hättest</td><td>könntest</td><td>müsstest</td><td>dürftest</td><td>solltest</td></tr><tr><td>er/sie/es</td><td>würde</td><td>wäre</td><td>hätte</td><td>könnte</td><td>müsste</td><td>dürfte</td><td>sollte</td></tr><tr><td>wir / sie / Sie</td><td>würden</td><td>wären</td><td>hätten</td><td>könnten</td><td>müssten</td><td>dürften</td><td>sollten</td></tr><tr><td>ihr</td><td>würdet</td><td>wärt</td><td>hättet</td><td>könntet</td><td>müsstet</td><td>dürftet</td><td>solltet</td></tr></table><p>توجه: «می‌خواهم» با <b>möchte</b> (ich möchte, du möchtest, wir möchten). شکل sollte/wollte مثل Präteritum است و معنی از متن معلوم می‌شود.</p><h3>۲) درخواست مؤدبانه</h3><table><tr><th>مستقیم</th><th>مؤدبانه (Konjunktiv II)</th></tr><tr><td>Hilf mir! / Sie müssen mir helfen.</td><td><b>Könnten</b> Sie mir bitte helfen?</td></tr><tr><td>Schließen Sie das Fenster!</td><td><b>Würden</b> Sie bitte das Fenster schließen?</td></tr><tr><td>Ich will einen Kaffee.</td><td>Ich <b>hätte</b> gern einen Kaffee. / Ich <b>möchte</b> ...</td></tr><tr><td>Darf ich Sie fragen?</td><td><b>Dürfte</b> ich Sie etwas fragen?</td></tr><tr><td>Haben Sie Zeit?</td><td><b>Hätten</b> Sie einen Moment Zeit?</td></tr></table><p>پاسخ: Natürlich, gern. · Ja, kein Problem. · Tut mir leid, das geht leider nicht.</p><h3>۳) توصیه و پیشنهاد</h3><div class=e>Du <b>solltest</b> zum Arzt gehen. · Du <b>müsstest</b> mehr schlafen.<br>An deiner Stelle <b>würde</b> ich das Auto verkaufen.<br>Wir <b>könnten</b> morgen ins Kino gehen. · Wie <b>wäre</b> es mit einer Pause?<br>Wenn ich du <b>wäre</b>, <b>würde</b> ich den Vermieter anrufen.</div><h3>۴) آرزو و شرط غیرواقعی</h3><p>ساختار: <b>Wenn + Konjunktiv II (فعل آخر), würde + مصدر (آخر)</b>. معنی: کاری که واقعی نیست.</p><div class=e>Wenn ich Zeit <b>hätte</b>, <b>würde</b> ich kommen. (ولی وقت ندارم)<br>Wenn ich reich <b>wäre</b>, <b>würde</b> ich um die Welt reisen.<br>Wenn das Wetter schön <b>wäre</b>, <b>könnten</b> wir ans Meer fahren.<br>Ich <b>wäre</b> gern in Deutschland. · Ich <b>würde</b> gern dort arbeiten.</div><h3>۵) موقعیت‌های روزمره و شکایت</h3><div class=e>Ich möchte mich beschweren. · Leider <b>funktioniert</b> das Gerät nicht. · Das Handy ist <b>kaputt</b>.<br>Ich bin mit dem Service nicht <b>zufrieden</b>. · Ich hätte gern mein Geld <b>zurück</b>.<br>Könnten Sie das bitte <b>reparieren / austauschen</b>?<br>Ich möchte das Hemd <b>umtauschen</b>. Hier ist der <b>Kassenbon</b>.<br>Wir könnten uns auf einen <b>Kompromiss</b> einigen. · Ich schlage <b>vor</b>, dass ...</div><p><b>ایمیل رسمی:</b> Sehr geehrte Damen und Herren, ... → Ich bitte Sie um eine schnelle Antwort. → Mit freundlichen Grüßen</p><h3>۶) لغات</h3><p><b>خدمات:</b> der Friseur · die Reinigung · die Werkstatt · die Reparatur · die Post · das Paket · die Bank · das Konto</p><p><b>خرید و شکایت:</b> reklamieren · umtauschen · zurückgeben · der Kassenbon · die Garantie · kaputt · defekt · beschädigt · funktionieren · zufrieden / unzufrieden</p><p><b>خانه و اجاره:</b> die Miete · die Nebenkosten · die Kaution · der Vermieter · der Mieter · besichtigen · möbliert · die Heizung · der Wasserschaden · die Nachbarn · laut / leise</p><p><b>مشکل و راه‌حل:</b> das Problem · die Lösung · vorschlagen · einverstanden · der Kompromiss · sich einigen auf · um Hilfe bitten</p>`;

r geehrte Damen und Herren شروع می‌شود.'],['m','Ich schlage ___, dass wir uns morgen treffen.',['vor','an','zu'],'vorschlagen جداشدنی است: Ich schlage ... vor.'],['m','Wir können uns auf einen ___ einigen.',['Kompromiss','Vorschlag','Termin'],'der Kompromiss = مصالحه؛ sich einigen auf = به توافق رسیدن.'],
['o','Könnten Sie mir bitte helfen','لطفاً می‌توانید به من کمک کنید؟','سؤال مؤدبانه: Könnten اول؛ helfen مصدر آخر.'],['o','Ich hätte gern einen Tee','یک چای می‌خواهم (مؤدبانه)','Ich hätte gern + Akkusativ = سفارش مؤدبانه.'],['o','Wenn ich Zeit hätte würde ich kommen','اگر وقت داشتم می‌آمدم','wenn + hätte (آخر Nebensatz)؛ بعد würde + مصدر آخر.'],['o','Wenn ich du wäre würde ich mehr schlafen','اگر جای تو بودم بیشتر می‌خوابیدم','wenn ich du wäre = توصیه؛ würde ich ... schlafen.'],['o','Das Handy funktioniert leider nicht','متأسفانه گوشی کار نمی‌کند','funktionieren: er → funktioniert؛ leider قبل از nicht.'],['o','Ich möchte das Hemd umtauschen','می‌خواهم این پیراهن را عوض کنم','möchte جایگاه دوم؛ umtauschen مصدر کامل آخر.'],['o','Ich bin mit dem Service nicht zufrieden','از سرویس راضی نیستم','sein + nicht + zufrieden؛ mit + Dativ.'],['o','Wir könnten uns auf einen Kompromiss einigen','می‌توانیم روی یک مصالحه به توافق برسیم','könnten جایگاه دوم؛ sich einigen auf + Akk.'],['o','Du solltest den Vermieter anrufen','باید با صاحب‌خانه تماس بگیری','solltest = توصیه؛ anrufen مصدر آخر.'],['o','Ich würde gern die Wohnung besichtigen','دوست دارم آپارتمان را ببینم','würde gern + مصدر آخر؛ besichtigen بدون ge.'],['o','Wie wäre es mit einem Treffen am Montag','یک جلسه دوشنبه چطور است؟','Wie wäre es mit + Dativ = پیشنهاد.'],['o','Dürfte ich Sie kurz stören','اجازه هست لحظه‌ای مزاحمتان شوم؟','dürfte = بسیار مؤدبانه.']);
D[11][4]=[{t:'Beschwerde-E-Mail (ایمیل شکایت)',n:70,p:'یک ایمیل رسمی شکایت بنویس: چیزی خریده‌ای که کار نمی‌کند، کی خریده‌ای (Perfekt)، مشکل چیست، چه چیزی می‌خواهی (با Könnten Sie ...? یا Ich hätte gern ...) و چه موقعی پاسخ می‌خواهی. حداقل ۷۰ کلمه.',ph:'Sehr geehrte Damen und Herren,<br>am ... habe ich bei Ihnen ... gekauft.<br>Leider funktioniert das Gerät nicht. · Ich bin mit dem Produkt nicht zufrieden.<br>Könnten Sie mir bitte ein neues Gerät schicken? · Ich hätte gern mein Geld zurück.<br>Den Kassenbon schicke ich im Anhang.<br>Ich bitte Sie um eine schnelle Antwort. · Mit freundlichen Grüßen',m:'Sehr geehrte Damen und Herren,<br>am 5. Mai habe ich bei Ihnen einen Fernseher gekauft. Leider funktioniert das Gerät nicht. Ich habe es schon dreimal neu gestartet, aber das Bild bleibt schwarz. Ich bin mit dem Produkt nicht zufrieden. Könnten Sie mir bitte ein neues Gerät schicken? Wenn das nicht möglich ist, hätte ich gern mein Geld zurück. Den Kassenbon schicke ich im Anhang. Ich bitte Sie um eine schnelle Antwort.<br>Mit freundlichen Grüßen<br>Mehdi',c:['ایمیل رسمی است: Sie، Sehr geehrte Damen und Herren، Mit freundlichen Grüßen','مشکل واضح شرح داده شده و خرید با Perfekt نوشته شده','درخواست را با Konjunktiv II مؤدبانه نوشته‌ام (Könnten Sie ...? / Ich hätte gern ...)','خواسته‌ام مشخص است (تعویض یا پول برگشتی)','درخواست پاسخ سریع دارم']},{t:'Um Hilfe bitten (درخواست کمک و راه‌حل)',n:50,p:'یک پیام مؤدبانه به یک همسایه یا صاحب‌خانه بنویس: مشکل (مثلاً سروصدا یا تعمیر) را توضیح بده، از او کمک بخواه و یک راه‌حل پیشنهاد بده. حداقل ۵۰ کلمه.',ph:'Liebe Frau Schmidt, ich habe ein Problem und hätte eine Bitte.<br>Seit ... ist es ... · Ich kann nicht schlafen / arbeiten.<br>Könnten Sie bitte ...? · Würden Sie ...?<br>Wir könnten uns auch ... · Wie wäre es, wenn ...?<br>Ich wäre Ihnen sehr dankbar.',m:'Liebe Frau Schmidt,<br>ich habe ein Problem und hätte eine Bitte. Seit zwei Wochen ist es abends sehr laut in der Wohnung über mir. Ich kann nicht schlafen und muss früh aufstehen. Könnten Sie bitte mit den Nachbarn sprechen? Wir könnten uns auch alle zusammen treffen. Ich wäre Ihnen sehr dankbar.<br>Mit freundlichen Grüßen<br>Mehdi',c:['۳ درخواست یا پیشنهاد با Konjunktiv II (könnten, würden, hätte, wäre) نوشته‌ام','مشکل و مدت آن (seit ...) مشخص است','یک راه‌حل پیشنهاد شده','تشکر و فرم مؤدبانه (Sie / Ihnen) رعایت شده']}];
D[12][3]=`<h3>۰) برنامهٔ پیشنهادی این روز</h3><p>۱ ساعت صحبت (ضبط صدا) · ۱.۵ ساعت نوشتن (۵ نوع متن زیر) · ۱ ساعت تحلیل خطا و گرامر · ۳۰ دقیقه تمرین‌های اپ · ۳۰ دقیقه تمرین خطاهایی که تکرار می‌کنی («مرور اشتباهات» در صفحهٔ اصلی).</p><h3>۱) صحبت (Sprechen) – قالب‌های آماده</h3><table><tr><th>موضوع</th><th>عبارت‌های کلیدی</th></tr><tr><td>معرفی و Lebenslauf</td><td>Ich möchte mich kurz vorstellen. · Ich bin 2004 in ... geboren. · Ich habe die Schule besucht und ... gemacht. · Seit ... Jahren arbeite ich als ...</td></tr><tr><td>وقت آزاد و کار</td><td>In meiner Freizeit ... ich gern ... · Mein Beruf macht mir Spaß, weil ... · Ich arbeite von ... bis ...</td></tr><tr><td>تعریف تجربه</td><td>Zuerst ..., dann ..., danach ..., am Ende ... · Das war ein tolles Erlebnis, weil ...</td></tr><tr><td>مزایا و معایب</td><td>Ein Vorteil ist, dass ... · Ein Nachteil ist ... · Einerseits ..., andererseits ...</td></tr><tr><td>نظر و دلیل</td><td>Meiner Meinung nach ... · Ich finde / glaube, dass ... · Ich bin dafür / dagegen, weil ...</td></tr><tr><td>برنامه‌ریزی مشترک</td><td>Wie wäre es mit ...? · Wir könnten ... · Das passt mir gut. · Einverstanden! · Lass uns ... machen.</td></tr></table><p><b>تمرین:</b> برای هر موضوع ۱ تا ۲ دقیقه صحبت کن (ضبط صدا)، گوش بده و چک کن: فعل جایگاه دوم؛ Nebensatz با فعل آخر؛ Perfekt درست؛ بدون مکث طولانی. می‌توانی متن تایپ‌شدهٔ صحبتت را همین‌جا برای من بفرستی تا تصحیح کنم.</p><h3>۲) Lebenslauf – لغات و جمله‌ها</h3><p>der Lebenslauf · geboren · die Schule besuchen · das Abitur · die Ausbildung · das Studium · die Berufserfahrung · die Sprachkenntnisse (Deutsch A2, Englisch B1) · die Hobbys · die Bewerbung · das Zeugnis</p><div class=e>Ich bin 2004 in Teheran <b>geboren</b>. · Ich habe 2022 mein Abitur <b>gemacht</b>.<br><b>Seit</b> 2023 <b>arbeite</b> ich als Schwimmtrainer. (seit + Präsens)<br>Ich spreche Deutsch (A2) und etwas Englisch.</div><h3>۳) نوشتن (Schreiben) – ۵ نوع متن</h3><table><tr><th>نوع</th><th>شروع</th><th>عبارت‌های محتوا</th><th>پایان</th></tr><tr><td>ایمیل دوستانه</td><td>Liebe Anna, / Lieber Tom,</td><td>Wie geht es dir? · Ich habe lange nichts gehört.</td><td>Viele / Liebe Grüße</td></tr><tr><td>درخواست رسمی</td><td>Sehr geehrte Damen und Herren,</td><td>Ich interessiere mich für ... · Könnten Sie mir bitte ... schicken? · Ich würde gern wissen, ob ...</td><td>Vielen Dank im Voraus. Mit freundlichen Grüßen</td></tr><tr><td>دعوت‌نامه</td><td>Liebe Anna,</td><td>Ich möchte dich einladen. · Wann? Wo? · Bring bitte ... mit! · Sag mir bitte bis ... Bescheid.</td><td>Liebe Grüße</td></tr><tr><td>عذرخواهی</td><td>Liebe Anna,</td><td>Es tut mir leid, dass ... · Ich hoffe, du bist nicht böse. · Wollen wir ... ?</td><td>Liebe Grüße</td></tr><tr><td>شکایت</td><td>Sehr geehrte Damen und Herren,</td><td>Leider ... · Ich bin nicht zufrieden. · Ich hätte gern mein Geld zurück.</td><td>Ich bitte um eine schnelle Antwort. Mit freundlichen Grüßen</td></tr></table><h3>۴) تحلیل خطا – ۱۱ خطای پرتکرار</h3><table><tr><th>❌ غلط</th><th>✅ درست</th><th>قانون</th></tr><tr><td>Heute ich gehe ins Kino.</td><td>Heute <b>gehe ich</b> ins Kino.</td><td>فعل جایگاه دوم</td></tr><tr><td>weil ich bin müde</td><td>weil ich müde <b>bin</b></td><td>Nebensatz → فعل آخر</td></tr><tr><td>Ich habe ein Frage.</td><td>Ich habe <b>eine</b> Frage.</td><td>جنس اسم (die Frage)</td></tr><tr><td>Ich gehe in dem Kino.</td><td>Ich gehe <b>ins</b> Kino.</td><td>Wohin؟ → Akkusativ</td></tr><tr><td>Ich habe nach Berlin gefahren.</td><td>Ich <b>bin</b> nach Berlin gefahren.</td><td>حرکت → sein</td></tr><tr><td>Ich habe nicht Zeit.</td><td>Ich habe <b>keine</b> Zeit.</td><td>اسم نکره → kein</td></tr><tr><td>ein große Haus</td><td>ein groß<b>es</b> Haus</td><td>پایانهٔ صفت</td></tr><tr><td>Ich warte für den Bus.</td><td>Ich warte <b>auf</b> den Bus.</td><td>فعل + حرف اضافه ثابت</td></tr><tr><td>ich habe einen hund</td><td><b>I</b>ch habe einen <b>H</b>und.</td><td>حروف بزرگ</td></tr><tr><td>Ich muss zu arbeiten.</td><td>Ich muss arbeiten.</td><td>مُدال بدون zu</td></tr><tr><td>Ich habe die Schule gebesucht.</td><td>Ich habe die Schule <b>besucht</b>.</td><td>پیشوند be- بدون ge</td></tr></table><h3>۵) نقاط ضعف شخصی – روش ۳ مرحله‌ای</h3><p>۱) از «مرور اشتباهات» ۵ نوع خطای تکراری را پیدا کن. ۲) برای هر کدام قانون را در یک خط بنویس. ۳) هر قانون را در ۳ جملهٔ جدید به کار ببر و برای من بفرست تا چک کنم.</p>`;
setE(12,['Sehr geehrte Frau ... = شروع ایمیل رسمی به یک خانم (مؤنث → ‑e).','پایان رسمی: Mit freundlichen Grüßen؛ Liebe Grüße غیررسمی است.','ایمیل صمیمی با Liebe/Lieber + نام شروع می‌شود (Anna مؤنث → Liebe).']);

['f','Heute ___ ich ins Kino.','gehe','gehen','Heute جایگاه ۱ → فعل جایگاه ۲: gehe ich.'],['f','Ich bleibe zu Hause, weil ich krank ___.','bin','sein','weil → فعل آخر: ich krank bin.'],['f','Ich habe ___ Frage.','eine','','Frage مؤنث → eine.'],['f','Ich bin nach Berlin ___.','gefahren','fahren','fahren (حرکت) → bin gefahren.'],['f','Ich habe ___ Zeit.','keine','','Zeit مؤنث و نکره → keine (نه nicht).'],['f','Ich warte ___ den Bus.','auf','','warten auf + Akkusativ.'],['f','Ich gehe ___ Kino.','ins','in + das','Wohin؟ → in das = ins.'],['f','Sehr ___ Damen und Herren,','geehrte','','Sehr geehrte Damen und Herren (جمع → ‑e).'],['f','Mit ___ Grüßen','freundlichen','','Mit freundlichen Grüßen = پایان رسمی.'],['f','Ich interessiere mich ___ den Kurs.','für','','sich interessieren für + Akkusativ.'],['f','Es tut mir ___, dass ich zu spät bin.','leid','','Es tut mir leid = متأسفم.'],['f','Ich möchte dich zum Essen ___.','einladen','','möchte + مصدر کامل: einladen (جداشدنی).'],['f','Bitte sag mir bis Freitag ___.','Bescheid','','Bescheid sagen = اطلاع دادن.'],['f','Ich ___ 2004 in Teheran geboren.','bin','sein','geboren sein: Ich bin ... geboren.'],['f','Ich habe die Schule ___.','besucht','besuchen','besuchen جدانشدنی → بدون ge: besucht.'],
['m','Welcher Satz ist richtig?',['Heute gehe ich ins Kino.','Heute ich gehe ins Kino.','Heute ins Kino gehe ich.'],'Heute جایگاه ۱ → فعل جایگاه ۲.'],['m','Welcher Satz ist richtig?',['Ich bleibe zu Hause, weil ich müde bin.','Ich bleibe zu Hause, weil ich bin müde.','Ich bleibe zu Hause, weil bin ich müde.'],'weil → فعل صرف‌شده آخر.'],['m','Welcher Satz ist richtig?',['Ich bin nach Berlin gefahren.','Ich habe nach Berlin gefahren.','Ich nach Berlin bin gefahren.'],'fahren (حرکت) → sein + gefahren؛ فعل کمکی جایگاه دوم.'],['m','Welcher Satz ist richtig?',['Ich habe keine Zeit.','Ich habe nicht Zeit.','Ich habe kein Zeit.'],'اسم نکره (Zeit مؤنث) → keine.'],['m','Welcher Satz ist richtig?',['Ich habe ein großes Haus.','Ich habe ein große Haus.','Ich habe einen großes Haus.'],'Haus خنثی + ein → ‑es.'],['m','Welcher Satz ist richtig?',['Ich warte auf den Bus.','Ich warte für den Bus.','Ich warte an dem Bus.'],'warten auf + Akkusativ.'],['m','Welcher Satz ist richtig?',['Ich habe einen Hund.','ich habe einen hund.','Ich habe einen hund.'],'ابتدای جمله و اسم‌ها با حرف بزرگ.'],['m','Welcher Satz ist richtig?',['Könnten Sie mir bitte helfen?','Können Sie mir helfen bitte?','Könnten Sie helfen mir bitte?'],'مؤدبانه: Könnten اول، مصدر helfen آخر؛ bitte قبل از آن.'],['m','Anrede in einer Mail an einen Freund: ___',['Lieber Tom,','Sehr geehrter Tom,','Hallo Herr Tom,'],'صمیمی: Lieber/Liebe + نام.'],['m','Ende einer formellen Anfrage: ___',['Mit freundlichen Grüßen','Liebe Grüße','Bis bald'],'رسمی: Mit freundlichen Grüßen.'],['m','Wie bittet man höflich um Informationen?',['Könnten Sie mir bitte Informationen schicken?','Schick mir Informationen!','Ich will Informationen.'],'مؤدبانه با Konjunktiv II.'],['m','Ich würde gern wissen, ___ der Kurs noch einen Platz hat.',['ob','dass','wenn'],'ob = آیا؛ Nebensatz.'],['m','Wie sagt man «متأسفم»?',['Es tut mir leid.','Es ist mir leid.','Ich tue leid.'],'عبارت ثابت: Es tut mir leid.'],['m','Ich möchte mich für meinen Fehler ___.',['entschuldigen','entschuldigt','entschuldigend'],'sich entschuldigen für + Akkusativ؛ بعد از möchte مصدر.'],['m','Wie beginnt man eine Meinung?',['Meiner Meinung nach','Mein Meinung nach','Meiner Meinung von'],'nach + Dativ: meiner Meinung nach.'],['m','Einerseits ist das Leben in der Stadt spannend, ___ ist es oft laut.',['andererseits','deshalb','weil'],'Einerseits ... andererseits = از یک طرف ... از طرف دیگر.'],['m','Zuerst bin ich aufgestanden, ___ habe ich gefrühstückt.',['dann','weil','ob'],'dann = سپس (ترتیب رویدادها).'],['m','Ich habe 2022 mein Abitur ___.',['gemacht','machen','gemachen'],'Perfekt: Abitur machen → gemacht.'],['m','Wie sagt man «رزومه»?',['der Lebenslauf','die Bewerbung','das Gehalt'],'der Lebenslauf = رزومه؛ die Bewerbung = درخواست کار.'],['m','Seit 2023 ___ ich als Trainer.',['arbeite','arbeitete','gearbeitet'],'seit + ادامه‌دار → Präsens: ich arbeite.'],
['o','Ich möchte mich kurz vorstellen','می‌خواهم خودم را کوتاه معرفی کنم','möchte جایگاه دوم؛ vorstellen مصدر آخر.'],['o','Ich bin 2004 in Teheran geboren','من در سال ۲۰۰۴ در تهران به دنیا آمده‌ام','geboren sein: bin ... geboren.'],['o','Seit drei Jahren arbeite ich als Schwimmtrainer','سه سال است که مربی شنا هستم','seit + Dativ: Seit drei Jahren اول → arbeite دوم.'],['o','Zuerst habe ich Deutsch gelernt und dann Arbeit gesucht','اول آلمانی یاد گرفتم و بعد دنبال کار گشتم','Zuerst جایگاه ۱ → habe دوم؛ Partizip II آخر؛ dann + Partizip.'],['o','Einerseits ist es teuer andererseits ist es bequem','از یک طرف گران است، از طرف دیگر راحت است','Einerseits ... andererseits ...: هر دو جمله فعل دوم.'],['o','Ich finde dass Sport sehr wichtig ist','فکر می‌کنم ورزش خیلی مهم است','dass → فعل ist آخر.'],['o','Wir könnten am Samstag ins Kino gehen','می‌توانیم شنبه سینما برویم','könnten جایگاه دوم؛ gehen آخر.'],['o','Das passt mir gut','این برایم مناسب است','passen + Dativ: mir.'],['o','Es tut mir leid dass ich nicht kommen kann','متأسفم که نمی‌توانم بیایم','dass + ... kann آخر.'],['o','Ich würde gern wissen ob der Kurs noch frei ist','دوست دارم بدانم آیا دوره هنوز جا دارد','ob → فعل ist آخر.'],['o','Bringen Sie bitte Ihren Lebenslauf mit','لطفاً رزومهٔ خود را همراه بیاورید','Imperativ Sie؛ mitbringen جداشدنی: Bringen ... mit.'],['o','Vielen Dank für Ihre schnelle Antwort','از پاسخ سریع شما متشکرم','Dank für + Akkusativ؛ Ihre = ملکی رسمی.']);
D[12][4]=[{t:'Persönliche E-Mail (ایمیل دوستانه)',n:45,p:'به یک دوست که مدتی است ندیده‌ای ایمیل بنویس: احوال‌پرسی، یک تجربهٔ اخیر (Perfekt) و یک پیشنهاد برای دیدار. حداقل ۴۵ کلمه.',ph:'Lieber Tom, / Liebe Anna,<br>wie geht es dir? · Ich habe lange nichts von dir gehört.<br>Letztes Wochenende bin ich ... gefahren und habe ... gemacht.<br>Hast du im Sommer Zeit? · Wir könnten uns treffen.<br>Viele Grüße',m:'Lieber Tom,<br>wie geht es dir? Ich habe lange nichts von dir gehört. Letztes Wochenende bin ich mit Freunden in die Berge gefahren. Das Wetter war toll und wir haben viel gewandert. Hast du im Sommer Zeit? Dann könnten wir uns treffen.<br>Viele Grüße<br>Mehdi',c:['Anrede und Gruß sind informell (Lieber ... / Viele Grüße)','Perfekt mit richtigem Hilfsverb (bin gefahren / haben gewandert)','ein Vorschlag mit könnten','Verb auf Position 2 in jedem Hauptsatz']},{t:'Formelle Anfrage (درخواست رسمی)',n:45,p:'به یک موسسه (مثلاً کلاس زبان) ایمیل رسمی بنویس و دربارهٔ هزینه و زمان و جای خالی بپرس. حداقل ۴۵ کلمه.',ph:'Sehr geehrte Damen und Herren,<br>ich interessiere mich für Ihren Deutschkurs ...<br>Könnten Sie mir bitte Informationen zu ... schicken?<br>Ich würde auch gern wissen, ob es noch freie Plätze gibt.<br>Vielen Dank im Voraus. · Mit freundlichen Grüßen',m:'Sehr geehrte Damen und Herren,<br>ich interessiere mich für Ihren Deutschkurs im Januar. Könnten Sie mir bitte Informationen zu den Kosten und Zeiten schicken? Ich würde auch gern wissen, ob es noch freie Plätze gibt. Vielen Dank im Voraus.<br>Mit freundlichen Grüßen<br>Mehdi',c:['Sie und Ihre (رسمی) با حروف بزرگ','Konjunktiv II برای درخواست (Könnten / würde gern)','ob-Satz با فعل آخر','Vielen Dank im Voraus و Mit freundlichen Grüßen در پایان']},{t:'Einladung (دعوت‌نامه)',n:40,p:'یک دعوت‌نامه برای مهمانی بنویس: مناسبت، زمان، مکان، چیزی که بیاورد (Imperativ) و خواهش برای پاسخ. حداقل ۴۰ کلمه.',ph:'Liebe Anna, ich mache am Samstag um 18 Uhr eine Party.<br>Ich möchte dich herzlich einladen.<br>Wir treffen uns bei mir zu Hause.<br>Bring bitte ... mit!<br>Sag mir bitte bis Donnerstag Bescheid, ob du kommen kannst.',m:'Liebe Anna,<br>ich mache am Samstag um 18 Uhr eine kleine Party und möchte dich herzlich einladen. Wir treffen uns bei mir zu Hause. Bring bitte etwas zu trinken mit! Sag mir bitte bis Donnerstag Bescheid, ob du kommen kannst.<br>Liebe Grüße<br>Mehdi',c:['Zeit (am / um) und Ort (bei mir) sind klar','Imperativ mit du richtig (Bring ... mit!)','ob-Satz mit Verb am Ende','Gruß am Ende']},{t:'Entschuldigung (عذرخواهی)',n:40,p:'از یک دوست عذرخواهی کن که به مهمانیش نرفته‌ای: عذرخواهی، دلیل (Perfekt یا war/hatte) و یک پیشنهاد برای جبران. حداقل ۴۰ کلمه.',ph:'Liebe Anna, es tut mir sehr leid, dass ...<br>Ich hatte plötzlich Fieber und musste im Bett bleiben.<br>Ich hoffe, du bist nicht böse.<br>Wollen wir nächste Woche zusammen essen gehen?',m:'Liebe Anna,<br>es tut mir sehr leid, dass ich gestern nicht zu deiner Party gekommen bin. Ich hatte plötzlich Fieber und musste im Bett bleiben. Ich hoffe, du bist nicht böse. Wollen wir nächste Woche zusammen essen gehen? Ich lade dich ein.<br>Liebe Grüße<br>Mehdi',c:['Es tut mir leid + dass-Satz (Verb am Ende)','Präteritum von haben/müssen oder Perfekt richtig','ein Vorschlag für einen neuen Termin']},{t:'Beschwerde (شکایت)',n:40,p:'یک شکایت کوتاه رسمی بنویس (مثلاً از یک هتل): چه چیزی رزرو کرده‌ای، مشکل چیست، چه می‌خواهی. حداقل ۴۰ کلمه.',ph:'Sehr geehrte Damen und Herren,<br>ich habe vor einer Woche ... gebucht.<br>Leider war das Zimmer schmutzig / funktionierte ... nicht.<br>Ich bin damit nicht zufrieden.<br>Ich hätte gern ... zurück. · Ich bitte um eine schnelle Antwort.',m:'Sehr geehrte Damen und Herren,<br>ich habe vor einer Woche bei Ihnen ein Hotelzimmer gebucht. Leider war das Zimmer sehr schmutzig und die Heizung funktionierte nicht. Ich bin damit nicht zufrieden und hätte gern einen Teil des Geldes zurück. Ich bitte Sie um eine schnelle Antwort.<br>Mit freundlichen Grüßen<br>Mehdi',c:['formelle Anrede und Schluss','vor + Dativ für «vor einer Woche»','Problem klar beschrieben (war / funktionierte nicht)','Wunsch höflich formuliert (Konjunktiv II)']}];
D[13][3]=`<h3>۱) ساختار آزمون نهایی (مطابق برنامهٔ تو)</h3><table><tr><th>بخش</th><th>محتوا</th><th>در این روز</th></tr><tr><td>۱ گرامر</td><td>۴۰ سؤال A1 + A2</td><td>۴۰ سؤال در اپ</td></tr><tr><td>۲ لغات</td><td>۵۰ لغت، مترادف‌ها و متضادها، جمله‌سازی</td><td>لیست بالا + ۸ سؤال + جمله‌سازی در نوشتار</td></tr><tr><td>۳ خواندن و شنیدن</td><td>یک متن A2 + یک تمرین شنیداری</td><td>۴ سؤال خواندن + ۴ سؤال شنیدن (🔊)</td></tr><tr><td>۴ صحبت</td><td>۵ تا ۷ دقیقه صحبت آزاد</td><td>راهنمای بالا (ضبط صدا)</td></tr><tr><td>۵ نوشتن</td><td>ایمیل ۱۰۰ تا ۱۲۰ کلمه</td><td>تمرین نوشتار</td></tr></table><p><b>نمره‌دهی در اپ:</b> تمام سؤال‌ها را با ۱۴ قلب شروع می‌کنی. ۰ تا ۵ اشتباه = عالی (حدود A2 کامل)، ۶ تا ۹ = خوب، ۱۰ تا ۱۳ = نیاز به مرور نقاط ضعف (از «مرور اشتباهات» استفاده کن). اگر قلب‌ها تمام شد، درس را دوباره شروع کن.</p><h3>۲) چکیدهٔ گرامر آخری</h3><table><tr><th>موضوع</th><th>یادت باشد</th></tr><tr><td>فعل و جمله</td><td>شناسه‌ها، فعل جایگاه دوم، جداشدنی، انعکاسی، مُدال، نفی kein/nicht</td></tr><tr><td>حالت‌ها</td><td>Akk/Dat، Wo؟/Wohin؟، Es gibt، zum/beim/vom، helfen/schmecken + Dativ</td></tr><tr><td>زمان‌ها</td><td>Perfekt (haben/sein + Partizip II)، war/hatte، مُدال در Präteritum، seit/vor/nach/bis/ab</td></tr><tr><td>جمله‌های پیچیده</td><td>weil/dass/wenn/ob/obwohl (فعل آخر)، denn/deshalb/trotzdem، Infinitiv mit zu، um ... zu</td></tr><tr><td>صفت و مقایسه</td><td>پایانه‌های صفت، ‑er / am ‑sten، als / wie، gut→besser→am besten</td></tr><tr><td>فعل + حرف اضافه</td><td>warten auf، sich interessieren für، träumen von، Worauf؟/Wofür؟، darauf/dafür</td></tr><tr><td>مؤدبانه</td><td>Könnten Sie ...?، würde، hätte، wäre، wenn + Konjunktiv II</td></tr></table><h3>۳) مترادف و متضاد</h3><table><tr><th>متضاد</th><th>مترادف</th></tr><tr><td>billig ↔ teuer · früh ↔ spät · gesund ↔ krank · laut ↔ leise · schnell ↔ langsam · leicht ↔ schwer · öffnen ↔ schließen · alt ↔ neu / jung · groß ↔ klein · der Anfang ↔ das Ende</td><td>anfangen = beginnen · das Auto = der Wagen · das Geschäft = der Laden · sich unterhalten ≈ sprechen · schon = bereits · glücklich = froh · anrufen = telefonieren · üben = trainieren · die Arbeit = der Job</td></tr></table><h3>۴) ۵۰ لغت کلیدی A2</h3><p dir=ltr>die Erfahrung = تجربه · der Vorschlag = پیشنهاد · der Grund = دلیل · das Problem = مشکل · die Lösung = راه‌حل · die Meinung = نظر · der Vorteil = مزیت · der Nachteil = عیب · die Prüfung = امتحان · der Kurs = کلاس · die Ausbildung = دورهٔ کارآموزی · die Stelle = شغل · der Termin = وقت/قرار · die Reise = سفر · die Umwelt = محیط زیست · die Gesundheit = سلامت · die Wohnung = آپارتمان · die Miete = اجاره · der Nachbar = همسایه · der Kollege = همکار · die Freizeit = وقت آزاد · das Wetter = آب‌وهوا · die Verbindung = اتصال · die Verspätung = تأخیر · besichtigen = بازدید کردن · vereinbaren = تعیین کردن · vorschlagen = پیشنهاد دادن · sich entscheiden = تصمیم گرفتن · sich entschuldigen = عذرخواهی کردن · reklamieren = شکایت کردن · umsteigen = عوض کردن (قطار) · üben = تمرین کردن · vergessen = فراموش کردن · erklären = توضیح دادن · empfehlen = توصیه کردن · wichtig = مهم · möglich = ممکن · notwendig = ضروری · zufrieden = راضی · pünktlich = به موقع · gemütlich = دنج · anstrengend = خسته‌کننده · interessant = جالب · langweilig = کسل‌کننده · vielleicht = شاید · normalerweise = معمولاً · trotzdem = با این حال · deshalb = به همین دلیل · obwohl = با اینکه</p><h3>۵) صحبت آزاد (۵ تا ۷ دقیقه)</h3><p>یک کارت موضوع را انتخاب کن و با ضبط صدا صحبت کن: <b>Mein Tag · Mein letztes Wochenende · Meine Wohnung · Mein Traumurlaub · Mein Beruf / meine Ausbildung · Sprachen lernen</b>. ساختار: ۱ دقیقه معرفی → ۲ دقیقه موضوع → ۲ دقیقه تجربه (Perfekt) → ۱ دقیقه نظر و برنامهٔ آینده. چک‌لیست: فعل جایگاه دوم؛ حداقل ۳ Nebensatz؛ Perfekt و Präteritum درست؛ یک مقایسه؛ یک جملهٔ مؤدبانه؛ بدون مکث طولانی. متن پیاده‌شده را با من همین‌جا چک کن.</p><h3>۶) نوشتن</h3><p>یک ایمیل ۱۰۰ تا ۱۲۰ کلمه‌ای بنویس (دکمهٔ «نوشتار» پایین همین صفحه). در آزمون واقعی معمولاً ۴ نکته داده می‌شود که همه را باید پوشش دهی.</p>`;
setE(13,['gehen = حرکت → sein: bin gegangen.','warten auf + Akkusativ.','شرط غیرواقعی: wenn + wäre.','Lust haben + zu + مصدر؛ heute قید زمان.','Wo؟ → Dativ؛ Wand مؤنث → der.']);

['f','Du ___ aus Teheran. (kommen)','kommst','kommen','du + ریشه + st.'],['f','Er ___ jeden Morgen um 6 Uhr auf. (aufstehen)','steht','aufstehen','جداشدنی: steht ... auf.'],['f','Ich habe ___ Hunger.','keinen','','Hunger مذکر + Akk → keinen.'],['f','Gestern habe ich Pizza ___. (essen)','gegessen','essen','Partizip II: gegessen.'],['f','Ich ___ gestern krank. (sein)','war','sein','sein در Präteritum: ich war.'],['f','Ich bleibe zu Hause, ___ ich krank bin.','weil','','weil → فعل آخر.'],['f','Ich freue mich ___ das Wochenende.','auf','','sich freuen auf + Akk.'],['f','Berlin ist ___ als Hamburg. (groß)','größer','groß','groß → größer + als.'],['f','Ich ___ gern einen Kaffee. (haben)','hätte','haben','Konjunktiv II: hätte.'],['f','___ Sie mir bitte helfen? (können)','Könnten','können','مؤدبانه: Könnten.'],
['m','Wo ___ du? – In Berlin.',['wohnst','wohne','wohnt'],'du → wohnst.'],['m','Das ist ___ Mutter.',['meine','mein','meinen'],'Mutter مؤنث → meine.'],['m','Ich lege das Buch auf ___ Tisch.',['den','dem','der'],'Wohin؟ → Akk مذکر → den.'],['m','Das Buch liegt auf ___ Tisch.',['dem','den','der'],'Wo؟ → Dativ → dem.'],['m','Es ___ einen Park in der Nähe.',['gibt','hat','ist'],'Es gibt + Akkusativ.'],['m','___ bitte die Tür zu! (du)',['Mach','Machst','Macht'],'Imperativ du: Mach ... zu.'],['m','Ich helfe ___ Frau.',['der','die','den'],'helfen + Dativ.'],['m','Ich ___ gestern nicht kommen. (können)',['konnte','kann','könnte'],'Präteritum: konnte.'],['m','Ich habe ___ drei Tagen Fieber.',['seit','vor','ab'],'seit = ادامه تا الان.'],['m','Ich war ___ einer Woche beim Arzt.',['vor','seit','bis'],'vor + Dativ = پیش.'],['m','Ich fühle ___ nicht gut.',['mich','mir','sich'],'sich fühlen: ich → mich.'],['m','Ich ___ nach Hause gefahren.',['bin','habe','war'],'fahren → sein.'],['m','Er hat Deutsch ___.',['gelernt','lernte','gelern'],'منظم: gelernt.'],['m','Ich glaube, ___ er recht hat.',['dass','das','weil'],'dass با دو s.'],['m','Ich habe keine Lust, früh ___.',['aufzustehen','zu aufstehen','aufstehen zu'],'auf + zu + stehen.'],['m','Das ist ein ___ Mann.',['netter','nette','nettes'],'Mann مذکر + ein → ‑er.'],['m','Ich wohne in einer ___ Stadt.',['großen','große','großer'],'Dativ مؤنث + einer → ‑en.'],['m','Ich interessiere mich ___ Musik.',['für','auf','über'],'sich interessieren für.'],['m','Es regnet, ___ bleiben wir zu Hause.',['deshalb','obwohl','weil'],'deshalb + فعل.'],['m','___ es regnet, gehen wir spazieren.',['Obwohl','Deshalb','Denn'],'obwohl + فعل آخر.'],['m','___ Sie bitte das Fenster schließen?',['Würden','Werden','Wurden'],'Würden + مصدر.'],['m','Wenn ich du ___, würde ich zum Arzt gehen.',['wäre','war','bin'],'Konjunktiv II: wäre.'],
['o','Ich bin gestern ins Kino gegangen','دیروز به سینما رفتم','Perfekt: bin ... gegangen.'],['o','Ich möchte einen Termin vereinbaren','می‌خواهم وقت بگیرم','möchte دوم؛ مصدر آخر.'],['o','Meiner Meinung nach ist Deutsch nicht schwer','به نظر من آلمانی سخت نیست','nach + Dativ؛ ist دوم.'],
['m','Das Gegenteil von «billig» ist ___',['teuer','schnell','laut'],'billig ≠ teuer.'],['m','Das Gegenteil von «früh» ist ___',['spät','leise','alt'],'früh ≠ spät.'],['m','Das Gegenteil von «gesund» ist ___',['krank','schwer','neu'],'gesund ≠ krank.'],['m','Synonym von «anfangen» ist ___',['beginnen','aufhören','bleiben'],'anfangen = beginnen.'],['m','Synonym von «das Auto» ist ___',['der Wagen','das Fahrrad','der Zug'],'Auto = Wagen.'],['m','Synonym von «sich unterhalten» ist ___',['sprechen','schlafen','warten'],'sich unterhalten ≈ sprechen.'],['m','Das Gegenteil von «öffnen» ist ___',['schließen','suchen','sehen'],'öffnen ≠ schließen.'],['m','Das Gegenteil von «leicht» ist ___',['schwer','kalt','nett'],'leicht ≠ schwer.'],
['m','Lisa wohnt seit zwei Jahren in München und fährt jeden Tag mit der S-Bahn zur Arbeit. — Wie fährt Lisa zur Arbeit?',['mit der S-Bahn','mit dem Auto','zu Fuß'],'در متن: mit der S-Bahn zur Arbeit.'],['m','Am Wochenende geht Lisa gern wandern, weil sie die Berge liebt. — Warum geht Lisa gern wandern?',['Sie liebt die Berge.','Sie hat ein Auto.','Sie arbeitet im Büro.'],'دلیل: weil sie die Berge liebt.'],['m','Hallo Jonas, am Samstag habe ich Geburtstag. Die Feier beginnt um 18 Uhr bei mir zu Hause. Bring bitte etwas zu essen mit. Sag mir bis Donnerstag Bescheid. — Wann beginnt die Feier?',['um 18 Uhr','um 8 Uhr','am Donnerstag'],'در متن: um 18 Uhr.'],['m','Hallo Jonas, am Samstag habe ich Geburtstag. Die Feier beginnt um 18 Uhr bei mir zu Hause. Bring bitte etwas zu essen mit. Sag mir bis Donnerstag Bescheid. — Was soll Jonas mitbringen?',['etwas zu essen','ein Geschenk','Getränke'],'در متن: Bring bitte etwas zu essen mit.'],
['m','Wann fährt der Zug nach Hamburg ab?',['10:30 Uhr','10:13 Uhr','7:30 Uhr'],'zehn Uhr dreißig = ۱۰:۳۰.','Achtung, der Zug nach Hamburg fährt heute um zehn Uhr dreißig von Gleis sieben ab.'],['m','Was ist das Problem?',['Die Heizung funktioniert nicht.','Der Fernseher ist kaputt.','Die Tür ist offen.'],'در صدا: Meine Heizung funktioniert nicht.','Guten Tag, hier ist Herr Weber. Meine Heizung funktioniert nicht, und es ist sehr kalt in der Wohnung. Können Sie bitte heute noch kommen?'],['m','Was möchte die Frau bestellen?',['Suppe, Wasser und Kaffee','Nur einen Kaffee','Pizza und Saft'],'در صدا: Suppe, ein Glas Wasser und danach einen Kaffee.','Ich möchte bitte eine Suppe und ein Glas Wasser. Und danach hätte ich gern einen Kaffee.'],['m','Wie ist das Wetter morgen?',['Im Süden scheint die Sonne.','Es schneit überall.','Es ist sehr heiß.'],'در صدا: im Süden sonnig, im Norden bewölkt.','Morgen ist es im Norden bewölkt und im Süden sonnig. Die Temperaturen liegen bei zwanzig Grad.']);
D[13][4]=[{t:'Abschluss-E-Mail (ایمیل نهایی)',n:100,p:'به یک دوست که مدتی ندیده‌ای ایمیل بنویس (۱۰۰ تا ۱۲۰ کلمه) و همهٔ این نکات را پوشش بده: ۱) احوال‌پرسی ۲) آخر هفتهٔ گذشته چه کار کردی (Perfekt) ۳) دعوت به جشن تولدت (زمان و مکان) ۴) چه غذایی می‌پزی و چیزی که بیاورد (Imperativ) ۵) درخواست پاسخ تا روزی مشخص.',ph:'Liebe Anna, wie geht es dir? · Ich habe lange nichts von dir gehört.<br>Letztes Wochenende bin ich ... gefahren und habe ... gemacht.<br>Am ... habe ich Geburtstag und möchte dich herzlich einladen.<br>Die Feier beginnt um ... Uhr bei mir zu Hause.<br>Ich koche ... · Bring bitte ... mit!<br>Sag mir bitte bis ... Bescheid, ob du kommen kannst. · Liebe Grüße',m:'Liebe Anna,<br>wie geht es dir? Ich habe lange nichts von dir gehört. Letztes Wochenende bin ich mit Freunden an den See gefahren und wir haben viel gegrillt. Das Wetter war schön, obwohl es morgens ein bisschen kalt war. Am Samstag, dem 15. Juni, habe ich Geburtstag und ich möchte dich herzlich einladen. Die Feier beginnt um 18 Uhr bei mir zu Hause. Ich koche Reis mit Hähnchen und Salat. Magst du das? Bring bitte etwas zu trinken mit. Wenn du nicht kommen kannst, sag mir bitte bis Donnerstag Bescheid. Ich würde mich sehr freuen, dich zu sehen!<br>Liebe Grüße<br>Mehdi',c:['همهٔ ۵ نکتهٔ اسنادی پوشش داده شده‌اند','بین ۱۰۰ تا ۱۲۰ کلمه نوشته‌ام','Perfekt درست (bin gefahren / haben gegrillt) و یک war/hatte','حداقل ۲ Nebensatz (obwohl, wenn, ob, dass) با فعل آخر','یک Imperativ du (Bring ... mit!) و یک جملهٔ مؤدبانه/آرزو (würde / hätte)','شروع و پایان دوستانه، حروف بزرگ اسم‌ها، فعل جایگاه دوم']},{t:'Eigene Sätze bilden (جمله‌سازی با لغات)',n:50,p:'با هر یک از این ۸ لغت یک جملهٔ كامل بساز: der Vorschlag · sich entscheiden · obwohl · deshalb · pünktlich · die Prüfung · vergessen · zufrieden. حداقل ۵۰ کلمه کل.',ph:'Ich habe einen Vorschlag: ...<br>Ich habe mich für ... entschieden.<br>Obwohl ..., ... · ..., deshalb ...<br>Er ist immer pünktlich. · Ich habe ... vergessen.<br>Ich bin mit ... zufrieden.',m:'Ich habe einen Vorschlag: Wir könnten zusammen lernen. Ich habe mich für einen Deutschkurs entschieden. Obwohl die Prüfung schwer ist, habe ich keine Angst. Ich bin oft müde, deshalb schlafe ich früh. Mein Lehrer ist immer pünktlich. Ich habe leider meine Hausaufgaben vergessen. Ich bin mit meinem Ergebnis zufrieden.',c:['جمله‌ها کاملند و فعل صحیح دارند','obwohl با فعل آخر، deshalb با فعل بلافاصله بعد','Perfekt با vergessen / sich entscheiden درست است']}];
D[13][3]=`<h3>۰) ساختار آزمون نهایی و زمان‌بندی</h3><table><tr><th>بخش</th><th>در اپ</th><th>زمان پیشنهادی</th></tr><tr><td>۱) گرامر (A1 + A2)</td><td>۴۰ سؤال</td><td>۴۵ دقیقه</td></tr><tr><td>۲) لغات</td><td>۲۰ سؤال (مترادف، متضاد، معنی، جمله‌سازی) + مرور ۵۰ لغت در اینجا</td><td>۳۰ دقیقه</td></tr><tr><td>۳) خواندن و شنیدن</td><td>۳ سؤال خواندن + ۳ سؤال شنیداری (🔊)</td><td>۲۰ دقیقه</td></tr><tr><td>۴) صحبت</td><td>خارج از اپ (ضبط صدا)</td><td>۵ تا ۷ دقیقه</td></tr><tr><td>۵) نوشتن</td><td>ایمیل ۱۰۰ تا ۱۲۰ کلمه‌ای (دکمهٔ نوشتار)</td><td>۳۰ دقیقه</td></tr></table><p><b>نکته‌های آزمون:</b> در آزمون نه درسنامه نگاه کن و نه جدول. هر اشتباه یک قلب کم می‌کند و در این آزمون با ۱۷ قلب شروع می‌کنی. <b>ارزیابی:</b> باقی‌مانده ۱۲ قلب یا بیشتر (۵ اشتباه یا کمتر) = عالی · ۷ تا ۱۱ قلب = خوب · ۳ تا ۶ قلب = باید مرور شود · کمتر از ۳ = هفتهٔ دوم را دوباره مرور کن. بعد از آزمون گزینهٔ «مرور اشتباهات» را بزن و هر دلیل را بخوان.</p><h3>۱) گرامر – نقشهٔ مرور</h3><table><tr><th>روز</th><th>موضوع کلیدی</th></tr><tr><td>۱–۲</td><td>صرف فعل، W-Frage، آرتیکل، mein/meine، جداشدنی، انعکاسی، مُدال</td></tr><tr><td>۳–۴</td><td>Akk/Dat، Wo؟/Wohin؟، Es gibt، kein/nicht، Imperativ، مقدار</td></tr><tr><td>۵–۶</td><td>Perfekt، war/hatte، مُدال در گذشته، seit/vor/nach/bis/ab</td></tr><tr><td>۸–۹</td><td>weil/dass/wenn/ob، denn/deshalb، Infinitiv mit zu، صفت، als/wie</td></tr><tr><td>۱۰–۱۲</td><td>فعل + حرف اضافه، da-/wo-، obwohl/trotzdem، Konjunktiv II</td></tr></table><h3>۲) لغات – ۵۰ کلمهٔ ضروری</h3><p dir=ltr>die Familie = خانواده · der Beruf = شغل · die Wohnung = آپارتمان · das Zimmer = اتاق · die Küche = آشپزخانه · der Schrank = کمد · die Stadt = شهر · der Bahnhof = ایستگاه قطار · die Haltestelle = ایستگاه (اتوبوس) · die Fahrkarte = بلیط · die Verspätung = تأخیر · umsteigen = عوض کردن وسیله · abfahren = حرکت کردن · ankommen = رسیدن · der Urlaub = تعطیلات · das Hotel = هتل · buchen = رزرو کردن · das Wetter = آب‌وهوا · das Brot = نان · das Gemüse = سبزیجات · die Rechnung = صورت‌حساب · bestellen = سفارش دادن · der Termin = وقت/قرار · absagen = لغو کردن · krank = بیمار · gesund = سالم · das Fieber = تب · die Tablette = قرص · der Rücken = کمر · die Erkältung = سرماخوردگی · der Vorteil = مزیت · der Nachteil = عیب · der Grund = دلیل · der Wunsch = آرزو · die Meinung = نظر · die Ausbildung = آموزش حرفه‌ای · die Prüfung = آزمون · bestehen = قبول شدن · sich bewerben = درخواست کار دادن · der Lebenslauf = رزومه · die Miete = اجاره · der Vermieter = صاحب‌خانه · kaputt = خراب · reklamieren = اعتراض به کالا · umtauschen = عوض کردن (کالا) · zufrieden = راضی · die Umwelt = محیط زیست · der Müll = زباله · sparen = صرفه‌جویی کردن · sich entschuldigen = عذرخواهی کردن</p><h3>۳) صحبت آزاد (۵ تا ۷ دقیقه)</h3><p>یک موضوع روزمره انتخاب کن و ضبط کن: «من و زندگیم» · «یک روز معمولی» · «آخرین سفرم» · «برنامه‌های آینده‌ام». ساختار: معرفی → موضوع اصلی (با Perfekt و weil/dass) → نظر و نتیجه (با Konjunktiv II یا مزایا/معایب). بعد متن پیاده‌شده‌اش را برای من بفرست تا اشتباه‌ها را تصحیح کنم.</p><h3>۴) نوشتن</h3><p>دکمهٔ «نوشتار» را بزن و ایمیل ۱۰۰ تا ۱۲۰ کلمه‌ایت را بنویس. چک‌لیست در خود صفحه هست؛ بعد از نوشتن متن را کپی کن و برای تصحیح به من بفرست.</p>`;

D[13][4]=[{t:'Abschlussaufgabe: E-Mail (ایمیل پایانی)',n:100,p:'یک ایمیل ۱۰۰ تا ۱۲۰ کلمه‌ای به یک دوست بنویس: از دعوتش تشکر کن، نمی‌توانی بیایی و دلیلش را بگو (weil)، یک تجربهٔ اخیر را تعریف کن (Perfekt + obwohl)، یک پیشنهاد بده (Konjunktiv II) و یک سؤال بپرس (ob / Worauf ...). از یک صفت با پایانهٔ درست و یک فعل با حرف اضافهٔ ثابت هم استفاده کن. حداقل ۱۰۰ کلمه.',ph:'Liebe Anna, wie geht es dir? · Vielen Dank für deine Einladung!<br>Leider kann ich ... nicht kommen, weil ich ... muss.<br>Letztes Wochenende bin ich ... gefahren und habe ... gebucht.<br>Das Wetter war toll, obwohl ...<br>Wenn du Zeit hast, könnten wir ... · Ich würde gern wissen, ob ...<br>Ich interessiere mich auch für ... · Schreib mir bitte bald! · Liebe Grüße',m:'Liebe Anna,<br>wie geht es dir? Vielen Dank für deine Einladung zu deiner Party! Leider kann ich am Samstag nicht kommen, weil ich arbeiten muss. Ich habe seit zwei Wochen viel zu tun und freue mich schon sehr auf meinen Urlaub. Letztes Wochenende bin ich mit Freunden in die Berge gefahren, und wir haben ein schönes Hotel gebucht. Das Wetter war toll, obwohl es kalt war. Wenn du Zeit hast, könnten wir nächste Woche zusammen essen gehen. Ich würde gern wissen, ob du schon Pläne hast. Ich interessiere mich auch für deinen neuen Job. Schreib mir bitte bald!<br>Liebe Grüße<br>Mehdi',c:['تعداد کلمات بین ۱۰۰ تا ۱۲۰ است','هر جملهٔ اصلی فعل جایگاه دوم دارد و هر Nebensatz (weil/obwohl/ob/wenn) فعل آخر','Perfekt با haben/sein و Partizip II درست نوشته شده','یک جمله با Konjunktiv II (könnten / würde gern)','یک فعل با حرف اضافهٔ ثابت با حالت درست (sich interessieren für)','پایانهٔ صفت‌ها و حروف بزرگ اسم‌ها را چک کرده‌ام','شروع و پایان ایمیل دوستانه است (Liebe / Liebe Grüße)']}];
